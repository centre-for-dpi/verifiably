apiVersion: v1
kind: Service
metadata:
  name: {{ include "vca.fullname" . }}
  labels:
    {{- include "vca.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vca.selectorLabels" . | nindent 4 }}

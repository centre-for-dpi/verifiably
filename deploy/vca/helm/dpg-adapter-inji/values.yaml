# SPDX-License-Identifier: Apache-2.0
# Values of the dpg-adapter-inji service chart (ADR-008 decision 5).
replicaCount: 1

image:
  repository: ghcr.io/centre-for-dpi/vca-dpg-adapter-inji
  tag: ""
  pullPolicy: IfNotPresent

# The container listens on this port and the Service sends traffic to it.
containerPort: 8080
listenVariable: VCA_INJI_LISTEN

service:
  type: ClusterIP
  port: 8080

# The container runs as this non-root user.
runAsUser: 65532

# Plain settings become a ConfigMap. Secrets stay in a Secret that
# the operator creates, named here.
config: {}
existingSecret: vca-secrets

# The Secrets that hold the identity of the service on the cluster
# network (ADR-075). Empty names <release>-<chart>-peer for the
# variables and <release>-<chart>-peer-key for the private key, which
# "vca peer secrets --release <release>" writes.
peer:
  secret: ""
  keySecret: ""

persistence:
  enabled: true
  mountPath: /data
  existingClaim: ""

# Volumes that the service shares with a container of its DPG stack.
# The Inji issuer writes the VCA claims store here, and the Postgres of
# Inji Certify reads it through file_fdw (ADR-051). Name a claim that
# both mount. Without one the chart mounts nothing, and the issuer
# stages no subject.
stackMounts:
  - name: inji-claims
    mountPath: /vca/claims
    env: VCA_INJI_CLAIMS_DIR
    existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi

nameOverride: ""
fullnameOverride: ""

# The roles this service runs for (ADR-074). Its templates render only
# when the umbrella chart turns one of them on under global.roles. A
# chart installed alone renders as before.
roles:
  - issuer
  - holder
  - verifier

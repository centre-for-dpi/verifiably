# SPDX-License-Identifier: Apache-2.0
# Values of the wallet-auth service chart (ADR-008 decision 5).
replicaCount: 1

image:
  repository: ghcr.io/centre-for-dpi/vca-wallet-auth
  tag: ""
  pullPolicy: IfNotPresent

# The container listens on this port and the Service sends traffic to it.
containerPort: 8083
listenVariable: VCA_WALLET_AUTH_LISTEN

service:
  type: ClusterIP
  port: 8083

# The container runs as this non-root user.
runAsUser: 65532

# Plain settings become a ConfigMap. Secrets stay in a Secret that
# the operator creates, named here.
config: {}
existingSecret: vca-secrets

persistence:
  enabled: true
  mountPath: /data
  existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi

nameOverride: ""
fullnameOverride: ""

# The theme file of every page (ADR-032). The pod mounts the ConfigMap
# that holds theme.yaml under mountPath and reads it at start. An empty
# configMap names <release>-theme, which the umbrella chart makes from
# its files/theme.yaml or from --set-file global.theme.file. The pod
# rolls when global.theme.file changes.
theme:
  enabled: true
  configMap: ""
  mountPath: /etc/vca

global:
  theme:
    file: ""

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vca.fullname" . }}
  labels:
    {{- include "vca.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vca.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vca.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        # A new peer Secret rolls the pods at the next upgrade (ADR-075).
        checksum/peer: {{ include "vca.peerChecksum" . }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsUser }}
        fsGroup: {{ .Values.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "vca.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "vca.fullname" . }}
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
            # The identity of the service on the cluster network (ADR-075).
            # vca peer secrets writes the Secret. The pod does not start
            # without it. The private key is a file of the key Secret.
            - secretRef:
                name: {{ .Values.peer.secret | default (printf "%s-%s-peer" .Release.Name .Chart.Name) }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The private key of the service, a file of a Secret of its
            # own, so it stays out of the environment (ADR-075).
            - name: peer-key
              mountPath: /run/vca/peer
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: peer-key
          secret:
            secretName: {{ .Values.peer.keySecret | default (printf "%s-%s-peer-key" .Release.Name .Chart.Name) }}
            # 0440: the group of fsGroup reads the key.
            defaultMode: 288
            items:
              - key: key.jwk
                path: key.jwk
        {{- if .Values.persistence.enabled }}
        - name: data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}

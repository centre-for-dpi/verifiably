# SPDX-License-Identifier: Apache-2.0
# Values of the verifier-policy service chart (ADR-008 decision 5).
replicaCount: 1

image:
  repository: ghcr.io/centre-for-dpi/vca-verifier-policy
  tag: ""
  pullPolicy: IfNotPresent

# The container listens on this port and the Service sends traffic to it.
containerPort: 8086
listenVariable: VCA_VERIFIER_POLICY_LISTEN

service:
  type: ClusterIP
  port: 8086

# The container runs as this non-root user.
runAsUser: 65532

# Plain settings become a ConfigMap. Secrets stay in a Secret that
# the operator creates, named here.
config: {}
existingSecret: vca-secrets

persistence:
  enabled: true
  mountPath: /data
  existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi

nameOverride: ""
fullnameOverride: ""

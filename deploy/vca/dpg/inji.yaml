# SPDX-License-Identifier: Apache-2.0
# MOSIP Inji stack and eSignet (ADR-008 decision 3).
# The versions come from verifiably-go/docs/dpg-matrix.md:
#   Inji Certify 0.14.0, Inji Web 0.16.0, Mimoto 0.21.0,
#   Inji Verify 0.16.0, eSignet 1.5.1, mock identity 0.10.1,
#   Keycloak 25.0.
# The main compose file pulls this file in with include.
# Every host port binds to VCA_BIND, which vca setup sets to 127.0.0.1
# on a public host.
#
# Start it with: vca deploy --role issuer --dpg inji

services:
  inji-keycloak:
    image: quay.io/keycloak/keycloak:25.0
    profiles: [issuer-inji, holder-inji, verifier-inji, admin-inji]
    container_name: inji-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    # The administrator name and the generated password come from the
    # .env of the stack directory, which vca setup writes with mode 0600.
    # No default password exists (ADR-035 decision 7).
    env_file:
      - path: ../keycloak-inji/.env
        required: true
    environment:
      KC_HEALTH_ENABLED: "true"
      # A reverse proxy in front of the host port sends X-Forwarded
      # headers. Keycloak builds its URLs from them, so the login page
      # works behind TLS.
      KC_PROXY_HEADERS: xforwarded
    volumes:
      # The stack directory holds one realm per role, vca-<role>-realm.json,
      # which vca setup writes (ADR-035 decision 1). Keycloak imports every
      # JSON file of the directory at its first start and skips the .env.
      - ../keycloak-inji:/opt/keycloak/data/import:ro
    ports:
      - "${VCA_BIND:-0.0.0.0}:${INJI_KEYCLOAK_HOST_PORT:-17080}:8080"
    networks:
      - vca

  # Inji Certify 0.14.0 (P6-I0). The layout follows
  # docker-compose/docker-compose-injistack/docker-compose.yaml of the
  # release, and dpg/inji/certify/SOURCE.md names every file. Certify
  # checks every access token against one issuer and one key set, so the
  # stack runs it twice on one database and one key store:
  #   - inji-certify is its own authorization server. It serves the
  #     adapter: the pre-authorized code, the presentation during
  #     issuance, the configuration API, the ledger, and the keys.
  #   - inji-certify-esignet takes the tokens of the stack eSignet. It
  #     serves a claim in Inji Web and an authorization code offer.
  inji-certify-postgres:
    # certify_init.sql names the locale en_US.UTF-8, so the image is the
    # Debian one.
    image: postgres:15.8
    profiles: [issuer-inji]
    container_name: inji-certify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${INJI_DB_PASSWORD:-certify}
      # vca_certify_did.sql names this DID in the sample configuration.
      INJI_CERTIFY_DID: ${INJI_CERTIFY_DID:-did:web:inji-certify-nginx}
    volumes:
      - inji-certify-db:/var/lib/postgresql/data
      - ./dpg/inji/certify/certify_init.sql:/docker-entrypoint-initdb.d/certify_init.sql:ro
      - ./dpg/inji/certify/vca_certify_did.sql:/docker-entrypoint-initdb.d/vca_certify_did.sql:ro
    networks:
      - vca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inji_certify"]
      interval: 10s
      timeout: 5s
      retries: 10

  inji-certify:
    image: injistack/inji-certify-with-plugins:0.14.0
    profiles: [issuer-inji]
    container_name: inji-certify
    restart: unless-stopped
    # The release runs Certify as root, and the image drops to
    # container_user.
    user: root
    depends_on:
      inji-certify-postgres:
        condition: service_healthy
      inji-verify-service:
        condition: service_started
      inji-certify-nginx:
        condition: service_started
    environment: &certify-environment
      container_user: mosip
      active_profile_env: default,preauth
      SPRING_CONFIG_NAME: certify
      SPRING_CONFIG_LOCATION: /home/mosip/config/
      enable_certify_artifactory: "false"
      download_hsm_client: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://inji-certify-postgres:5432/inji_certify?currentSchema=certify
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${INJI_DB_PASSWORD:-certify}
      INJI_CERTIFY_KEYSTORE_PASSWORD: ${INJI_CERTIFY_KEYSTORE_PASSWORD:-certify}
      INJI_CERTIFY_DID: ${INJI_CERTIFY_DID:-did:web:inji-certify-nginx}
      # The browser address of the stack eSignet. Its tokens carry it.
      INJI_ESIGNET_PUBLIC_URL: ${INJI_ESIGNET_PUBLIC_URL:-http://localhost:17082}
      # Presentation during issuance (P6-I4b). Certify asks Inji Verify
      # of this stack for the presentation it wants before it issues,
      # and reads the definition over HTTP. The names are the
      # "Verify Service Configuration" of certify-default.properties of
      # the injistack compose folder of Certify v0.14.0.
      MOSIP_CERTIFY_VERIFY_SERVICE_BASE_URL: http://inji-verify-service:8080
      MOSIP_CERTIFY_VERIFY_SERVICE_VP_REQUEST_ENDPOINT: http://inji-verify-service:8080/v1/verify/vp-request
      MOSIP_CERTIFY_VERIFY_SERVICE_VP_RESULT_ENDPOINT: http://inji-verify-service:8080/v1/verify/vp-result
      MOSIP_CERTIFY_VERIFY_SERVICE_VERIFIER_CLIENT_ID: certify-verifier-client
      MOSIP_CERTIFY_VP_REQUEST_CONFIG_FILE_URL: http://inji-certify-nginx/vp_request_config.json
    volumes:
      - ./dpg/inji/certify/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./dpg/inji/certify/certify-preauth.properties:/home/mosip/config/certify-preauth.properties:ro
      - ./dpg/inji/certify/vp_request_config.json:/home/mosip/config/vp_request_config.json:ro
      # The key manager keeps its PKCS #12 store here. Both Certify
      # containers sign with its keys.
      - inji-certify-keys:/home/mosip/CERTIFY_PKCS12
    ports:
      - "${VCA_BIND:-0.0.0.0}:${INJI_CERTIFY_HOST_PORT:-17081}:8090"
    networks:
      - vca
    # Readiness follows the key setup of the start, so the second
    # Certify reads a full key store. The image has bash, not curl.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /v1/certify/actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  inji-certify-esignet:
    image: injistack/inji-certify-with-plugins:0.14.0
    profiles: [issuer-inji]
    container_name: inji-certify-esignet
    restart: unless-stopped
    user: root
    depends_on:
      inji-certify:
        condition: service_healthy
      inji-esignet:
        condition: service_started
    environment:
      <<: *certify-environment
      active_profile_env: default,csvdp-farmer
    volumes:
      - ./dpg/inji/certify/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./dpg/inji/certify/certify-csvdp-farmer.properties:/home/mosip/config/certify-csvdp-farmer.properties:ro
      - ./dpg/inji/certify/farmer_identity_data.csv:/home/mosip/config/farmer_identity_data.csv:ro
      - ./dpg/inji/certify/vp_request_config.json:/home/mosip/config/vp_request_config.json:ro
      - inji-certify-keys:/home/mosip/CERTIFY_PKCS12
    networks:
      - vca

  # The presentation definition of the interactive authorization, served
  # over HTTP as the certify-nginx of the injistack compose file does,
  # and the root of each Certify, where OID4VCI puts the issuer metadata.
  inji-certify-nginx:
    image: nginx:1.27.2-alpine
    profiles: [issuer-inji]
    container_name: inji-certify-nginx
    restart: unless-stopped
    volumes:
      - ./dpg/inji/certify/certify-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dpg/inji/certify/vp_request_config.json:/usr/share/nginx/html/vp_request_config.json:ro
    networks:
      - vca

  inji-esignet:
    image: mosipid/esignet-with-plugins:1.5.1
    profiles: [issuer-inji, holder-inji]
    container_name: inji-esignet
    restart: unless-stopped
    environment:
      MOSIP_ESIGNET_HOST: ${INJI_ESIGNET_HOST:-inji-esignet}
    ports:
      - "${VCA_BIND:-0.0.0.0}:${INJI_ESIGNET_HOST_PORT:-17082}:8088"
    networks:
      - vca

  inji-mock-identity:
    image: mosipid/mock-identity-system:0.10.1
    profiles: [issuer-inji, holder-inji]
    container_name: inji-mock-identity
    restart: unless-stopped
    ports:
      - "${VCA_BIND:-0.0.0.0}:${INJI_MOCK_IDENTITY_HOST_PORT:-17083}:8082"
    networks:
      - vca

  # The holder part: Mimoto 0.21.0 and Inji Web 0.16.0 (P6-I7d). The
  # layout follows docker-compose/docker-compose.yml of mosip/mimoto
  # v0.21.0 and of mosip/inji-web v0.16.0, and dpg/inji/mimoto/SOURCE.md
  # names every file. Mimoto keeps its data in a Postgres of its own,
  # which the init script of the release prepares, and its sessions in
  # Redis. Its token login provider "google" trusts the holder realm of
  # the stack Keycloak, so the adapter opens the wallet of the holder
  # with the ID token of the holder login.
  inji-mimoto-postgres:
    # The init script names the locale en_US.UTF-8, so the image is the
    # Debian one.
    image: postgres:15.8
    profiles: [holder-inji]
    container_name: inji-mimoto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${INJI_MIMOTO_DB_PASSWORD:-mimoto}
    volumes:
      - inji-mimoto-db:/var/lib/postgresql/data
      - ./dpg/inji/mimoto/mimoto_init.sql:/docker-entrypoint-initdb.d/mimoto_init.sql:ro
    networks:
      - vca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inji_mimoto"]
      interval: 10s
      timeout: 5s
      retries: 10

  inji-mimoto-redis:
    image: redis:7.4.1-alpine
    profiles: [holder-inji]
    container_name: inji-mimoto-redis
    restart: unless-stopped
    volumes:
      - inji-mimoto-redis:/data
    networks:
      - vca

  inji-mimoto:
    image: injistack/mimoto:0.21.0
    profiles: [holder-inji]
    container_name: inji-mimoto
    restart: unless-stopped
    # The release runs as root in its own compose file and writes the
    # key store of its key manager.
    user: root
    depends_on:
      inji-mimoto-postgres:
        condition: service_healthy
      inji-mimoto-redis:
        condition: service_started
      inji-web:
        condition: service_started
    # vca dpg bootstrap inji --role holder writes the password of the
    # client key store here. Mimoto starts without it, and a claim in
    # Inji Web needs it.
    env_file:
      - path: ../mimoto-inji/.env
        required: false
    environment:
      container_user: mosip
      active_profile_env: default
      SPRING_CONFIG_NAME: mimoto
      SPRING_CONFIG_LOCATION: /home/mosip/
      SPRING_CLOUD_BOOTSTRAP_LOCATION: /home/mosip/mimoto-bootstrap.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://inji-mimoto-postgres:5432/inji_mimoto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${INJI_MIMOTO_DB_PASSWORD:-mimoto}
      MIMOTO_KEYMANAGER_PASSWORD: ${INJI_MIMOTO_KEYSTORE_PASSWORD:-mimoto}
      # The browser reaches Mimoto through Inji Web, and the holder
      # realm through the host port of the stack Keycloak.
      INJI_WEB_PUBLIC_URL: ${INJI_WEB_PUBLIC_URL:-http://localhost:17085}
      MIMOTO_HOLDER_LOGIN_URL: ${INJI_MIMOTO_HOLDER_LOGIN_URL:-http://localhost:17080}
      MIMOTO_TOKEN_LOGIN_ISSUER: ${INJI_MIMOTO_TOKEN_LOGIN_ISSUER:-http://inji-keycloak:8080/realms/vca-holder-realm}
      MIMOTO_TOKEN_LOGIN_CLIENT_ID: ${INJI_MIMOTO_TOKEN_LOGIN_CLIENT_ID:-vca-holder}
    volumes:
      - ./dpg/inji/mimoto/mimoto-default.properties:/home/mosip/mimoto-default.properties:ro
      - ./dpg/inji/mimoto/mimoto-bootstrap.properties:/home/mosip/mimoto-bootstrap.properties:ro
      - ./dpg/inji/mimoto/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json:ro
      - ./dpg/inji/mimoto/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json:ro
      - ../mimoto-inji:/home/mosip/certs:ro
      - inji-mimoto-keys:/home/mosip/keymanager
    ports:
      - "${VCA_BIND:-0.0.0.0}:${INJI_MIMOTO_HOST_PORT:-17084}:8099"
    networks:
      vca:
        # The nginx file of Inji Web 0.16.0 sends /v1/mimoto/ to
        # mimoto-service:8099.
        aliases: [mimoto-service]

  inji-web:
    image: injistack/inji-web:0.16.0
    profiles: [holder-inji]
    container_name: inji-web
    restart: unless-stopped
    environment:
      DEFAULT_LANG: en
      # The browser calls Mimoto on the address of Inji Web.
      MIMOTO_URL: ${INJI_WEB_PUBLIC_URL:-http://localhost:17085}/v1/mimoto
    volumes:
      # Inji Web serves these files to the browser and to Mimoto, whose
      # bootstrap properties name http://inji-web:3004/.
      - ./dpg/inji/mimoto/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json:ro
      - ./dpg/inji/mimoto/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json:ro
      - ./dpg/inji/mimoto/credential-template.html:/home/mosip/credential-template.html:ro
    ports:
      - "${VCA_BIND:-0.0.0.0}:${INJI_WEB_HOST_PORT:-17085}:3004"
    networks:
      - vca

  # Inji Verify runs for the verifier pair and for Certify, which checks
  # a presentation during issuance with it (P6-I4b). The settings follow
  # docker-compose/docker-compose.yml of mosip/inji-verify v0.16.0.
  inji-verify-postgres:
    image: postgres:13.16-alpine
    profiles: [issuer-inji, verifier-inji]
    container_name: inji-verify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: injiverify
      POSTGRES_PASSWORD: ${INJI_VERIFY_DB_PASSWORD:-injiverify}
      POSTGRES_DB: injiverify
    volumes:
      - inji-verify-db:/var/lib/postgresql/data
      - ./dpg/inji/verify/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - vca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U injiverify"]
      interval: 10s
      timeout: 5s
      retries: 10

  inji-verify-service:
    image: mosipid/inji-verify-service:0.16.0
    profiles: [issuer-inji, verifier-inji]
    container_name: inji-verify-service
    restart: unless-stopped
    depends_on:
      inji-verify-postgres:
        condition: service_healthy
    environment:
      active_profile_env: default
      DATABASE_HOST: inji-verify-postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: injiverify
      DATABASE_SCHEMA: verify
      DATABASE_USERNAME: injiverify
      DATABASE_PASSWORD: ${INJI_VERIFY_DB_PASSWORD:-injiverify}
      INJI_VP_REQUEST_LONG_POLLING_TIMEOUT: "55000"
      # A wallet posts its answer here, so the address is public.
      INJI_VP_SUBMISSION_BASE_URL: ${INJI_VERIFY_PUBLIC_URL:-http://localhost:17086}/v1/verify
      INJI_DID_VERIFY_URI: did:web:${INJI_VERIFY_DID_HOST:-localhost%3A17086}:v1:verify
      INJI_DID_VERIFY_PUBLIC_KEY_URI: did:web:${INJI_VERIFY_DID_HOST:-localhost%3A17086}:v1:verify#key-0
      INJI_VERIFY_REDIRECT_URI: ${INJI_VERIFY_PUBLIC_URL:-http://localhost:17086}
    ports:
      - "${VCA_BIND:-0.0.0.0}:${INJI_VERIFY_SERVICE_HOST_PORT:-17086}:8080"
    networks:
      - vca

  inji-verify-ui:
    image: mosipid/inji-verify-ui:0.16.0
    profiles: [verifier-inji]
    container_name: inji-verify-ui
    restart: unless-stopped
    environment:
      DEFAULT_TITLE: Inji Verify
      DEFAULT_LANG: en
      VP_SUBMISSION_SUPPORTED: "false"
      CLIENT_ID: inji-verify-ui
      CLIENT_ID_DID: did:web:${INJI_VERIFY_DID_HOST:-localhost%3A17086}:v1:verify
    ports:
      - "${VCA_BIND:-0.0.0.0}:${INJI_VERIFY_UI_HOST_PORT:-17087}:8000"
    networks:
      - vca

volumes:
  inji-certify-db:
  inji-certify-keys:
  inji-verify-db:
  inji-mimoto-db:
  inji-mimoto-redis:
  inji-mimoto-keys:

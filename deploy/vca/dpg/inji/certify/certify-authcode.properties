# The profile "authcode" of the Inji Certify 0.14.0 container
# inji-certify-authcode (ADR-051, ADR-052). VCA wrote this file. The
# container reads certify-vca-store.properties first, so it issues from the
# VCA claims store too. This profile replaces the address and the
# authorization server.
#
# Certify checks every access token against one issuer and one key set. This
# container takes the tokens of the holder authorization server of the Inji
# adapter: the tokens of Mimoto for a claim in Inji Web, and the tokens of a
# wallet that claims an authorization code offer. The subject of such a token
# is the staging id of the row that the adapter wrote.

## The address of this Certify. The second server of the nginx of the stack
## serves its issuer metadata at the root. Mimoto reads it there.
mosip.certify.domain.url=http://inji-certify-nginx:8091
mosip.certify.identifier=${mosip.certify.domain.url}

## The holder authorization server of the adapter of the issuer pair. vca
## setup writes its public issuer into VCA_INJI_AUTHZ_ISSUER. Certify fetches
## the key set on the compose network.
mosip.certify.authorization.url=${VCA_INJI_AUTHZ_ISSUER}
mosip.certify.authn.issuer-uri=${VCA_INJI_AUTHZ_ISSUER}
mosip.certify.authn.jwk-set-uri=${INJI_ADAPTER_URL}/authz/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.domain.url}${server.servlet.path}/issuance/credential' }

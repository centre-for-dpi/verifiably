# The profile "csvdp-farmer" of the Inji Certify 0.14.0 container
# inji-certify-esignet. This file derives from
# docker-compose/docker-compose-injistack/config/certify-csvdp-farmer.properties
# of the release (see SOURCE.md). The values that VCA changes carry a "VCA:"
# comment.
#
# This Certify takes the access tokens of the eSignet of the stack: the tokens
# of Mimoto for a claim in Inji Web, and the tokens of a wallet that claims an
# authorization code offer of the adapter. Both sign in with the eSignet client
# vca-inji. The CSV data provider reads the claims of the identity from the
# farmer data of the release.

## ------------------------------------------- Mock ID Integration properties ------------------------------------------------------------
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.vci-plugin=MockVCIssuancePlugin

## ------------------------------------------- Mock ID plugin related properties ------------------------------------------------------------
mosip.certify.mock.vciplugin.verification-method=${mosip.certify.authn.jwk-set-uri}
# VCA: the mock identity system of the stack.
mosip.certify.mock.authenticator.get-identity-url=http://inji-mock-identity:8082/v1/mock-identity-system/identity
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true
mosip.certify.identifier=${mosip.certify.domain.url}

# VCA: the address of this Certify. The second server of the nginx of the stack
# serves its issuer metadata at the root. Mimoto reads it there.
mosip.certify.domain.url=http://inji-certify-nginx:8091

# VCA: eSignet is the authorization server. Mimoto reads its metadata from the
# address that the issuer metadata names, so the name is the one of the compose
# network. The tokens carry the public issuer of eSignet, which the stack file
# sets. eSignet sets the audience to the credential endpoint for a credential
# scope, and to the client id otherwise.
mosip.certify.authorization.url=http://inji-esignet:8088/v1/esignet/oauth
mosip.certify.authn.issuer-uri=${INJI_ESIGNET_PUBLIC_URL:http://localhost:17082}/v1/esignet
mosip.certify.authn.jwk-set-uri=http://inji-esignet:8088/v1/esignet/oauth/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.domain.url}${server.servlet.path}/issuance/credential', 'vca-inji' }


# VCA: the issuer DID of the stack, shared with inji-certify.
mosip.certify.data-provider-plugin.did-url=${INJI_CERTIFY_DID:did:web:inji-certify-nginx}

mosip.certify.plugin-mode=DataProvider
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://mosip.io/credential/
mosip.certify.integration.data-provider-plugin=MockCSVDataProviderPlugin
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020
## CSV specific config
mosip.certify.mock.data-provider.csv.identifier-column=id
mosip.certify.mock.data-provider.csv.data-columns=id,fullName,mobileNumber,dateOfBirth,gender,state,district,villageOrTown,postalCode,landArea,landOwnershipType,primaryCropType,secondaryCropType,face,farmerID
mosip.certify.mock.data-provider.csv-registry-uri=/home/mosip/config/farmer_identity_data.csv
mosip.certify.data-provider-plugin.rendering-template-id=
mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'Farmer Issuer',\
    'locale': 'en'\
  }\
}
mosip.certify.indexed-mappings.state=$.state
mosip.certify.indexed-mappings.district=$.district

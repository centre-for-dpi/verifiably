# The nginx of the Certify containers of the Inji stack. VCA derived this file
# from docker-compose/docker-compose-injistack/certify-nginx.conf of Inji
# Certify 0.14.0 (see SOURCE.md). OID4VCI puts the issuer metadata under the
# credential issuer, and Certify serves it under /v1/certify, so each server
# fronts one Certify at the root, as certify-nginx of the release does.
# The nginx starts before the Certify containers. A name in a variable makes
# nginx resolve it through the compose DNS on each request, not at start.
resolver 127.0.0.11 valid=30s;

# inji-certify: its own authorization server, for the adapter. It also reads
# the presentation definition of a presentation during issuance here.
server {
    listen 80;
    set $certify http://inji-certify:8090;

    location = /vp_request_config.json {
        root /usr/share/nginx/html;
    }

    location /v1/certify/ {
        proxy_pass $certify;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/did.json {
        proxy_pass $certify/v1/certify/.well-known/did.json;
    }

    location = /.well-known/openid-credential-issuer {
        proxy_pass $certify/v1/certify/.well-known/openid-credential-issuer;
    }
}

# inji-certify-esignet: the tokens of eSignet, for Mimoto and for an
# authorization code offer of the adapter.
server {
    listen 8091;
    set $certify http://inji-certify-esignet:8090;

    location /v1/certify/ {
        proxy_pass $certify;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/did.json {
        proxy_pass $certify/v1/certify/.well-known/did.json;
    }

    location = /.well-known/openid-credential-issuer {
        proxy_pass $certify/v1/certify/.well-known/openid-credential-issuer;
    }
}

# The profile "vca-store" of both Inji Certify 0.14.0 containers of the Inji
# stack (ADR-051). VCA wrote this file. Its plugin block follows
# certify-postgres-landregistry.properties of inji-config release-0.14.x and
# the Postgres data provider of the digital credential plugins 0.6.0 (see
# SOURCE.md).
#
# Both containers issue from the VCA claims store: the foreign table
# certify.vca_claims of vca_claims.sql. The Inji adapter of the issuer pair
# writes one row per staged subject. The data provider runs the query of the
# scope of the token with :id set to the subject of the token, and returns the
# first row with the column names as keys.
#
# The container inji-certify runs this profile alone. It is its own
# authorization server: it issues the pre-authorized code, trades the
# interactive authorization code of a presentation during issuance, and checks
# the tokens it signed. The container inji-certify-authcode adds the profile
# authcode after this one, and that profile names the holder authorization
# server of the adapter instead.

## The address of this Certify. The nginx of the stack serves the issuer
## metadata at the root, as OID4VCI puts it under the credential issuer.
mosip.certify.domain.url=http://inji-certify-nginx
mosip.certify.identifier=${mosip.certify.domain.url}

## Certify is the authorization server. certify-default.properties derives the
## oauth issuer, the token endpoint, the interactive authorization endpoint, and
## the audience of the access token from this address.
mosip.certify.authorization.url=${mosip.certify.domain.url}
mosip.certify.authn.issuer-uri=${mosip.certify.oauth.issuer}
mosip.certify.authn.jwk-set-uri=http://inji-certify:8090/v1/certify/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.oauth.access-token.audience}' }

## The Postgres data provider reads the VCA claims store. Every configuration
## that the adapter registers has the scope vca_credential, so one query serves
## every schema, and a new schema needs no restart (ADR-051 decision 3).
mosip.certify.integration.scan-base-package=io.mosip.certify.postgresdataprovider.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.data-provider-plugin=PostgresDataProviderPlugin
mosip.certify.plugin-mode=DataProvider
mosip.certify.data-provider-plugin.postgres.scope-query-mapping={\
  'vca_credential': 'select * from certify.vca_claims where subject = :id'\
}
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true

## A presentation during issuance takes the value of the first of these claims
## of the presented credential as the subject of the token. The adapter writes
## the row of an offer under that value. vca setup writes the list.
mosip.certify.iar.identity-data=${INJI_IAR_IDENTITY_CLAIMS}

## The issuer DID. Both Certify containers sign with the keys of one key store,
## so they share it. vca setup writes did:web of the public host of the issuer
## pair into INJI_CERTIFY_DID. That host serves /.well-known/did.json over TLS.
mosip.certify.data-provider-plugin.did-url=${INJI_CERTIFY_DID}
mosip.certify.data-provider-plugin.id-field-prefix-uri=urn:uuid:
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020

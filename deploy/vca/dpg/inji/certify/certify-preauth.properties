# The profile "preauth" of the Inji Certify 0.14.0 container inji-certify.
# VCA wrote this file. Its values come from the block "Use below properties
# to use certify as authorization server" and the pre-authorized data
# provider of certify-service/src/main/resources/application-local.properties
# of the release, and from the plugin block of certify-csvdp-farmer.properties
# of the injistack compose folder (see SOURCE.md).
#
# This Certify is its own authorization server. It issues the pre-authorized
# code, trades the interactive authorization code of a presentation during
# issuance, and checks the tokens it signed. Certify 0.14.0 checks every
# access token against one issuer and one key set, so the eSignet tokens go to
# the second container, inji-certify-esignet.

## The address of this Certify. The nginx of the stack serves the issuer
## metadata at the root, as OID4VCI puts it under the credential issuer.
mosip.certify.domain.url=http://inji-certify-nginx
mosip.certify.identifier=${mosip.certify.domain.url}

## Certify is the authorization server. certify-default.properties derives the
## oauth issuer, the token endpoint, the interactive authorization endpoint, and
## the audience of the access token from this address.
mosip.certify.authorization.url=${mosip.certify.domain.url}
mosip.certify.authn.issuer-uri=${mosip.certify.oauth.issuer}
mosip.certify.authn.jwk-set-uri=http://inji-certify:8090/v1/certify/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.oauth.access-token.audience}' }

## The pre-authorized data provider reads the claims that the staging call of
## the adapter put in the pre-authorized code.
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.data-provider-plugin=PreAuthDataProviderPlugin
mosip.certify.plugin-mode=DataProvider
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true

## The issuer DID. Both Certify containers sign with the keys of one key store,
## so they share it. Set INJI_CERTIFY_DID to a did:web whose host serves
## /.well-known/did.json over TLS.
mosip.certify.data-provider-plugin.did-url=${INJI_CERTIFY_DID:did:web:inji-certify-nginx}
mosip.certify.data-provider-plugin.id-field-prefix-uri=urn:uuid:
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020
mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'Inji Certify',\
    'locale': 'en'\
  }\
}

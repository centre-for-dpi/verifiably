# The nginx of the eSignet login page (oidc-ui 1.5.1) in the Inji stack.
# VCA derived this file from docker-compose/nginx.conf of eSignet v1.5.1
# (see SOURCE.md).
#
# OIDC_UI_PUBLIC_URL=esignet-ui moves the files of the page under
# /esignet-ui, so its assets do not take /static, which VCA serves on the
# same host. The page still asks for /theme, /locales, and /v1/esignet at
# the root, and its router draws /authorize, /login, and /consent there.
worker_processes  1;

events {
  worker_connections  1024;
}

http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  server {
    listen 3000;
    server_name  localhost;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # The login page starts before eSignet. A name in a variable makes
    # nginx resolve it through the compose DNS on each request.
    resolver 127.0.0.11 valid=30s;
    set $esignet http://inji-esignet:8088;

    location /v1/esignet {
      proxy_pass         $esignet;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
    }
    location = /.well-known/openid-configuration {
      proxy_pass         $esignet/v1/esignet/oidc/.well-known/openid-configuration;
      proxy_redirect     off;
    }
    location = /.well-known/oauth-authorization-server {
      proxy_pass         $esignet/v1/esignet/oauth/.well-known/oauth-authorization-server;
      proxy_redirect     off;
    }

    # The files of the page, and the configuration it reads at the root.
    location /esignet-ui/ {
      root /usr/share/nginx;
      try_files $uri /esignet-ui/index.html;
    }
    location /theme/ {
      alias /usr/share/nginx/esignet-ui/theme/;
    }
    location /locales/ {
      alias /usr/share/nginx/esignet-ui/locales/;
    }
    location /images/ {
      alias /usr/share/nginx/esignet-ui/images/;
    }
    # The routes of the page: /authorize, /login, /consent, and the others.
    location / {
      root /usr/share/nginx/esignet-ui;
      try_files $uri /index.html;
    }
  }
}

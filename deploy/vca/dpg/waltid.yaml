# SPDX-License-Identifier: Apache-2.0
# walt.id Community Stack v0.18.2 (ADR-008 decision 3).
# The versions come from verifiably-go/docs/dpg-matrix.md.
# Keycloak 25.0 is the identity provider of the local path.
# The main compose file pulls this file in with include.
# Every host port binds to VCA_BIND, which vca setup sets to 127.0.0.1
# on a public host.
# VCA services never rebuild a DPG image.
#
# Start it with: vca deploy --role issuer --dpg waltid

services:
  waltid-keycloak:
    image: quay.io/keycloak/keycloak:25.0
    profiles: [issuer-waltid, holder-waltid, verifier-waltid, admin-waltid]
    container_name: waltid-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    # The administrator name and the generated password come from the
    # .env of the stack directory, which vca setup writes with mode 0600.
    # No default password exists (ADR-035 decision 7).
    env_file:
      - path: ../keycloak-waltid/.env
        required: true
    environment:
      KC_HEALTH_ENABLED: "true"
      # A reverse proxy in front of the host port sends X-Forwarded
      # headers. Keycloak builds its URLs from them, so the login page
      # works behind TLS.
      KC_PROXY_HEADERS: xforwarded
    volumes:
      # The stack directory holds one realm per role, vca-<role>-realm.json,
      # which vca setup writes (ADR-035 decision 1). Keycloak imports every
      # JSON file of the directory at its first start and skips the .env.
      - ../keycloak-waltid:/opt/keycloak/data/import:ro
    ports:
      - "${VCA_BIND:-0.0.0.0}:${WALTID_KEYCLOAK_HOST_PORT:-17010}:8080"
    networks:
      - vca

  waltid-postgres:
    image: postgres:16.4-alpine
    profiles: [holder-waltid]
    container_name: waltid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: waltid
      POSTGRES_PASSWORD: ${WALTID_DB_PASSWORD:-waltid}
      POSTGRES_DB: waltid
    volumes:
      - waltid-db:/var/lib/postgresql/data
    networks:
      - vca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waltid"]
      interval: 10s
      timeout: 5s
      retries: 10

  waltid-issuer-api:
    image: waltid/issuer-api:0.18.2
    profiles: [issuer-waltid]
    container_name: waltid-issuer-api
    restart: unless-stopped
    command: ["--webPort=7002", "--baseUrl=${WALTID_ISSUER_BASE_URL:-http://waltid-issuer-api:7002}"]
    ports:
      - "${VCA_BIND:-0.0.0.0}:${WALTID_ISSUER_HOST_PORT:-17002}:7002"
    networks:
      - vca

  waltid-verifier-api:
    image: waltid/verifier-api:0.18.2
    profiles: [verifier-waltid]
    container_name: waltid-verifier-api
    restart: unless-stopped
    command: ["--webPort=7003", "--baseUrl=${WALTID_VERIFIER_BASE_URL:-http://waltid-verifier-api:7003}"]
    ports:
      - "${VCA_BIND:-0.0.0.0}:${WALTID_VERIFIER_HOST_PORT:-17003}:7003"
    networks:
      - vca

  waltid-wallet-api:
    image: waltid/wallet-api:0.18.2
    profiles: [holder-waltid]
    container_name: waltid-wallet-api
    restart: unless-stopped
    depends_on:
      waltid-postgres:
        condition: service_healthy
    environment:
      WALTID_DATASOURCE_URL: jdbc:postgresql://waltid-postgres:5432/waltid
      WALTID_DATASOURCE_USER: waltid
      WALTID_DATASOURCE_PASSWORD: ${WALTID_DB_PASSWORD:-waltid}
    ports:
      - "${VCA_BIND:-0.0.0.0}:${WALTID_WALLET_HOST_PORT:-17001}:7001"
    networks:
      - vca

volumes:
  waltid-db:

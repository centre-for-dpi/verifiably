# SPDX-License-Identifier: Apache-2.0
# CREDEBL platform (ADR-008 decision 3, ADR-045 decision 4).
# The file runs every service of the upstream compose file
# https://raw.githubusercontent.com/credebl/platform/main/docker-compose.yml
# and the shared Credo agent that upstream starts through the Docker
# socket. Here compose starts the agent, and no container mounts the
# Docker socket (ADR-005 decision 3).
#
# CREDEBL publishes from its main branch. Each platform image is pinned
# by the digest that its tag latest named on 2026-09-26, read from the
# package pages of github.com/orgs/credebl/packages. The tag beside the
# digest is the release tag of that same image. Keycloak, PostgreSQL,
# NATS and Redis are pinned by version.
#
# The main compose file pulls this file in with include.
# The passwords and keys come from ../credebl/.env, which vca setup
# generates with mode 0600 and the include reads. The file requires
# each one, so no container starts on a default secret (ADR-055
# decision 1). The same file names the platform admin that setup
# collected. No placeholder user exists (ADR-055 decision 4).
# Every host port binds to VCA_BIND, which vca setup sets to 127.0.0.1
# on a public host.
#
# Start it with: vca deploy --role issuer --dpg credebl
# Then run once: vca dpg bootstrap credebl

# The settings every platform service shares. Each service reads the
# stack .env for the platform admin and the generated platform keys.
x-credebl-platform: &credebl-platform
  profiles: [issuer-credebl, holder-credebl, verifier-credebl]
  restart: unless-stopped
  env_file:
    - path: ../credebl/.env
      required: true
  environment: &credebl-environment
    DATABASE_URL: postgresql://credebl:${CREDEBL_DB_PASSWORD:?set by vca setup}@credebl-postgres:5432/credebl
    POOL_DATABASE_URL: postgresql://credebl:${CREDEBL_DB_PASSWORD:?set by vca setup}@credebl-postgres:5432/credebl
    NATS_URL: nats://credebl-nats:4222
    NATS_AUTH_TYPE: none
    NOTIFICATION_NATS_AUTH_TYPE: none
    REDIS_HOST: credebl-redis
    REDIS_PORT: "6379"
    # The platform builds realm URLs as <domain>realms/<realm>, so the
    # domain ends with a slash.
    KEYCLOAK_DOMAIN: ${CREDEBL_KEYCLOAK_URL:-http://credebl-keycloak:8080/}
    KEYCLOAK_ADMIN_URL: http://credebl-keycloak:8080
    KEYCLOAK_MASTER_REALM: master
    # The realm of the platform and its two clients. vca setup writes
    # the realm beside the realms of the VCA roles, and the secrets into
    # ../credebl/.env. The platform signs the platform admin in with the
    # admin client and manages users with the management client.
    KEYCLOAK_REALM: credebl-platform
    KEYCLOAK_MANAGEMENT_CLIENT_ID: credeblClient
    KEYCLOAK_MANAGEMENT_CLIENT_SECRET: ${CREDEBL_KEYCLOAK_MANAGEMENT_CLIENT_SECRET:?set by vca setup}
    ADMIN_KEYCLOAK_ID: adminClient
    ADMIN_KEYCLOAK_SECRET: ${CREDEBL_ADMIN_KEYCLOAK_SECRET:?set by vca setup}
    API_GATEWAY_PROTOCOL: http
    API_GATEWAY_HOST: 0.0.0.0
    API_GATEWAY_PORT: "5000"
    API_ENDPOINT: credebl-api-gateway:5000
    # The agents keep their wallets in the platform database server.
    WALLET_STORAGE_HOST: credebl-postgres
    WALLET_STORAGE_PORT: "5432"
    WALLET_STORAGE_USER: credebl
    WALLET_STORAGE_PASSWORD: ${CREDEBL_DB_PASSWORD:?set by vca setup}
    # The schema file server of this file keeps the W3C schemas.
    SCHEMA_FILE_SERVER_URL: http://credebl-schema-file-server:4000/schemas/
    SCHEMA_FILE_SERVER_TOKEN: ${CREDEBL_SCHEMA_FILE_SERVER_TOKEN:?set by vca setup}
    AGENT_PROTOCOL: http
    AGENT_API_KEY: ${CREDEBL_AGENT_API_KEY:?set by vca setup}
    # The platform reads its secrets from this environment, not from an
    # external secret store.
    ENABLE_BAO: "false"
    # The platform keeps files on the volume credebl-files, not in an
    # object store: the invitation of an offer by email, and the CSV
    # files of a bulk issuance. The api gateway serves the invitations
    # under /uploadedFiles/demo-shortening-url.
    FILE_STORAGE_TYPE: local
    STOREOBJECT_BUCKET: demo-shortening-url
    FILE_SHARING_BUCKET: import
    # An email names the api gateway in its link. On a public host, publish
    # only /uploadedFiles/demo-shortening-url/ of the gateway through the
    # reverse proxy, and set CREDEBL_PLATFORM_URL to its public address.
    # The other paths serve the CSV files of a bulk issuance; keep them on
    # the host. The platform never deletes the files (docs/deploy.md).
    PLATFORM_URL: ${CREDEBL_PLATFORM_URL:-http://credebl-api-gateway:5000}
    PLATFORM_NAME: ${CREDEBL_PLATFORM_NAME:-CREDEBL}
    DEEPLINK_DOMAIN: ${CREDEBL_DEEPLINK_DOMAIN:-}
    # The mail provider of an offer by email comes from ../credebl/.env:
    # EMAIL_PROVIDER and the values of that provider. No provider, no
    # email offer.
    # The status list host of this file. The platform refuses a
    # revocable offer without it. The agent puts the same address into
    # each revocable credential, so a verifier fetches the list there.
    # On a public host set CREDEBL_STATUS_LIST_URL to its public address.
    STATUS_LIST_HOST: ${CREDEBL_STATUS_LIST_URL:-http://credebl-status-list:3000}
  volumes:
    - credebl-files:/app/uploadedFiles
  networks:
    - vca

services:
  credebl-keycloak:
    image: quay.io/keycloak/keycloak:25.0
    profiles: [issuer-credebl, holder-credebl, verifier-credebl, admin-credebl]
    container_name: credebl-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    # The administrator name and the generated password come from the
    # .env of the stack directory, which vca setup writes with mode 0600.
    # No default password exists (ADR-035 decision 7).
    env_file:
      - path: ../keycloak-credebl/.env
        required: true
    environment:
      KC_HEALTH_ENABLED: "true"
      # A reverse proxy in front of the host port sends X-Forwarded
      # headers. Keycloak builds its URLs from them, so the login page
      # works behind TLS.
      KC_PROXY_HEADERS: xforwarded
      # The realm of the platform names its client secrets as
      # placeholders. Keycloak fills them from here at the import.
      CREDEBL_KEYCLOAK_MANAGEMENT_CLIENT_SECRET: ${CREDEBL_KEYCLOAK_MANAGEMENT_CLIENT_SECRET:?set by vca setup}
      CREDEBL_ADMIN_KEYCLOAK_SECRET: ${CREDEBL_ADMIN_KEYCLOAK_SECRET:?set by vca setup}
    volumes:
      # The stack directory holds one realm per role, vca-<role>-realm.json,
      # which vca setup writes (ADR-035 decision 1), and the realm of the
      # platform, credebl-platform-realm.json. Keycloak imports every
      # JSON file of the directory at its first start and skips the .env.
      - ../keycloak-credebl:/opt/keycloak/data/import:ro
    ports:
      - "${VCA_BIND:-0.0.0.0}:${CREDEBL_KEYCLOAK_HOST_PORT:-17180}:8080"
    networks:
      - vca

  credebl-postgres:
    image: postgres:16.4-alpine
    profiles: [issuer-credebl, holder-credebl, verifier-credebl]
    container_name: credebl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: credebl
      POSTGRES_PASSWORD: ${CREDEBL_DB_PASSWORD:?set by vca setup}
      POSTGRES_DB: credebl
    volumes:
      - credebl-db:/var/lib/postgresql/data
    networks:
      - vca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credebl"]
      interval: 10s
      timeout: 5s
      retries: 10

  credebl-nats:
    image: nats:2.10.22-alpine
    profiles: [issuer-credebl, holder-credebl, verifier-credebl]
    container_name: credebl-nats
    restart: unless-stopped
    # JetStream carries the notification streams of the platform.
    command: ["-js"]
    networks:
      - vca

  credebl-redis:
    image: redis:7.4.1-alpine
    profiles: [issuer-credebl, holder-credebl, verifier-credebl]
    container_name: credebl-redis
    restart: unless-stopped
    # The bulk issuance queue and the caches of the platform live here.
    command: ["redis-server", "--save", "20", "1", "--loglevel", "warning"]
    volumes:
      - credebl-cache:/data
    networks:
      - vca

  # The database initialisation of the release: the migrations, the
  # roles, the agent types, the ledgers, and the platform admin of
  # setup. vca dpg bootstrap credebl runs it once with
  # docker compose run. The profile keeps it out of docker compose up.
  #
  # The release reads the platform admin password and the other
  # credentials from the master table that the platform repository
  # commits. vca setup writes a table of its own with the generated
  # password of ../credebl/.env, with mode 0600, and the mount below
  # replaces the committed one (ADR-055 decision 1). The container runs
  # as root to read that file.
  credebl-seed:
    <<: *credebl-platform
    image: ghcr.io/credebl/seed:v2.2.1-alpha.4@sha256:e1df1fd324d8a4ed75dd4d34cfc2d87d40dff77c6553934759c6888dfc132795
    profiles: [credebl-init]
    container_name: credebl-seed
    restart: "no"
    user: root
    # The platform services run as the user 1001 of the images, so the
    # initialisation gives them the file volume first. Then it runs the
    # command of the image.
    command: ["sh", "-c", "chown 1001:1001 /app/uploadedFiles && cd libs/prisma-service && npx prisma migrate deploy && npx prisma db seed"]
    environment:
      <<: *credebl-environment
      # The scripts of the release that load the country list and store
      # the client of the platform for the platform admin.
      GEO_LOCATION_MASTER_DATA_IMPORT_SCRIPT: /prisma/scripts/geo_location_data_import.sh
      UPDATE_CLIENT_CREDENTIAL_SCRIPT: /prisma/scripts/update_client_credential_data.sh
    volumes:
      - credebl-files:/app/uploadedFiles
      - ../credebl/credebl-master-table.json:/app/libs/prisma-service/prisma/data/credebl-master-table/credebl-master-table.json:ro
    depends_on:
      credebl-postgres:
        condition: service_healthy

  credebl-schema-file-server:
    image: ghcr.io/credebl/schema-file-server:latest@sha256:40a071da35ab17530e9fc1b5de88c46b3ae41bcd79c5c5c28661a0195792435a
    profiles: [issuer-credebl, holder-credebl, verifier-credebl]
    container_name: credebl-schema-file-server
    restart: unless-stopped
    environment:
      APP_PORT: "4000"
      # The platform signs its upload token with this secret.
      JWT_TOKEN_SECRET: ${CREDEBL_SCHEMA_FILE_SERVER_SECRET:?set by vca setup}
      ISSUER: ${CREDEBL_SCHEMA_FILE_SERVER_ISSUER:-credebl-platform}
    volumes:
      - credebl-schemas:/app/schemas
    networks:
      - vca

  # The status list host of the platform: a Token Status List server
  # that keeps each list as a signed JWT. The agent creates and updates
  # the lists with the API key, and anyone reads them. CREDEBL publishes
  # no image of it, so compose builds it from the repository of its
  # authors at one commit, read on 2026-09-27. The build repeats the
  # Dockerfile of that commit with its base image pinned by digest.
  credebl-status-list:
    image: vca-local/credebl-status-list:f6025ab
    build:
      context: https://github.com/sovio-id/status-list-server.git#f6025abe794076abfc8b08513be1165142f2eda8
      dockerfile_inline: |
        FROM oven/bun:1.3.2-alpine@sha256:adda30fd4db7d8ef9a2113cb935c6f751de3daad39373713b56eefe49db78471 AS build
        WORKDIR /app
        COPY package.json bun.lock ./
        COPY apps/server/package.json ./apps/server/
        COPY packages/db/package.json ./packages/db/
        COPY packages/env/package.json ./packages/env/
        COPY packages/config/package.json ./packages/config/
        RUN bun install --frozen-lockfile
        COPY . .
        RUN bun run build
        FROM oven/bun:1.3.2-alpine@sha256:adda30fd4db7d8ef9a2113cb935c6f751de3daad39373713b56eefe49db78471
        WORKDIR /app
        COPY --from=build /app/apps/server/dist ./dist
        COPY --from=build /app/packages/db/src/migrations ./dist/migrations
        EXPOSE 3000
        CMD ["bun", "run", "dist/index.mjs"]
    profiles: [issuer-credebl, holder-credebl, verifier-credebl]
    container_name: credebl-status-list
    restart: unless-stopped
    environment:
      # The server runs its migrations at the start, on the volume.
      DATABASE_URL: file:/app/data/status-list.db
      PORT: "3000"
      NODE_ENV: production
      API_KEY: ${CREDEBL_STATUS_LIST_API_KEY:?set by vca setup}
    volumes:
      - credebl-status-lists:/app/data
    # A verifier outside the host reads the lists here. Publish only the
    # GET requests of /status-lists/ through the reverse proxy.
    ports:
      - "${VCA_BIND:-0.0.0.0}:${CREDEBL_STATUS_LIST_HOST_PORT:-17183}:3000"
    networks:
      - vca

  credebl-api-gateway:
    <<: *credebl-platform
    image: ghcr.io/credebl/api-gateway:v2.2.1-alpha.4@sha256:b687cec51f96329a0c25515ec35c6207d45d1a125aa976bbe5d84c884b39dc02
    container_name: credebl-api-gateway
    depends_on:
      credebl-postgres:
        condition: service_healthy
      credebl-nats:
        condition: service_started
      credebl-redis:
        condition: service_started
    ports:
      - "${VCA_BIND:-0.0.0.0}:${CREDEBL_API_HOST_PORT:-17181}:5000"

  credebl-user:
    <<: *credebl-platform
    image: ghcr.io/credebl/user:v2.2.1-alpha.4@sha256:3ea3c3d189b5934a0fa32f920a483f25162d0375dd93e7968f29d566e81dd450
    container_name: credebl-user
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-utility:
    <<: *credebl-platform
    image: ghcr.io/credebl/utility:v2.2.1-alpha.3@sha256:406fa96220fec8e369cbbf38bf1be9b26f2558dd2fd8691c79b64895d02db7b9
    container_name: credebl-utility
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-connection:
    <<: *credebl-platform
    image: ghcr.io/credebl/connection:v2.2.1-alpha.4@sha256:4011bcbc243e5d02252149321e9f69217abd3fb34294fb55952f5b36485afd23
    container_name: credebl-connection
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-issuance:
    <<: *credebl-platform
    image: ghcr.io/credebl/issuance:v2.2.1-alpha.4@sha256:5b9b8441321d576311270f742941c8b3e80ccc0f3a4ac2b81f80995d5ed7bcc0
    container_name: credebl-issuance
    depends_on: [credebl-nats, credebl-redis, credebl-api-gateway]

  credebl-ledger:
    <<: *credebl-platform
    image: ghcr.io/credebl/ledger:v2.2.1-alpha.4@sha256:5a12ea655b1addf6b638849d8f691371e4934c4b2cab4344cbdcdf33a63acc80
    container_name: credebl-ledger
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-organization:
    <<: *credebl-platform
    image: ghcr.io/credebl/organization:v2.2.1-alpha.4@sha256:fccdce10f0fffba7541696b1f85ffe983ff6aaeaf221c249cbc487aa26033163
    container_name: credebl-organization
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-verification:
    <<: *credebl-platform
    image: ghcr.io/credebl/verification:v2.2.1-alpha.4@sha256:42e1e3d0cf7c623ccbdc89a0212b646912ddd373802e6ef9695ec9a46ec5da87
    container_name: credebl-verification
    depends_on: [credebl-nats, credebl-api-gateway]

  # Agent provisioning starts a dedicated agent through the Docker
  # socket upstream. It gets no socket here, so it serves the shared
  # agent below and no dedicated agent.
  credebl-agent-provisioning:
    <<: *credebl-platform
    image: ghcr.io/credebl/agent-provisioning:v2.2.1-alpha.4@sha256:55bf811a27c1771e92b03cbc83f9dff6d9ebe1fcdb9c0c8b37c47c6b68fefde5
    container_name: credebl-agent-provisioning
    depends_on: [credebl-nats, credebl-api-gateway]

  # Upstream waits for the log of agent provisioning through the Docker
  # socket. Compose orders the start instead.
  credebl-agent-service:
    <<: *credebl-platform
    image: ghcr.io/credebl/agent-service:v2.2.1-alpha.4@sha256:2ae284729f95b1eae4ad21032befd0d7af0895cbb1a2059c13e3c12a0c5b9370
    container_name: credebl-agent-service
    command: ["sh", "-c", "cd libs/prisma-service && npx prisma migrate deploy && cd ../.. && node dist/apps/agent-service/main.js"]
    depends_on: [credebl-nats, credebl-api-gateway, credebl-agent-provisioning]

  credebl-cloud-wallet:
    <<: *credebl-platform
    image: ghcr.io/credebl/cloud-wallet:v2.2.1-alpha.4@sha256:6693137f5a158202e921b078af666c0c694c6689eab3167f24c2a02a75830d77
    container_name: credebl-cloud-wallet
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-geolocation:
    <<: *credebl-platform
    image: ghcr.io/credebl/geolocation:v2.2.1-alpha.4@sha256:3a8adccec88913da21f31e7fdb44bdac92ecc8f6226594788bd5d877a34c9fb2
    container_name: credebl-geolocation
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-notification:
    <<: *credebl-platform
    image: ghcr.io/credebl/notification:v2.2.1-alpha.4@sha256:a06257b9ee06e12b1359f771286a869de2d8ebc7db92291b1b274472c81ddb72
    container_name: credebl-notification
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-webhook:
    <<: *credebl-platform
    image: ghcr.io/credebl/webhook:v2.2.1-alpha.4@sha256:da45e48fde5fb0856ac88ebc780269f89566cb222acd70427ddef2e299b4d8b2
    container_name: credebl-webhook
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-ecosystem:
    <<: *credebl-platform
    image: ghcr.io/credebl/ecosystem:v2.2.1-alpha.4@sha256:dee3dbc5ecf82a298ae7c4567737992aed538529da1894cf002480de08c48706
    container_name: credebl-ecosystem
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-oid4vc-issuance:
    <<: *credebl-platform
    image: ghcr.io/credebl/oid4vc-issuance:v2.2.1-alpha.4@sha256:3e9eace80d82b37858d0e4861795a29bb5d436fdcd11f8a31e5be8a17433be7c
    container_name: credebl-oid4vc-issuance
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-oid4vc-verification:
    <<: *credebl-platform
    image: ghcr.io/credebl/oid4vc-verification:v2.2.1-alpha.4@sha256:501b657a5febda58356600d93edd9d009df00de7877c3dbc06292be4a6c3e5e7
    container_name: credebl-oid4vc-verification
    depends_on: [credebl-nats, credebl-api-gateway]

  credebl-x509:
    <<: *credebl-platform
    image: ghcr.io/credebl/x509:v2.2.1-alpha.3@sha256:8de7a06b4d53ed392a2201ef0698c353c0f33af26a2fbb3d28d20e70556a4e12
    container_name: credebl-x509
    depends_on: [credebl-nats, credebl-api-gateway]

  # The shared Credo agent of the platform. vca dpg bootstrap credebl
  # binds it to the platform admin organisation, and every other
  # organisation gets a tenant wallet in it. The platform checks an agent
  # address with a pattern that needs a dotted host, so the agent has an
  # alias with dots on the network.
  credebl-agent:
    image: ghcr.io/credebl/credo-controller:v2.2.1-alpha-jsonld-vc.2.1@sha256:f4a0da1ec90ddc0a8c4bb52fa8599926dbb98cc0033ee8e24e174ec91d9bb817
    profiles: [issuer-credebl, holder-credebl, verifier-credebl]
    container_name: credebl-agent
    restart: unless-stopped
    depends_on:
      credebl-postgres:
        condition: service_healthy
    # The file holds the transports and the Indy networks that the
    # operator named in VCA_CREDEBL_INDY_LEDGERS; vca setup writes it.
    # The secrets come from the environment, which wins over the file.
    command: ["--config", "/config/agent.json"]
    environment:
      AFJ_REST_LABEL: vca-shared-agent
      AFJ_REST_WALLET_ID: vcasharedagent
      AFJ_REST_WALLET_KEY: ${CREDEBL_AGENT_WALLET_KEY:?set by vca setup}
      AFJ_REST_WALLET_TYPE: postgres
      AFJ_REST_WALLET_URL: credebl-postgres:5432
      AFJ_REST_WALLET_SCHEME: ProfilePerWallet
      AFJ_REST_WALLET_ACCOUNT: credebl
      AFJ_REST_WALLET_PASSWORD: ${CREDEBL_DB_PASSWORD:?set by vca setup}
      AFJ_REST_WALLET_ADMIN_ACCOUNT: credebl
      AFJ_REST_WALLET_ADMIN_PASSWORD: ${CREDEBL_DB_PASSWORD:?set by vca setup}
      AFJ_REST_ADMIN_PORT: "8001"
      AFJ_REST_TENANCY: "true"
      AFJ_REST_API_KEY: ${CREDEBL_AGENT_API_KEY:?set by vca setup}
      # The address a wallet reaches the agent on. Set it to the public
      # address of port 9001 on a public host.
      AFJ_REST_ENDPOINT: ${CREDEBL_AGENT_ENDPOINT:-http://credebl-agent.vca.internal:9001}
      AFJ_REST_SCHEMA_FILE_SERVER_URL: http://credebl-schema-file-server:4000/schemas/
      # The agent posts each DIDComm and OID4VC event to
      # /wh/<organisation>/<topic> of the api gateway, with the
      # organisation of the platform admin. vca dpg bootstrap credebl
      # writes the address into ../credebl/.env and restarts the agent.
      # Before that run the agent sends no event.
      AFJ_REST_WEBHOOK_URL: ${CREDEBL_AGENT_WEBHOOK_URL:-}
      # The status list host of this file (P6-C5b). The agent signs each
      # list with the DID of the issuer and writes it with the API key.
      # The size is the one the platform allocates from.
      STATUS_LIST_SERVER_URL: ${CREDEBL_STATUS_LIST_URL:-http://credebl-status-list:3000}
      STATUS_LIST_API_KEY: ${CREDEBL_STATUS_LIST_API_KEY:?set by vca setup}
      STATUS_LIST_DEFAULT_SIZE: "131072"
    volumes:
      - ../credebl/credebl-agent.json:/config/agent.json:ro
    ports:
      - "${VCA_BIND:-0.0.0.0}:${CREDEBL_AGENT_HOST_PORT:-17182}:9001"
    networks:
      vca:
        aliases:

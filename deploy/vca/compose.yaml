# SPDX-License-Identifier: Apache-2.0
# The vca CLI generates this file. Do not edit it by hand.
# Run: go test ./internal/cli/ to check that it is current.
#
# One profile exists per role and DPG pair, named <role>-<dpg>.
# Start one with: vca deploy --role <role> --dpg <dpg>
# That runs: docker compose --profile <role>-<dpg> up -d
#
# Every service runs read only, as a non-root user, with no added
# capabilities, and with no Docker socket (ADR-005 decisions 2 and 3).
# Every host port binds to VCA_BIND. vca setup sets it to 127.0.0.1 on
# a public host, so only the reverse proxy reaches the services.
name: vca

include:
  - path: dpg/waltid.yaml
  - path: dpg/inji.yaml
  - path: dpg/credebl.yaml

x-vca-service: &vca-service
  restart: unless-stopped
  read_only: true
  user: "65532:65532"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp
  networks:
    - vca

services:

  # Profile issuer-waltid
  issuer-waltid-data-source:
    <<: *vca-service
    image: ghcr.io/centre-for-dpi/vca-data-source:${VCA_VERSION:-latest}
    profiles: [issuer-waltid]
    container_name: issuer-waltid-data-source
    env_file:
      - path: ../issuer-waltid/.env
        required: true
    ports:
      - "${VCA_BIND:-0.0.0.0}:${VCA_HOST_PORT_DATA_SOURCE:-18000}:${VCA_PORTS_DATA_SOURCE:-8100}"
    volumes:
      - issuer-waltid-data-source-data:/data
  issuer-waltid-dpg-adapter-waltid:

{{define "credentials"}}<ul class="credentials" aria-label="{{.Label}}">
{{range .Items}}<li><article class="credential credential-{{.Status}}" id="{{.ID}}" aria-labelledby="{{.ID}}-title">
<div class="credential-top"><span class="credential-issuer">{{.Issuer}}</span><span class="badge badge-{{.Status}}">{{.StatusText}}</span></div>
<h2 class="credential-title" id="{{.ID}}-title">{{.Title}}</h2>
{{if .Meta}}<p class="credential-meta">{{.Meta}}</p>
{{end}}{{if .Body}}<details class="credential-more"><summary>{{.Summary}}</summary>
{{.Body}}</details>
{{end}}</article></li>
{{end}}{{if .Add.Href}}<li><a class="credential-add" href="{{.Add.Href}}"><span aria-hidden="true">+</span> {{.Add.Text}}</a></li>
{{end}}</ul>
{{end}}

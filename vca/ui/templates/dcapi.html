{{define "dcapi"}}{{if .Request}}<form method="post" action="{{.Action}}" class="dcapi-form">{{.Hidden}}<input type="hidden" name="response" value=""><button type="button" class="btn btn-primary" hidden data-dcapi-request="{{.Request}}" data-dcapi-cancel="{{.Cancel}}" data-dcapi-fail="{{.Fail}}">{{.Text}}</button></form>{{else}}<button type="button" class="btn btn-primary" hidden data-dcapi-offer="{{.Offer}}" data-dcapi-ok="{{.OK}}" data-dcapi-cancel="{{.Cancel}}" data-dcapi-fail="{{.Fail}}">{{.Text}}</button>{{end}}{{end}}

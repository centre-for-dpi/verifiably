{{define "hero"}}<section class="hero">
<div class="hero-left">
{{if .Label}}<div class="role-row"><span class="role-dot" aria-hidden="true"></span><span class="role">{{.Label}}</span></div>
{{end}}<h1>{{.Title}}{{if .Emphasis}}<em>{{.Emphasis}}</em>{{end}}</h1>
</div>
<div class="hero-right">
{{if .Lead}}<p class="desc">{{.Lead}}</p>
{{end}}{{if .Actions}}<div class="hero-actions">
{{range .Actions}}{{template "button" .}}
{{end}}</div>
{{end}}{{if .Aside}}<div class="hero-rule" aria-hidden="true"></div>
{{.Aside}}
{{end}}</div>
</section>
{{end}}

# SPDX-License-Identifier: Apache-2.0
#
# SonarCloud configuration for the Verifiable Credentials Adapters (vca/).
#
# The sonarcloud job of .github/workflows/vca-ci.yml runs the analysis on
# every push and on every pull request from this repository. The analysis
# is CI based. Automatic Analysis cannot read Go coverage reports, so it
# must stay OFF for this project (Administration, Analysis Method).
#
# The project is separate from centre-for-dpi_verifiably, the project of
# verifiably-go/. The owner creates it once in SonarCloud with the key
# below; the SONAR_TOKEN repository secret already exists. See
# vca/docs/ci.md, "SonarCloud".

sonar.projectKey=centre-for-dpi_verifiably_vca
sonar.organization=centre-for-dpi
sonar.projectName=vca

# --- Scope -------------------------------------------------------------------
# The analysis root is vca/ (this file's folder). Sources are the Go module.
# Generated code, test data, vendored scripts, the output of a local
# "vca setup" (deploy/) or a release build (dist/), and the reports the
# CI jobs put next to this file are not sources. coverage.out is bigger
# than the 20 MB a source file may have; the Go sensor still reads it
# through sonar.go.coverage.reportPaths.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  gen/**,\
  **/*_test.go,\
  **/testdata/**,\
  **/*.min.js,\
  deploy/**,\
  dist/**,\
  .scannerwork/**,\
  coverage.out,\
  test-output.txt,\
  golangci-lint-report.xml

# The DPG adapters implement one interface against three stacks, so their
# tests share a shape by design. Review that duplication by hand.
sonar.cpd.exclusions=\
  services/dpg-adapter-*/**/*_test.go,\
  **/testdata/**

# --- Go ----------------------------------------------------------------------
# coverage.out: go test -covermode=atomic -coverpkg=./... (the test job).
# test-output.txt: the go test -json stream of the same run.
# golangci-lint-report.xml: the checkstyle report of the lint job.
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-output.txt
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

# The coverage ratio covers the same Go code as the COVERAGE_FLOOR of
# vca-ci: no generated code, no main packages, no kit example page.
# Shell and JavaScript are still analysed for bugs and hotspots; they have
# no coverage report, so they stay out of the ratio.
sonar.coverage.exclusions=\
  gen/**,\
  **/cmd/**,\
  ui/example/**,\
  **/*_test.go,\
  **/testdata/**,\
  **/*.sh,\
  **/*.js

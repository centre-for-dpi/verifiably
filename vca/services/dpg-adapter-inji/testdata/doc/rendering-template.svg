<svg xmlns="http://www.w3.org/2000/svg" width="340" height="214" viewBox="0 0 340 214" role="img" aria-label="Farmer credential card">
  <rect width="340" height="214" rx="14" fill="#12107c"/>
  <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Farmer Credential</text>
  <text x="20" y="54" fill="#c9c8ff" font-family="sans-serif" font-size="11">Ministry of Agriculture</text>
  <text x="20" y="88" fill="#c9c8ff" font-family="sans-serif" font-size="11">Name</text>
  <text x="20" y="106" fill="#ffffff" font-family="sans-serif" font-size="14">{{credentialSubject.fullName}}</text>
  <text x="20" y="134" fill="#c9c8ff" font-family="sans-serif" font-size="11">Farmer ID</text>
  <text x="20" y="152" fill="#ffffff" font-family="sans-serif" font-size="14">{{credentialSubject.farmerID}}</text>
  <text x="20" y="194" fill="#c9c8ff" font-family="sans-serif" font-size="11">Valid until {{validUntil}}</text>
</svg>

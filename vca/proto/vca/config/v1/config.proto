// SPDX-License-Identifier: Apache-2.0
// Setup configuration contract (ADR-007 decision 6). Every setup variable
// appears once in the Config message. The vca CLI, the docs, and the
// services derive their variables from this message.
// Each field carries the setting option. The option names the environment
// variable, the default, the secret flag, and the roles and DPGs that use
// the field. A generator reads the option to build the CLI prompts, the
// docs table, and the service loaders.
syntax = "proto3";

package vca.config.v1;

import "google/protobuf/descriptor.proto";
import "vca/common/v1/common.proto";

// The setting option describes one setup variable (ADR-007 decision 6).
extend google.protobuf.FieldOptions {
  // The setting metadata of the field.
  Setting setting = 51002;
}

// Dpg names the digital public good behind a deployment.
// The CLI flag --dpg of ADR-007 takes these values. This enum is the one
// place outside the adapter services where a vendor name appears.
enum Dpg {
  DPG_UNSPECIFIED = 0;
  // walt.id community stack.
  DPG_WALTID = 1;
  // MOSIP Inji stack.
  DPG_INJI = 2;
  // CREDEBL platform.
  DPG_CREDEBL = 3;
}

// Setting is the metadata of one setup variable.
message Setting {
  // The one sentence help text the CLI prompt and the docs show.
  string description = 1;
  // The environment variable name, for example VCA_PUBLIC_URL.
  string env = 2;
  // The default value as text. Empty means no default.
  string default = 3;
  // True when the value is a secret. The CLI writes it with mode 0600
  // and never prints it.
  bool secret = 4;
  // The roles that need the field. Empty means every role.
  repeated vca.common.v1.Role roles = 5;
  // The DPGs that need the field. Empty means every DPG.
  repeated Dpg dpgs = 6;
  // True when the CLI fails without a value in non interactive mode.
  bool required = 7;
  // The validation rule in plain words, for example an absolute https URL.
  string validation = 8;
}

// Config is the full set of setup variables of one role and DPG pair.
// The CLI asks only for the fields that the chosen role and DPG need.
// Validation notes on each field are the rules the CLI applies.
message Config {
  // The deployment role. Required. The CLI flag is --role.
  vca.common.v1.Role role = 1 [(setting) = {
    description: "The deployment role."
    env: "VCA_ROLE"
    required: true
    validation: "One of issuer, holder, verifier, admin."
  }];
  // The DPG behind the role. Required. The CLI flag is --dpg.
  Dpg dpg = 2 [(setting) = {
    description: "The digital public good behind the role."
    env: "VCA_DPG"
    required: true
    validation: "One of waltid, inji, credebl."
  }];
  // The public base URL of the deployment, for example https://issuer.example.
  // Optional. Defaults to http://localhost with the host port of the portal.
  // A public host must use an absolute https URL without a path or a trailing slash.
  // Wallets and verifiers reach the deployment at this URL.
  string public_url = 3 [(setting) = {
    description: "The public base URL of the deployment. Defaults to localhost."
    env: "VCA_PUBLIC_URL"
    validation: "An absolute https URL without a path or a trailing slash. http is allowed for localhost."
  }];
  // The base URL that other containers on the same network use.
  // Optional. Defaults to public_url. Must be an absolute http or https URL.
  string internal_url = 4 [(setting) = {
    description: "The base URL that other containers use to reach the deployment."
    env: "VCA_INTERNAL_URL"
    validation: "An absolute http or https URL. Defaults to the public URL."
  }];
  // The PostgreSQL connection URL of the services of this role.
  // Reserved for the PostgreSQL backend. No service reads it yet.
  // Every service keeps its data in the file store under /data
  // (ADR-002 decision 3). Optional. When set, it must start with
  // postgres:// or postgresql://.
  string database_url = 5 [(setting) = {
    description: "Reserved for the PostgreSQL backend. No service reads it yet."
    env: "VCA_DATABASE_URL"
    secret: true
    validation: "Starts with postgres:// or postgresql://."
  }];
  // The OIDC provider that staff, citizens, or admins log in with.
  // Required for every role.
  Oidc oidc = 6 [(setting) = {
    description: "The OpenID Connect provider for logins."
    env: "VCA_OIDC"
    required: true
  }];
  // The references to generated or supplied secrets.
  Secrets secrets = 7 [(setting) = {
    description: "The references to generated or supplied secrets."
    env: "VCA_SECRETS"
  }];
  // The listen ports of the services of this role.
  Ports ports = 8 [(setting) = {
    description: "The listen ports of the services of this role."
    env: "VCA_PORTS"
  }];
  // The trust list publication methods to turn on (ADR-011 decision 4).
  // Optional. Defaults to etsi. Valid values are etsi and dedi.
  repeated string trust_methods = 9 [(setting) = {
    description: "The trust list publication methods to turn on."
    env: "VCA_TRUST_METHODS"
    default: "etsi"
    roles: ROLE_ISSUER
    roles: ROLE_VERIFIER
    roles: ROLE_ADMIN
    validation: "A comma separated list of etsi and dedi."
  }];
  // The base URL of the DPG API as the services reach it.
  // Required. Must be an absolute http or https URL.
  string dpg_url = 10 [(setting) = {
    description: "The base URL of the DPG API as the services reach it."
    env: "VCA_DPG_URL"
    required: true
    roles: ROLE_ISSUER
    roles: ROLE_HOLDER
    roles: ROLE_VERIFIER
    validation: "An absolute http or https URL."
  }];
  // The OTLP endpoint for traces (ADR-002 decision 6).
  // Optional. Empty disables export. Must be a host and port or a URL.
  string otlp_endpoint = 11 [(setting) = {
    description: "The OTLP endpoint that receives traces."
    env: "VCA_OTLP_ENDPOINT"
    validation: "A host and port or a URL. Empty turns export off."
  }];
  // The log level. Optional. One of debug, info, warn, error. Defaults to info.
  string log_level = 12 [(setting) = {
    description: "The log level of every service of the role."
    env: "VCA_LOG_LEVEL"
    default: "info"
    validation: "One of debug, info, warn, error."
  }];
  // The Redis URL for rate limits and OTP (ADR-020 decision 6).
  // Required for the holder role. Must start with redis:// or rediss://.
  string redis_url = 13 [(setting) = {
    description: "The Redis URL for rate limits and one time codes."
    env: "VCA_REDIS_URL"
    secret: true
    required: true
    roles: ROLE_HOLDER
    validation: "Starts with redis:// or rediss://."
  }];

  // Oidc describes one OpenID Connect provider.
  message Oidc {
    // The OIDC discovery URL of the provider.
    // Required. Defaults to the Keycloak of the DPG stack on the compose
    // network. A production deployment points it at the national IdP.
    string discovery_url = 1 [(setting) = {
      description: "The OIDC discovery URL of the provider. Defaults to the Keycloak of the stack."
      env: "VCA_OIDC_DISCOVERY_URL"
      required: true
      validation: "An absolute http or https URL that serves a discovery document."
    }];
    // The OAuth 2.0 client id. Optional. Defaults to vca- plus the role
    // name, which is the client the generated realm holds
    // (ADR-010 decision 3).
    string client_id = 2 [(setting) = {
      description: "The OAuth 2.0 client id at the provider. Defaults to vca- plus the role."
      env: "VCA_OIDC_CLIENT_ID"
      validation: "Defaults to vca- plus the role name."
    }];
    // The reference to the client secret. Required. The CLI generates it
    // and writes it into the generated realm.
    vca.common.v1.SecretRef client_secret = 3 [(setting) = {
      description: "The reference to the OAuth 2.0 client secret."
      env: "VCA_OIDC_CLIENT_SECRET"
      secret: true
      required: true
      validation: "32 random bytes. The CLI generates it."
    }];
    // The JSON path of the claim that carries roles (ADR-012 decision 3).
    // Optional. Defaults to realm_access.roles.
    string roles_claim_path = 4 [(setting) = {
      description: "The JSON path of the token claim that carries roles."
      env: "VCA_OIDC_ROLES_CLAIM_PATH"
      default: "realm_access.roles"
    }];
    // The redirect URI. Optional. Defaults to public_url plus /auth/callback.
    // Must match the value at the provider exactly.
    string redirect_uri = 5 [(setting) = {
      description: "The redirect URI registered at the provider."
      env: "VCA_OIDC_REDIRECT_URI"
      validation: "Defaults to the public URL plus /auth/callback. Must match the provider exactly."
    }];
    // The base URL that a browser uses to reach the provider.
    // Optional. Defaults to http://localhost with the host port of the
    // Keycloak of the DPG stack. The discovery URL stays a container
    // URL, so the browser needs this one as well.
    string public_url = 6 [(setting) = {
      description: "The base URL that a browser uses to reach the provider."
      env: "VCA_OIDC_PUBLIC_URL"
      validation: "An absolute http or https URL. Defaults to the host port of the Keycloak."
    }];
  }

  // Secrets holds the references of every secret the role needs.
  // The CLI generates the values and writes them with file mode 0600.
  message Secrets {
    // The ES256 or Ed25519 signing key of the deployment (ADR-011 decision 5).
    // Required. The reference points at a PEM or JWK file, or a KMS key.
    vca.common.v1.SecretRef signing_key = 1 [(setting) = {
      description: "The ES256 or Ed25519 signing key of the deployment."
      env: "VCA_SECRETS_SIGNING_KEY"
      secret: true
      required: true
      validation: "A reference to a PEM or JWK file, or a KMS key."
    }];
    // The key id (kid) that the JWKS publishes for the signing key.
    // Optional. Defaults to the JWK thumbprint.
    string signing_key_id = 2 [(setting) = {
      description: "The key id that the JWKS publishes for the signing key."
      env: "VCA_SECRETS_SIGNING_KEY_ID"
      validation: "Defaults to the JWK thumbprint."
    }];
    // The key that encrypts session cookies. Required. 32 random bytes.
    vca.common.v1.SecretRef session_key = 3 [(setting) = {
      description: "The key that encrypts session cookies."
      env: "VCA_SECRETS_SESSION_KEY"
      secret: true
      required: true
      validation: "32 random bytes. The CLI generates it."
    }];
    // The one time bootstrap token of the first super admin (ADR-010 decision 4).
    // Required for the admin role. The CLI prints it once.
    vca.common.v1.SecretRef bootstrap_token = 4 [(setting) = {
      description: "The one time bootstrap token of the first super admin."
      env: "VCA_SECRETS_BOOTSTRAP_TOKEN"
      secret: true
      required: true
      roles: ROLE_ADMIN
      validation: "The CLI generates it and prints it once."
    }];
    // The API key or client secret for the DPG API. Optional.
    vca.common.v1.SecretRef dpg_api_key = 5 [(setting) = {
      description: "The API key or client secret for the DPG API."
      env: "VCA_SECRETS_DPG_API_KEY"
      secret: true
      roles: ROLE_ISSUER
      roles: ROLE_HOLDER
      roles: ROLE_VERIFIER
    }];
  }

  // Ports lists the listen port of each service of the role.
  // Every value must be between 1024 and 65535 and unique in the role.
  message Ports {
    // The port of the role portal and its Connect API. Required.
    // Defaults to 8080.
    int32 portal = 1 [(setting) = {
      description: "The port of the role portal and its Connect API."
      env: "VCA_PORTS_PORTAL"
      default: "8080"
      required: true
      validation: "Between 1024 and 65535 and unique in the role."
    }];
    // The port of the auth service. Defaults to 8081.
    int32 auth = 2 [(setting) = {
      description: "The port of the auth service."
      env: "VCA_PORTS_AUTH"
      default: "8081"
      validation: "Between 1024 and 65535 and unique in the role."
    }];
    // The port of the DPG adapter service. Defaults to 8090.
    int32 adapter = 3 [(setting) = {
      description: "The port of the DPG adapter service."
      env: "VCA_PORTS_ADAPTER"
      default: "8090"
      roles: ROLE_ISSUER
      roles: ROLE_HOLDER
      roles: ROLE_VERIFIER
      validation: "Between 1024 and 65535 and unique in the role."
    }];
    // The port of each remaining service, keyed by service name.
    // Optional. The CLI assigns 8100 and up in service name order.
    map<string, int32> services = 4 [(setting) = {
      description: "The port of each remaining service, keyed by service name."
      env: "VCA_PORTS_<SERVICE>"
      validation: "The CLI assigns 8100 and up in service name order."
    }];
  }
}

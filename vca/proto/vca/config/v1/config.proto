// SPDX-License-Identifier: Apache-2.0
// Setup configuration contract (ADR-007 decision 6). Every setup variable
// appears once in the Config message. The vca CLI, the docs, and the
// services derive their variables from this message.
// The environment variable name of a field is VCA_ plus the field name in
// upper case, for example VCA_PUBLIC_URL. Nested fields join with an
// underscore, for example VCA_OIDC_DISCOVERY_URL.
syntax = "proto3";

package vca.config.v1;

import "vca/common/v1/common.proto";

// Dpg names the digital public good behind a deployment.
// The CLI flag --dpg of ADR-007 takes these values. This enum is the one
// place outside the adapter services where a vendor name appears.
enum Dpg {
  DPG_UNSPECIFIED = 0;
  // walt.id community stack.
  DPG_WALTID = 1;
  // MOSIP Inji stack.
  DPG_INJI = 2;
  // CREDEBL platform.
  DPG_CREDEBL = 3;
}

// Config is the full set of setup variables of one role and DPG pair.
// The CLI asks only for the fields that the chosen role and DPG need.
// Validation notes on each field are the rules the CLI applies.
message Config {
  // The deployment role. Required. The CLI flag is --role.
  vca.common.v1.Role role = 1;
  // The DPG behind the role. Required. The CLI flag is --dpg.
  Dpg dpg = 2;
  // The public base URL of the deployment, for example https://issuer.example.
  // Required. Must be an absolute https URL without a path or a trailing slash.
  // Wallets and verifiers reach the deployment at this URL.
  string public_url = 3;
  // The base URL that other containers on the same network use.
  // Optional. Defaults to public_url. Must be an absolute http or https URL.
  string internal_url = 4;
  // The PostgreSQL connection URL of the services of this role.
  // Required. Must start with postgres:// or postgresql://.
  // The CLI stores the password part as a secret reference.
  string database_url = 5;
  // The OIDC provider that staff, citizens, or admins log in with.
  // Required for every role.
  Oidc oidc = 6;
  // The references to generated or supplied secrets.
  Secrets secrets = 7;
  // The listen ports of the services of this role.
  Ports ports = 8;
  // The trust list publication methods to turn on (ADR-011 decision 4).
  // Optional. Defaults to etsi. Valid values are etsi and dedi.
  repeated string trust_methods = 9;
  // The base URL of the DPG API as the services reach it.
  // Required. Must be an absolute http or https URL.
  string dpg_url = 10;
  // The OTLP endpoint for traces (ADR-002 decision 6).
  // Optional. Empty disables export. Must be a host and port or a URL.
  string otlp_endpoint = 11;
  // The log level. Optional. One of debug, info, warn, error. Defaults to info.
  string log_level = 12;
  // The Redis URL for rate limits and OTP (ADR-020 decision 6).
  // Required for the holder role. Must start with redis:// or rediss://.
  string redis_url = 13;

  // Oidc describes one OpenID Connect provider.
  message Oidc {
    // The OIDC discovery URL of the provider.
    // Required. Must be an absolute https URL. The CLI fetches the
    // discovery document to check it.
    string discovery_url = 1;
    // The OAuth 2.0 client id. Required unless the CLI registers the
    // client with Dynamic Client Registration (ADR-010 decision 3).
    string client_id = 2;
    // The reference to the client secret. Optional for public clients.
    vca.common.v1.SecretRef client_secret = 3;
    // The JSON path of the claim that carries roles (ADR-012 decision 3).
    // Optional. Defaults to realm_access.roles.
    string roles_claim_path = 4;
    // The redirect URI. Optional. Defaults to public_url plus /auth/callback.
    // Must match the value at the provider exactly.
    string redirect_uri = 5;
  }

  // Secrets holds the references of every secret the role needs.
  // The CLI generates the values and writes them with file mode 0600.
  message Secrets {
    // The ES256 or Ed25519 signing key of the deployment (ADR-011 decision 5).
    // Required. The reference points at a PEM or JWK file, or a KMS key.
    vca.common.v1.SecretRef signing_key = 1;
    // The key id (kid) that the JWKS publishes for the signing key.
    // Optional. Defaults to the JWK thumbprint.
    string signing_key_id = 2;
    // The key that encrypts session cookies. Required. 32 random bytes.
    vca.common.v1.SecretRef session_key = 3;
    // The one time bootstrap token of the first super admin (ADR-010 decision 4).
    // Required for the admin role. The CLI prints it once.
    vca.common.v1.SecretRef bootstrap_token = 4;
    // The API key or client secret for the DPG API. Optional.
    vca.common.v1.SecretRef dpg_api_key = 5;
  }

  // Ports lists the listen port of each service of the role.
  // Every value must be between 1024 and 65535 and unique in the role.
  message Ports {
    // The port of the role portal and its Connect API. Required.
    // Defaults to 8080.
    int32 portal = 1;
    // The port of the auth service. Defaults to 8081.
    int32 auth = 2;
    // The port of the DPG adapter service. Defaults to 8090.
    int32 adapter = 3;
    // The port of each remaining service, keyed by service name.
    // Optional. The CLI assigns 8100 and up in service name order.
    map<string, int32> services = 4;
  }
}

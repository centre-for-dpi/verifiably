// SPDX-License-Identifier: Apache-2.0
// DPG adapter contract. This file replaces the legacy 25 method Adapter
// interface with one small service per role (ADR-002 decision 2).
// A DPG adapter serves only the services its DPG supports. For each
// other service it returns the Connect code Unimplemented.
// The adapter never re-encodes a credential (ADR-003 decision 6).
syntax = "proto3";

package vca.backend.v1;

import "google/protobuf/timestamp.proto";
import "vca/common/v1/common.proto";

// CapabilityService tells a caller what the adapter can do.
// Every adapter serves this service.
service CapabilityService {
  // GetCapabilities returns the formats, channels, roles, and protocols
  // that this adapter supports. The UI offers only what is possible
  // (ADR-016 decision 6).
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

// IssuerBackendService drives the issuer side of a DPG.
service IssuerBackendService {
  // RegisterCredentialConfiguration makes a published schema known to the
  // DPG so the DPG can issue it (ADR-013 decision 3).
  rpc RegisterCredentialConfiguration(RegisterCredentialConfigurationRequest) returns (RegisterCredentialConfigurationResponse);
  // CreateOffer builds an OID4VCI credential offer for one subject.
  rpc CreateOffer(CreateOfferRequest) returns (CreateOfferResponse);
  // Issue produces one credential and returns it as opaque bytes.
  rpc Issue(IssueRequest) returns (IssueResponse);
  // IssueBatch produces many credentials in one call.
  rpc IssueBatch(IssueBatchRequest) returns (IssueBatchResponse);
  // GetIssuanceStatus returns the state of one offer or deferred issuance.
  rpc GetIssuanceStatus(GetIssuanceStatusRequest) returns (GetIssuanceStatusResponse);
  // Revoke sets the status bit of one credential through its status index.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  // ListIssuedCredentials searches the ledger of issued credentials that
  // the DPG keeps. An adapter serves it only when it lists
  // FEATURE_ISSUED_LEDGER.
  rpc ListIssuedCredentials(ListIssuedCredentialsRequest) returns (ListIssuedCredentialsResponse);
  // GetIssuerMetadata returns the OID4VCI issuer metadata of the DPG.
  rpc GetIssuerMetadata(GetIssuerMetadataRequest) returns (GetIssuerMetadataResponse);
  // GetIssuerIdentity returns the identifiers, the key, and the metadata
  // the DPG signs with. An empty answer means the DPG has no identity
  // yet (ADR-046 decision 1).
  rpc GetIssuerIdentity(GetIssuerIdentityRequest) returns (GetIssuerIdentityResponse);
  // ProvisionIssuerIdentity asks the DPG to make a key and an identifier
  // in one step. The DPG keeps the key (ADR-046 decision 2). An adapter
  // serves it only when it lists FEATURE_ISSUER_IDENTITY_PROVISION.
  rpc ProvisionIssuerIdentity(ProvisionIssuerIdentityRequest) returns (ProvisionIssuerIdentityResponse);
  // ImportIssuerIdentity binds an existing DID or X.509 chain to a key in
  // the key store of the DPG (ADR-046 decision 2). An adapter serves it
  // only when it lists FEATURE_ISSUER_IDENTITY_IMPORT_DID or
  // FEATURE_ISSUER_IDENTITY_IMPORT_X509.
  rpc ImportIssuerIdentity(ImportIssuerIdentityRequest) returns (ImportIssuerIdentityResponse);
}

// HolderBackendService drives the wallet side of a DPG.
service HolderBackendService {
  // Register creates the wallet account for one citizen.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // ListCredentials returns the credentials in one wallet.
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  // AcceptOffer claims a credential offer into the wallet.
  rpc AcceptOffer(AcceptOfferRequest) returns (AcceptOfferResponse);
  // Present answers an OID4VP request with credentials from the wallet.
  rpc Present(PresentRequest) returns (PresentResponse);
  // DeleteCredential removes one credential from the wallet.
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
  // ListKeys lists the keys of a wallet. An adapter serves it when it
  // lists FEATURE_WALLET_KEYS.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  // CreateKey makes a key in a wallet, of one of wallet_key_types.
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse);
  // ListDids lists the DIDs of a wallet. An adapter serves it when it
  // lists FEATURE_WALLET_DIDS.
  rpc ListDids(ListDidsRequest) returns (ListDidsResponse);
  // CreateDid makes a DID in a wallet, of one of wallet_did_methods.
  rpc CreateDid(CreateDidRequest) returns (CreateDidResponse);
  // SetDefaultDid picks the DID a wallet binds new credentials to.
  rpc SetDefaultDid(SetDefaultDidRequest) returns (SetDefaultDidResponse);
  // RejectOffer declines a credential offer in the wallet. An adapter
  // serves it when it lists FEATURE_WALLET_REJECT_OFFER.
  rpc RejectOffer(RejectOfferRequest) returns (RejectOfferResponse);
  // ListEvents lists the event log of a wallet, newest first. An adapter
  // serves it when it lists FEATURE_WALLET_EVENTS.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // GetCredentialDocument returns a printable document of one held
  // credential, such as a PDF. An adapter serves it when it lists
  // FEATURE_WALLET_DOCUMENT.
  rpc GetCredentialDocument(GetCredentialDocumentRequest) returns (GetCredentialDocumentResponse);
}

// VerifierBackendService drives the verifier side of a DPG.
service VerifierBackendService {
  // CreateRequest starts an OID4VP transaction and returns its request URI.
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
  // GetResult returns the state of one OID4VP transaction.
  rpc GetResult(GetResultRequest) returns (GetResultResponse);
  // SubmitBrowserAnswer hands the answer of the Digital Credentials API
  // of a browser to the verifier of the DPG. An adapter serves it when
  // it lists FEATURE_DC_API_VERIFY.
  rpc SubmitBrowserAnswer(SubmitBrowserAnswerRequest) returns (SubmitBrowserAnswerResponse);
  // VerifyCredential checks one credential, presentation, QR text,
  // image, or PDF with the verifier of the DPG. An adapter that lists
  // FEATURE_VERIFY_UPLOAD serves it. Every other adapter answers
  // Unimplemented.
  rpc VerifyCredential(VerifyCredentialRequest) returns (VerifyCredentialResponse);
}

// CatalogBackendService reads the credential types a DPG knows.
service CatalogBackendService {
  // ListCredentialTypes returns the credential configurations of the DPG.
  rpc ListCredentialTypes(ListCredentialTypesRequest) returns (ListCredentialTypesResponse);
}

// TenantBackendService manages the tenants of a DPG that separates
// tenants (ADR-037 decision 2). An adapter serves it only when its DPG
// has tenancy and the adapter lists FEATURE_MULTI_TENANCY. Every other
// adapter returns the Connect code Unimplemented for each RPC.
service TenantBackendService {
  // CreateTenant creates one tenant in the DPG.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  // GetTenant returns one tenant of the DPG with its DIDs.
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  // ListTenants returns the tenants of the DPG in pages.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // DeleteTenant removes one tenant from the DPG.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  // ListClientCredentials returns the client credentials of one tenant
  // without their secrets (ADR-038 decision 2). The adapter serves it
  // when it lists FEATURE_TENANT_CLIENT_CREDENTIALS.
  rpc ListClientCredentials(ListClientCredentialsRequest) returns (ListClientCredentialsResponse);
  // CreateClientCredential creates one client credential for a tenant.
  // The answer carries the secret once.
  rpc CreateClientCredential(CreateClientCredentialRequest) returns (CreateClientCredentialResponse);
  // DeleteClientCredential removes one client credential of a tenant.
  rpc DeleteClientCredential(DeleteClientCredentialRequest) returns (DeleteClientCredentialResponse);
}

// NotificationBackendService reads and sets the webhook that a DPG calls
// on events, per DPG tenant (ADR-040 decision 2). An adapter serves it
// only when it lists FEATURE_WEBHOOKS. Every other adapter returns the
// Connect code Unimplemented for each RPC.
service NotificationBackendService {
  // GetWebhook returns the webhook of one DPG tenant.
  rpc GetWebhook(GetWebhookRequest) returns (GetWebhookResponse);
  // SetWebhook sets or clears the webhook of one DPG tenant.
  rpc SetWebhook(SetWebhookRequest) returns (SetWebhookResponse);
}

// Channel names a way to deliver a credential to a citizen (ADR-016).
enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  // OID4VCI pre-authorized code flow.
  CHANNEL_OID4VCI_PREAUTH = 1;
  // OID4VCI authorization code flow.
  CHANNEL_OID4VCI_AUTHCODE = 2;
  // A PDF document with a QR code.
  CHANNEL_PDF = 3;
  // An email that carries the offer.
  CHANNEL_EMAIL = 4;
  // An SMS that carries the offer.
  CHANNEL_SMS = 5;
  // A download link.
  CHANNEL_LINK = 6;
  // The browser Digital Credentials API.
  CHANNEL_DC_API = 7;
  // A DIDComm out of band invitation that carries the offer.
  CHANNEL_DIDCOMM_OOB = 8;
  // A QR code that carries the credential as CBOR under claim 169.
  CHANNEL_CLAIM169_QR = 9;
}

// Protocol names a standard exchange protocol an adapter speaks.
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  // OpenID for Verifiable Credential Issuance 1.0.
  PROTOCOL_OID4VCI = 1;
  // OpenID for Verifiable Presentations 1.0.
  PROTOCOL_OID4VP = 2;
  // OID4VP with DCQL queries and credential_sets.
  PROTOCOL_OID4VP_DCQL = 3;
  // OID4VP with Presentation Exchange (legacy wallets).
  PROTOCOL_OID4VP_PEX = 4;
  // OID4VCI batch credential issuance.
  PROTOCOL_OID4VCI_BATCH = 5;
  // OID4VCI deferred credential issuance.
  PROTOCOL_OID4VCI_DEFERRED = 6;
  // DIDComm issue credential protocol, version 2.
  PROTOCOL_DIDCOMM_ISSUE_V2 = 7;
  // DIDComm present proof protocol, version 2.
  PROTOCOL_DIDCOMM_PRESENT_V2 = 8;
  // Presentation through the browser Digital Credentials API.
  PROTOCOL_DC_API = 9;
}

// Feature names one thing an adapter does against its DPG beyond the
// role services. A page shows a feature on a stack only when the live
// adapter lists it (ADR-034 decision 5). An adapter lists a feature
// only when the RPC behind it works today.
enum Feature {
  FEATURE_UNSPECIFIED = 0;
  // The adapter creates the issuer DID and key in the DPG.
  FEATURE_ISSUER_IDENTITY_PROVISION = 1;
  // The adapter imports an existing DID and key into the DPG.
  FEATURE_ISSUER_IDENTITY_IMPORT_DID = 2;
  // The adapter imports an X.509 certificate chain into the DPG.
  FEATURE_ISSUER_IDENTITY_IMPORT_X509 = 3;
  // RegisterCredentialConfiguration makes a schema issuable on the DPG.
  FEATURE_CREDENTIAL_CONFIG_API = 4;
  // Revoke sets a credential to revoked through the DPG.
  FEATURE_REVOCATION = 5;
  // Revoke can suspend and reinstate a credential through the DPG.
  FEATURE_SUSPENSION = 6;
  // GetIssuanceStatus reports whether a wallet claimed an offer.
  FEATURE_ISSUANCE_STATUS = 7;
  // The DPG keeps a searchable ledger of issued credentials.
  FEATURE_ISSUED_LEDGER = 8;
  // IssueBatch issues many credentials in one DPG call.
  FEATURE_BULK_NATIVE = 9;
  // The DPG can ask the holder to present a credential before it issues.
  FEATURE_PRESENTATION_DURING_ISSUANCE = 10;
  // The DPG separates tenants.
  FEATURE_MULTI_TENANCY = 11;
  // The DPG issues client credentials per tenant.
  FEATURE_TENANT_CLIENT_CREDENTIALS = 12;
  // The DPG calls a webhook on events.
  FEATURE_WEBHOOKS = 13;
  // The DPG calls back on issuance and presentation session events.
  FEATURE_SESSION_CALLBACKS = 14;
  // The DPG groups tenants into ecosystems.
  FEATURE_ECOSYSTEMS = 15;
  // The wallet manages its keys.
  FEATURE_WALLET_KEYS = 16;
  // The wallet manages its DIDs.
  FEATURE_WALLET_DIDS = 17;
  // The wallet keeps an event log.
  FEATURE_WALLET_EVENTS = 18;
  // The wallet can decline a pending offer.
  FEATURE_WALLET_REJECT_OFFER = 19;
  // The verifier checks an uploaded credential, QR code, image, or PDF.
  FEATURE_VERIFY_UPLOAD = 20;
  // The verifier takes a presentation through the Digital Credentials API.
  FEATURE_DC_API_VERIFY = 21;
  // The verifier asks for AnonCreds proofs with predicates.
  FEATURE_ANONCREDS_PROOF = 22;
  // The wallet renders a held credential as a document, such as a PDF.
  FEATURE_WALLET_DOCUMENT = 23;
  // The wallet claims an offer in its own pages, not through
  // AcceptOffer. The wallet portal links the holder there, and it keeps
  // the browser store for a credential the holder pastes.
  FEATURE_WALLET_CLAIM_IN_STACK = 24;
}

// GetCapabilitiesRequest has no fields.
message GetCapabilitiesRequest {}

// GetCapabilitiesResponse lists what the adapter supports.
message GetCapabilitiesResponse {
  // The name of the adapter, for example the service name.
  string adapter = 1;
  // The version of the DPG behind the adapter.
  string dpg_version = 2;
  // The credential formats the adapter can issue or check.
  repeated vca.common.v1.Format formats = 3;
  // The delivery channels the adapter supports.
  repeated Channel channels = 4;
  // The roles the adapter serves. The adapter returns Unimplemented for
  // the service of each role that is not in this list.
  repeated vca.common.v1.Role roles = 5;
  // The exchange protocols the adapter speaks.
  repeated Protocol protocols = 6;
  // The features the adapter implements against the DPG today.
  repeated Feature features = 7;
  // The DPG behind the adapter, with its components and links.
  DpgInfo dpg_info = 8;
  // The DID methods the adapter can provision or use, as method names
  // such as did:key.
  repeated string did_methods = 9;
  // The status list kinds the adapter can embed in a credential.
  repeated StatusListBinding.Kind status_mechanisms = 10;
  // The key types ProvisionIssuerIdentity accepts, such as Ed25519.
  repeated string key_types = 11;
  // The key types CreateKey accepts in a wallet.
  repeated string wallet_key_types = 12;
  // The DID methods CreateDid accepts in a wallet, such as did:key.
  repeated string wallet_did_methods = 13;
}

// DpgInfo names the DPG behind an adapter. The pages show it, so a
// vendor name never appears outside the adapters (ADR-001 decision 4).
message DpgInfo {
  // The name of the DPG as a page shows it.
  string display_name = 1;
  // The release of the DPG.
  string version = 2;
  // The components the stack runs for the roles this adapter serves.
  repeated Component components = 3;
  // The plugins the DPG runs, such as a data provider plugin. Empty when
  // the DPG has none or the adapter cannot name them.
  repeated string plugins = 4;
}

// Component is one deployed part of a DPG stack.
message Component {
  // The name of the component, as the stack file names it.
  string name = 1;
  // The pinned version or image tag.
  string version = 2;
  // The source repository.
  string repository_url = 3;
  // The documentation.
  string docs_url = 4;
  // The SPDX licence identifier.
  string license = 5;
  // The public address of the component, when it serves pages to
  // people, such as a wallet. Empty for a service with no pages.
  string url = 6;
}

// CredentialConfiguration is one entry of credential_configurations_supported
// in the OID4VCI issuer metadata.
message CredentialConfiguration {
  // The configuration id the wallet uses in the offer.
  string id = 1;
  // The wire format.
  vca.common.v1.Format format = 2;
  // The credential type. The VCDM type name or the SD-JWT VC vct.
  string type = 3;
  // The JSON Schema 2020-12 document of the credential, as a string.
  string json_schema = 4;
  // The OID4VCI display metadata, as a JSON string.
  string display = 5;
  // The claim names the issuer marks as selectively disclosable.
  repeated string sd_claims = 6;
  // The JSON-LD context extensions of an ldp_vc configuration, in order.
  // The adapter puts the base context of the data model first.
  repeated string contexts = 7;
  // The render templates the DPG puts in the credentials of this
  // configuration, such as an SVG card. Empty when the DPG has none.
  repeated RenderTemplate render_templates = 8;
}

// RenderTemplate is one render method of a credential, as the DPG hosts
// it.
message RenderTemplate {
  // The URL the credential names for the template.
  string url = 1;
  // The media type, such as image/svg+xml.
  string media_type = 2;
  // The template as the DPG serves it. The adapter caps its size.
  string content = 3;
  // The name of the render method, when the credential gives one.
  string name = 4;
}

// RegisterCredentialConfigurationRequest carries one configuration to register.
message RegisterCredentialConfigurationRequest {
  // The configuration to register. The adapter replaces an entry with the same id.
  CredentialConfiguration configuration = 1;
}

// RegisterCredentialConfigurationResponse confirms the registration.
message RegisterCredentialConfigurationResponse {
  // The configuration id as the DPG stores it.
  string id = 1;
}

// StatusListBinding points at the status entry of one credential.
message StatusListBinding {
  // The kind of status list.
  Kind kind = 1;
  // The id of the list in the status service.
  string list_id = 2;
  // The index of the credential in the list.
  int64 index = 3;
  // The public URL that a verifier fetches.
  string publish_url = 4;

  // Kind names the status list standard.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // W3C Bitstring Status List (ADR-018).
    KIND_BITSTRING = 1;
    // IETF Token Status List (ADR-019).
    KIND_TOKEN = 2;
  }
}

// IssueSpec is the input that CreateOffer, Issue, and IssueBatch share.
message IssueSpec {
  // The credential configuration id from RegisterCredentialConfiguration.
  string configuration_id = 1;
  // The wire format to produce.
  vca.common.v1.Format format = 2;
  // The subject claims as a JSON object string.
  string subject_data = 3;
  // The subject reference and DID, when the flow knows them.
  vca.common.v1.Subject subject = 4;
  // The validity window. Empty selects the DPG default.
  vca.common.v1.ValidityWindow validity = 5;
  // The status entry to embed. Empty means the credential is not revocable.
  StatusListBinding status = 6;
  // The holder proof JWT from an authorization code request, when present.
  string holder_key_proof = 7;
  // A full credential body to use as is, as a JSON string. When set, the
  // adapter ignores subject_data. Only VCDM formats honour this field.
  string credential_data = 8;
}

// CreateOfferRequest asks for an OID4VCI credential offer.
message CreateOfferRequest {
  // What to issue.
  IssueSpec spec = 1;
  // The OID4VCI flow. Only the two OID4VCI channels are valid here.
  Channel channel = 2;
  // Ask the holder to present a credential before the DPG issues. The
  // caller sets it only for an adapter that lists
  // FEATURE_PRESENTATION_DURING_ISSUANCE. The offer then uses the
  // authorization code flow of a server with an interactive
  // authorization endpoint. The DPG names the credential it asks for.
  bool require_presentation = 3;
}

// CreateOfferResponse describes the credential offer.
message CreateOfferResponse {
  // The openid-credential-offer URI.
  string offer_uri = 1;
  // The adapter assigned id of the offer.
  string offer_id = 2;
  // The flow the adapter used. It can differ from the request.
  Channel channel = 3;
  // The time at which the offer stops working.
  google.protobuf.Timestamp expires_at = 4;
  // The transaction code the citizen types in the wallet. Empty when not needed.
  string pin = 5;
}

// IssueRequest asks for one signed credential.
message IssueRequest {
  // What to issue.
  IssueSpec spec = 1;
}

// IssueResponse carries the signed credential.
message IssueResponse {
  // The credential as the DPG produced it.
  vca.common.v1.Credential credential = 1;
  // The DPG assigned id of the credential, when the DPG has one.
  string credential_id = 2;
  // The identity QR text the DPG signed beside the credential, per the
  // MOSIP QR code specification 1.1.0: claim 169 in a CWT, then zlib,
  // then base45. Empty when the DPG signed none. An adapter fills it
  // when it lists CHANNEL_CLAIM169_QR.
  string claim169_qr = 3;
}

// IssueBatchRequest asks for many credentials in one call.
message IssueBatchRequest {
  // One spec per credential. The order of items is stable.
  repeated IssueSpec specs = 1;
}

// IssueBatchResponse returns one item per input spec, in the same order.
message IssueBatchResponse {
  // The per item results.
  repeated Item items = 1;

  // Item is the result of one spec.
  message Item {
    // The zero based position of the spec in the request.
    int32 position = 1;
    // The credential, when issuance succeeded.
    vca.common.v1.Credential credential = 2;
    // The error, when issuance failed.
    vca.common.v1.Error error = 3;
  }
}

// RevokeRequest sets the status of one credential.
message RevokeRequest {
  // The status entry of the credential.
  StatusListBinding status = 1;
  // The reason for the audit log. Never a secret.
  string reason = 2;
  // The change. ACTION_UNSPECIFIED revokes, as before the field existed.
  Action action = 3;
  // The id of the credential in the ledger of the DPG, when the DPG
  // keeps one. An adapter that lists FEATURE_ISSUED_LEDGER needs it.
  string credential_id = 4;

  // Action names the status change.
  enum Action {
    ACTION_UNSPECIFIED = 0;
    // Revoke the credential. This is final.
    ACTION_REVOKE = 1;
    // Suspend the credential. The adapter serves it when it lists
    // FEATURE_SUSPENSION.
    ACTION_SUSPEND = 2;
    // End a suspension. The adapter serves it when it lists
    // FEATURE_SUSPENSION.
    ACTION_REINSTATE = 3;
  }
}

// RevokeResponse confirms the change.
message RevokeResponse {
  // The time the DPG applied the change.
  google.protobuf.Timestamp revoked_at = 1;
}

// GetIssuanceStatusRequest selects one offer or deferred issuance.
message GetIssuanceStatusRequest {
  // The adapter assigned offer id from CreateOffer.
  string offer_id = 1;
  // The OID4VCI transaction id of a deferred issuance. Empty for an offer.
  string transaction_id = 2;
}

// GetIssuanceStatusResponse returns the state of the issuance.
message GetIssuanceStatusResponse {
  // The state.
  State state = 1;
  // The credential for the state STATE_ISSUED, when the DPG returns it.
  vca.common.v1.Credential credential = 2;
  // The time the wallet claimed the offer. Empty when not claimed.
  google.protobuf.Timestamp claimed_at = 3;
  // The time at which the offer stops working.
  google.protobuf.Timestamp expires_at = 4;
  // The error text from the DPG for the state STATE_FAILED.
  string error = 5;

  // State names where an issuance is in its life cycle.
  enum State {
    STATE_UNSPECIFIED = 0;
    // The offer exists and no wallet has claimed it.
    STATE_PENDING = 1;
    // The wallet claimed the offer and the DPG issued the credential.
    STATE_ISSUED = 2;
    // The DPG deferred the issuance and the wallet must poll.
    STATE_DEFERRED = 3;
    // The offer expired before a wallet claimed it.
    STATE_EXPIRED = 4;
    // The DPG could not issue the credential.
    STATE_FAILED = 5;
  }
}

// ListIssuedCredentialsRequest selects entries of the DPG ledger.
message ListIssuedCredentialsRequest {
  // The credential type, as a configuration id or a type name.
  string credential_type = 1;
  // The indexed attributes to match, by name. Some DPGs need at least
  // one.
  map<string, string> attributes = 2;
  // The id of one credential. Empty matches every credential.
  string credential_id = 3;
  // The page to return.
  vca.common.v1.Pagination page = 4;
}

// ListIssuedCredentialsResponse returns one page of ledger entries.
message ListIssuedCredentialsResponse {
  // The entries, oldest issuance first.
  repeated LedgerEntry credentials = 1;
  // The paging state.
  vca.common.v1.PageResult page = 2;
}

// LedgerEntry is one issued credential as the DPG ledger holds it. It
// carries no claim value.
message LedgerEntry {
  // The id of the credential in the ledger.
  string credential_id = 1;
  // The credential type as the ledger stores it.
  string credential_type = 2;
  // The issuance time.
  google.protobuf.Timestamp issued_at = 3;
  // The end of the validity window. Empty when the credential has none.
  google.protobuf.Timestamp expires_at = 4;
  // The status list entry the DPG holds for the credential.
  StatusListBinding status = 5;
  // The purpose of the status entry, such as revocation.
  string status_purpose = 6;
  // The time of the last status change the ledger knows.
  google.protobuf.Timestamp status_changed_at = 7;
}

// GetIssuerMetadataRequest has no fields.
message GetIssuerMetadataRequest {}

// GetIssuerMetadataResponse carries the issuer metadata.
message GetIssuerMetadataResponse {
  // The issuer identifier URL.
  string issuer = 1;
  // The issuer DID.
  string issuer_did = 2;
  // The full metadata document as the DPG serves it, as a JSON string.
  string metadata_json = 3;
  // The credential configurations the DPG offers.
  repeated CredentialConfiguration configurations = 4;
}

// IssuerIdentity is the identity a DPG signs credentials with
// (ADR-046). It never carries a private key.
message IssuerIdentity {
  // The identifiers of the issuer: each DID, then the subject of the
  // X.509 leaf certificate as a distinguished name.
  repeated string identifiers = 1;
  // The DID document of the first DID, as JSON. Empty when the identity
  // has no DID or the adapter cannot build the document.
  string did_document = 2;
  // The X.509 chain, leaf first. Each entry is one certificate as
  // base64 DER, as the x5c header of RFC 7515 carries it.
  repeated string x5c = 3;
  // The issuer metadata of the identity.
  Metadata metadata = 4;
  // The signing key. The DPG keeps it.
  Key key = 5;

  // Metadata names the organisation behind the identity.
  message Metadata {
    // The name of the organisation as a page shows it.
    string display_name = 1;
    // The legal identifier of the organisation, such as a registration
    // number or an LEI.
    string legal_identifier = 2;
  }

  // Key describes the signing key without its private part.
  message Key {
    // The key type, such as Ed25519 or secp256r1.
    string type = 1;
    // The key store of the DPG that keeps the key, such as jwk.
    string backend = 2;
  }
}

// GetIssuerIdentityRequest has no fields.
message GetIssuerIdentityRequest {}

// GetIssuerIdentityResponse returns the identity of the DPG.
message GetIssuerIdentityResponse {
  // The identity. Unset when the DPG has none yet.
  IssuerIdentity identity = 1;
}

// ProvisionIssuerIdentityRequest names the identifier and the key the
// DPG makes.
message ProvisionIssuerIdentityRequest {
  // The DID method, as one of the did_methods that GetCapabilities
  // lists, such as did:web.
  string method = 1;
  // The key type, as one of the key_types that GetCapabilities lists.
  string key_type = 2;
  // The key store of the DPG. Empty selects the default of the adapter.
  string key_backend = 3;
  // The host of a did:web, with its port. The adapter needs it for
  // did:web only.
  string domain = 4;
  // The name of the organisation.
  string display_name = 5;
  // The legal identifier of the organisation.
  string legal_identifier = 6;
}

// ProvisionIssuerIdentityResponse returns the new identity.
message ProvisionIssuerIdentityResponse {
  // The identity the DPG signs with from now on.
  IssuerIdentity identity = 1;
}

// ImportIssuerIdentityRequest binds an identifier that exists to a key in
// the key store of the DPG.
message ImportIssuerIdentityRequest {
  // The caller sets exactly one of did or x509_chain_pem.
  oneof subject {
    // A DID the issuer controls, such as did:web:issuer.example.
    string did = 1;
    // The X.509 chain in PEM, leaf first.
    string x509_chain_pem = 2;
  }
  // The reference of the signing key in the key store of the DPG, in the
  // form the DPG reads. The DPG keeps the key; VCA stores no private key.
  string key_reference = 3;
  // The name of the organisation.
  string display_name = 4;
  // The legal identifier of the organisation.
  string legal_identifier = 5;
}

// ImportIssuerIdentityResponse returns the imported identity.
message ImportIssuerIdentityResponse {
  // The identity the DPG signs with from now on.
  IssuerIdentity identity = 1;
}

// RegisterRequest creates a wallet for one citizen.
message RegisterRequest {
  // The pairwise subject of the citizen, formed as iss|sub (ADR-020).
  string pairwise_subject = 1;
  // The public key of the holder as a JWK string, when the browser holds the key.
  string holder_public_jwk = 2;
  // The ID token of the holder login at the identity provider. A DPG
  // wallet opens its own session with it (ADR-020 decision 3). The
  // wallet authentication service sends it on every login.
  string id_token = 3;
}

// RegisterResponse returns the wallet id.
message RegisterResponse {
  // The DPG assigned wallet id.
  string wallet_id = 1;
  // The holder DID the DPG created, when it created one.
  string holder_did = 2;
}

// WalletCredential is one credential in a wallet.
message WalletCredential {
  // The DPG assigned id.
  string id = 1;
  // The credential bytes.
  vca.common.v1.Credential credential = 2;
  // The credential type name for display.
  string type = 3;
  // The issuer DID or URL.
  string issuer = 4;
  // The time the wallet received the credential.
  google.protobuf.Timestamp received_at = 5;
}

// ListCredentialsRequest selects a wallet.
message ListCredentialsRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The page to return.
  vca.common.v1.Pagination page = 2;
}

// ListCredentialsResponse returns the credentials of the wallet.
message ListCredentialsResponse {
  // The credentials in the page.
  repeated WalletCredential credentials = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// AcceptOfferRequest claims an offer.
message AcceptOfferRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The openid-credential-offer URI.
  string offer_uri = 2;
  // The transaction code, when the offer needs one.
  string pin = 3;
  // The IdP access token to use as the authorization grant, when present.
  string authorization_grant = 4;
}

// AcceptOfferResponse returns the claimed credential.
message AcceptOfferResponse {
  // The credential now in the wallet.
  WalletCredential credential = 1;
}

// PresentRequest answers an OID4VP request.
message PresentRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The openid4vp request URI or request object.
  string request_uri = 2;
  // The ids of the credentials to present, in request order.
  repeated string credential_ids = 3;
  // The claim names to disclose. Empty discloses every requested claim.
  repeated string disclosed_claims = 4;
}

// PresentResponse reports the outcome of the presentation.
message PresentResponse {
  // True when the verifier accepted the presentation.
  bool accepted = 1;
  // The claim names the wallet disclosed.
  repeated string shared_claims = 2;
  // The verifier state or transaction id, when the verifier returned one.
  string verifier_state = 3;
  // The redirect URI the verifier returned, when present.
  string redirect_uri = 4;
}

// DeleteCredentialRequest removes one credential.
message DeleteCredentialRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The credential id from ListCredentials.
  string credential_id = 2;
}

// DeleteCredentialResponse has no fields.
message DeleteCredentialResponse {}

// WalletKey is one key of a wallet. It never carries a private key.
message WalletKey {
  // The DPG assigned key id.
  string id = 1;
  // The key type, such as Ed25519.
  string type = 2;
  // The key store of the DPG that keeps the key.
  string backend = 3;
  // The name of the key, when the wallet has one.
  string name = 4;
}

// ListKeysRequest selects a wallet.
message ListKeysRequest {
  // The wallet id from Register.
  string wallet_id = 1;
}

// ListKeysResponse returns the keys of the wallet.
message ListKeysResponse {
  // The keys.
  repeated WalletKey keys = 1;
}

// CreateKeyRequest makes one key.
message CreateKeyRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The key type, one of wallet_key_types.
  string key_type = 2;
}

// CreateKeyResponse returns the new key.
message CreateKeyResponse {
  // The key.
  WalletKey key = 1;
}

// WalletDid is one DID of a wallet.
message WalletDid {
  // The DID.
  string did = 1;
  // The name the holder gave the DID.
  string alias = 2;
  // The id of the key of the DID.
  string key_id = 3;
  // True for the DID the wallet binds new credentials to.
  bool default = 4;
  // The time the wallet made the DID.
  google.protobuf.Timestamp created_at = 5;
}

// ListDidsRequest selects a wallet.
message ListDidsRequest {
  // The wallet id from Register.
  string wallet_id = 1;
}

// ListDidsResponse returns the DIDs of the wallet.
message ListDidsResponse {
  // The DIDs.
  repeated WalletDid dids = 1;
}

// CreateDidRequest makes one DID.
message CreateDidRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The DID method, one of wallet_did_methods.
  string method = 2;
  // The id of an existing key. Empty makes a new key.
  string key_id = 3;
  // A name for the DID.
  string alias = 4;
}

// CreateDidResponse returns the new DID.
message CreateDidResponse {
  // The DID.
  WalletDid did = 1;
}

// SetDefaultDidRequest picks the default DID.
message SetDefaultDidRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // One DID of the wallet.
  string did = 2;
}

// SetDefaultDidResponse has no fields.
message SetDefaultDidResponse {}

// RejectOfferRequest declines one offer.
message RejectOfferRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The openid-credential-offer URI.
  string offer_uri = 2;
  // Why the holder declined, for the event log of the wallet.
  string reason = 3;
}

// RejectOfferResponse has no fields.
message RejectOfferResponse {}

// GetCredentialDocumentRequest selects one held credential.
message GetCredentialDocumentRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The credential id from ListCredentials.
  string credential_id = 2;
}

// GetCredentialDocumentResponse carries the document.
message GetCredentialDocumentResponse {
  // The document bytes.
  bytes content = 1;
  // The media type, such as application/pdf.
  string media_type = 2;
}

// WalletEvent is one entry of the event log of a wallet.
message WalletEvent {
  // The DPG assigned id.
  string id = 1;
  // The time of the event.
  google.protobuf.Timestamp at = 2;
  // The kind of event, such as Credential or Key.
  string event = 3;
  // What happened, such as Receive, Present, or Create.
  string action = 4;
  // The credential the event concerns, when there is one.
  string credential_id = 5;
  // The party on the other side, such as the issuer or the verifier.
  string counterpart = 6;
}

// ListEventsRequest selects a wallet and a page.
message ListEventsRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The page to return.
  vca.common.v1.Pagination page = 2;
}

// ListEventsResponse returns one page of the event log.
message ListEventsResponse {
  // The events, newest first.
  repeated WalletEvent events = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// CreateRequestRequest starts an OID4VP transaction.
message CreateRequestRequest {
  // The DCQL query as a JSON string (ADR-022 decision 3).
  string dcql = 1;
  // The Presentation Exchange definition as a JSON string. The caller
  // sets it only for a DPG that lists PROTOCOL_OID4VP_PEX.
  string presentation_definition = 2;
  // The nonce the wallet must bind to.
  string nonce = 3;
  // The URL the verifier calls back with the result, when present.
  string webhook_url = 4;
  // The DPG side check names to run, for example signature or expired.
  repeated string dpg_policies = 5;
  // Ask for a request object of the Digital Credentials API as well. The
  // caller sets it only for an adapter that lists FEATURE_DC_API_VERIFY.
  bool dc_api = 6;
  // The web origins that can pass the request to the Digital Credentials
  // API, such as https://verifier.example.
  repeated string expected_origins = 7;
}

// CreateRequestResponse describes the transaction.
message CreateRequestResponse {
  // The openid4vp request URI for the wallet.
  string request_uri = 1;
  // The server side state that GetResult takes.
  string state = 2;
  // The time at which the request stops working.
  google.protobuf.Timestamp expires_at = 3;
  // The request object for navigator.credentials.get, as a JSON string,
  // when the request asked for the Digital Credentials API.
  string dc_api_request = 4;
}

// SubmitBrowserAnswerRequest carries the answer of the browser.
message SubmitBrowserAnswerRequest {
  // The state from CreateRequest.
  string state = 1;
  // The credential the browser returned, with its protocol and data, as
  // a JSON string.
  string response = 2;
}

// SubmitBrowserAnswerResponse has no fields. GetResult reports the
// verdict.
message SubmitBrowserAnswerResponse {}

// GetResultRequest selects a transaction.
message GetResultRequest {
  // The state from CreateRequest.
  string state = 1;
}

// GetResultResponse returns the transaction state.
message GetResultResponse {
  // The transaction state.
  State state = 1;
  // The vp_token as the wallet sent it, one entry per credential.
  repeated vca.common.v1.Credential presented = 2;
  // The DPG verdict per check, as the DPG reported it.
  repeated DpgCheck dpg_checks = 3;
  // The time the wallet answered. Empty while pending.
  google.protobuf.Timestamp received_at = 4;

  // State names the transaction phase.
  enum State {
    STATE_UNSPECIFIED = 0;
    // No wallet has answered yet.
    STATE_PENDING = 1;
    // The wallet answered and the DPG accepted the response.
    STATE_ACCEPTED = 2;
    // The wallet answered and the DPG rejected the response.
    STATE_REJECTED = 3;
    // The request expired without an answer.
    STATE_EXPIRED = 4;
  }

  // DpgCheck is one check the DPG ran. VCA runs its own checks too
  // (ADR-024 decision 2).
  message DpgCheck {
    // The DPG name of the check.
    string name = 1;
    // True when the check passed.
    bool passed = 2;
    // The DPG reason text when the check failed.
    string reason = 3;
  }
}

// ListCredentialTypesRequest selects a page.
message ListCredentialTypesRequest {
  // The page to return.
  vca.common.v1.Pagination page = 1;
}

// ListCredentialTypesResponse returns the credential configurations.
message ListCredentialTypesResponse {
  // The configurations in the page.
  repeated CredentialConfiguration configurations = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// DpgTenant is one tenant of a DPG, for example one organisation of a
// platform that separates organisations (ADR-037).
message DpgTenant {
  // The DPG assigned id.
  string id = 1;
  // The name of the tenant in the DPG.
  string name = 2;
  // How the DPG runs the agent of the tenant.
  AgentType agent_type = 3;
  // The DIDs the tenant holds in the DPG.
  repeated string dids = 4;

  // AgentType names how the DPG runs the agent of a tenant.
  enum AgentType {
    AGENT_TYPE_UNSPECIFIED = 0;
    // The tenant shares one agent with other tenants.
    AGENT_TYPE_SHARED = 1;
    // The tenant has an agent of its own.
    AGENT_TYPE_DEDICATED = 2;
  }
}

// CreateTenantRequest names the new DPG tenant.
message CreateTenantRequest {
  // The name of the tenant. Required.
  string name = 1;
  // How the DPG runs the agent. Unspecified selects the DPG default.
  DpgTenant.AgentType agent_type = 2;
}

// CreateTenantResponse returns the new DPG tenant.
message CreateTenantResponse {
  // The tenant as the DPG stored it.
  DpgTenant tenant = 1;
}

// GetTenantRequest selects one DPG tenant.
message GetTenantRequest {
  // The DPG assigned id.
  string id = 1;
}

// GetTenantResponse returns the DPG tenant.
message GetTenantResponse {
  // The tenant.
  DpgTenant tenant = 1;
}

// ListTenantsRequest selects a page.
message ListTenantsRequest {
  // The page to return.
  vca.common.v1.Pagination page = 1;
}

// ListTenantsResponse returns a page of DPG tenants.
message ListTenantsResponse {
  // The tenants in the page.
  repeated DpgTenant tenants = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// DeleteTenantRequest selects one DPG tenant.
message DeleteTenantRequest {
  // The DPG assigned id.
  string id = 1;
}

// DeleteTenantResponse has no fields.
message DeleteTenantResponse {}

// ClientCredential is one machine credential of a DPG tenant, without
// its secret (ADR-038 decision 2).
message ClientCredential {
  // The DPG assigned id of the credential.
  string id = 1;
  // The OAuth client id a machine sends to the DPG.
  string client_id = 2;
  // The name of the credential.
  string name = 3;
  // The creation time.
  google.protobuf.Timestamp created_at = 4;
}

// ListClientCredentialsRequest selects one DPG tenant.
message ListClientCredentialsRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
}

// ListClientCredentialsResponse returns the credentials of the tenant.
message ListClientCredentialsResponse {
  // The credentials, without their secrets.
  repeated ClientCredential credentials = 1;
}

// CreateClientCredentialRequest names the new credential.
message CreateClientCredentialRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
  // The name of the credential.
  string name = 2;
}

// CreateClientCredentialResponse returns the credential and its secret.
message CreateClientCredentialResponse {
  // The credential.
  ClientCredential credential = 1;
  // The client secret. The DPG does not return it again.
  string client_secret = 2;
}

// DeleteClientCredentialRequest selects one credential of a tenant.
message DeleteClientCredentialRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
  // The DPG assigned id of the credential.
  string id = 2;
}

// DeleteClientCredentialResponse has no fields.
message DeleteClientCredentialResponse {}

// Webhook is the address a DPG calls on the events of one tenant.
message Webhook {
  // The https URL. Empty means the tenant has no webhook.
  string url = 1;
  // The time of the last change, when the DPG reports it.
  google.protobuf.Timestamp updated_at = 2;
}

// GetWebhookRequest selects one DPG tenant.
message GetWebhookRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
}

// GetWebhookResponse returns the webhook.
message GetWebhookResponse {
  // The webhook. An empty URL means none.
  Webhook webhook = 1;
}

// SetWebhookRequest sets the webhook of one DPG tenant.
message SetWebhookRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
  // The https URL. Empty clears the webhook.
  string url = 2;
}

// SetWebhookResponse returns the stored webhook.
message SetWebhookResponse {
  // The webhook as the DPG stored it.
  Webhook webhook = 1;
}

// VerifyCredentialRequest carries one input as the staff member gave it.
message VerifyCredentialRequest {
  // The bytes: a compact token, a JSON document, QR text, an image, or a PDF.
  bytes payload = 1;
  // The media type of the bytes, when the caller knows it.
  string media_type = 2;
}

// VerifyCredentialResponse returns the verdict of the DPG.
message VerifyCredentialResponse {
  // True when every check of the DPG passed.
  bool verified = 1;
  // The checks the DPG ran, as the DPG reported them. VCA runs its own
  // checks too (ADR-024 decision 2).
  repeated GetResultResponse.DpgCheck dpg_checks = 2;
}

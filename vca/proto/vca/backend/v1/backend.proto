// SPDX-License-Identifier: Apache-2.0
// DPG adapter contract. This file replaces the legacy 25 method Adapter
// interface with one small service per role (ADR-002 decision 2).
// A DPG adapter serves only the services its DPG supports. For each
// other service it returns the Connect code Unimplemented.
// The adapter never re-encodes a credential (ADR-003 decision 6).
syntax = "proto3";

package vca.backend.v1;

import "google/protobuf/timestamp.proto";
import "vca/common/v1/common.proto";

// CapabilityService tells a caller what the adapter can do.
// Every adapter serves this service.
service CapabilityService {
  // GetCapabilities returns the formats, channels, roles, and protocols
  // that this adapter supports. The UI offers only what is possible
  // (ADR-016 decision 6).
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

// IssuerBackendService drives the issuer side of a DPG.
service IssuerBackendService {
  // RegisterCredentialConfiguration makes a published schema known to the
  // DPG so the DPG can issue it (ADR-013 decision 3).
  rpc RegisterCredentialConfiguration(RegisterCredentialConfigurationRequest) returns (RegisterCredentialConfigurationResponse);
  // CreateOffer builds an OID4VCI credential offer for one subject.
  rpc CreateOffer(CreateOfferRequest) returns (CreateOfferResponse);
  // Issue produces one credential and returns it as opaque bytes.
  rpc Issue(IssueRequest) returns (IssueResponse);
  // IssueBatch produces many credentials in one call.
  rpc IssueBatch(IssueBatchRequest) returns (IssueBatchResponse);
  // GetIssuanceStatus returns the state of one offer or deferred issuance.
  rpc GetIssuanceStatus(GetIssuanceStatusRequest) returns (GetIssuanceStatusResponse);
  // Revoke sets the status bit of one credential through its status index.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  // ListIssuedCredentials searches the ledger of issued credentials that
  // the DPG keeps. An adapter serves it only when it lists
  // FEATURE_ISSUED_LEDGER.
  rpc ListIssuedCredentials(ListIssuedCredentialsRequest) returns (ListIssuedCredentialsResponse);
  // GetIssuerMetadata returns the OID4VCI issuer metadata of the DPG.
  rpc GetIssuerMetadata(GetIssuerMetadataRequest) returns (GetIssuerMetadataResponse);
  // GetIssuerIdentity returns the identifiers, the key, and the metadata
  // the DPG signs with. An empty answer means the DPG has no identity
  // yet (ADR-046 decision 1).
  rpc GetIssuerIdentity(GetIssuerIdentityRequest) returns (GetIssuerIdentityResponse);
  // ProvisionIssuerIdentity asks the DPG to make a key and an identifier
  // in one step. The DPG keeps the key (ADR-046 decision 2). An adapter
  // serves it only when it lists FEATURE_ISSUER_IDENTITY_PROVISION.
  rpc ProvisionIssuerIdentity(ProvisionIssuerIdentityRequest) returns (ProvisionIssuerIdentityResponse);
  // ImportIssuerIdentity binds an existing DID or X.509 chain to a key in
  // the key store of the DPG (ADR-046 decision 2). An adapter serves it
  // only when it lists FEATURE_ISSUER_IDENTITY_IMPORT_DID or
  // FEATURE_ISSUER_IDENTITY_IMPORT_X509.
  rpc ImportIssuerIdentity(ImportIssuerIdentityRequest) returns (ImportIssuerIdentityResponse);
  // SetPresentationRequirement names the credential a holder presents
  // before the DPG issues (ADR-051 decision 6). An adapter serves it only
  // when it lists FEATURE_PRESENTATION_DURING_ISSUANCE.
  rpc SetPresentationRequirement(SetPresentationRequirementRequest) returns (SetPresentationRequirementResponse);
  // GetPresentationRequirement returns the credential a holder presents
  // before the DPG issues, as the issuer set it. An adapter serves it
  // only when it lists FEATURE_PRESENTATION_DURING_ISSUANCE.
  rpc GetPresentationRequirement(GetPresentationRequirementRequest) returns (GetPresentationRequirementResponse);
  // GetHolderSignInSource returns the data source of a credential that a
  // holder claims after a sign in, with no offer. The source finds the
  // subject (ADR-052 decision 3). An adapter serves it only when it
  // lists FEATURE_HOLDER_SIGN_IN_SOURCE.
  rpc GetHolderSignInSource(GetHolderSignInSourceRequest) returns (GetHolderSignInSourceResponse);
  // SetHolderSignInSource stores that data source for the credential
  // configurations of one schema. An adapter serves it only when it
  // lists FEATURE_HOLDER_SIGN_IN_SOURCE.
  rpc SetHolderSignInSource(SetHolderSignInSourceRequest) returns (SetHolderSignInSourceResponse);
  // ListConnections returns the DIDComm connections of the issuer. An
  // offer of CHANNEL_DIDCOMM_OOB can go to a wallet that connected
  // before. An adapter serves it only when it lists
  // PROTOCOL_DIDCOMM_ISSUE_V2.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
}

// HolderBackendService drives the wallet side of a DPG.
service HolderBackendService {
  // Register creates the wallet account for one citizen.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // ListCredentials returns the credentials in one wallet.
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  // AcceptOffer claims a credential offer into the wallet.
  rpc AcceptOffer(AcceptOfferRequest) returns (AcceptOfferResponse);
  // Present answers an OID4VP request with credentials from the wallet.
  rpc Present(PresentRequest) returns (PresentResponse);
  // DeleteCredential removes one credential from the wallet.
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
  // ListKeys lists the keys of a wallet. An adapter serves it when it
  // lists FEATURE_WALLET_KEYS.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  // CreateKey makes a key in a wallet, of one of wallet_key_types.
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse);
  // ListDids lists the DIDs of a wallet. An adapter serves it when it
  // lists FEATURE_WALLET_DIDS.
  rpc ListDids(ListDidsRequest) returns (ListDidsResponse);
  // CreateDid makes a DID in a wallet, of one of wallet_did_methods.
  rpc CreateDid(CreateDidRequest) returns (CreateDidResponse);
  // SetDefaultDid picks the DID a wallet binds new credentials to.
  rpc SetDefaultDid(SetDefaultDidRequest) returns (SetDefaultDidResponse);
  // RejectOffer declines a credential offer in the wallet. An adapter
  // serves it when it lists FEATURE_WALLET_REJECT_OFFER.
  rpc RejectOffer(RejectOfferRequest) returns (RejectOfferResponse);
  // ListEvents lists the event log of a wallet, newest first. An adapter
  // serves it when it lists FEATURE_WALLET_EVENTS.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // GetCredentialDocument returns a printable document of one held
  // credential, such as a PDF. An adapter serves it when it lists
  // FEATURE_WALLET_DOCUMENT.
  rpc GetCredentialDocument(GetCredentialDocumentRequest) returns (GetCredentialDocumentResponse);
  // GetWalletLock reports whether the wallet needs the PIN of the
  // holder. An adapter serves it when it lists FEATURE_WALLET_PIN.
  rpc GetWalletLock(GetWalletLockRequest) returns (GetWalletLockResponse);
  // UnlockWallet opens the wallet with the PIN the holder enters. It
  // makes the wallet with that PIN when the holder has none. The adapter
  // never stores the PIN.
  rpc UnlockWallet(UnlockWalletRequest) returns (UnlockWalletResponse);
  // OpenInvitation opens a DIDComm invitation that carries no offer and
  // no proof request. The wallet keeps the connection (ADR-062). An
  // adapter serves it when it lists FEATURE_WALLET_DIDCOMM.
  rpc OpenInvitation(OpenInvitationRequest) returns (OpenInvitationResponse);
  // ListWalletConnections returns the DIDComm connections of a wallet,
  // newest first. An adapter serves it when it lists
  // FEATURE_WALLET_DIDCOMM.
  rpc ListWalletConnections(ListWalletConnectionsRequest) returns (ListWalletConnectionsResponse);
  // ListInbox returns the credential offers and the proof requests that
  // wait for the holder, newest first. Each came to the wallet over a
  // connection. An adapter serves it when it lists FEATURE_WALLET_DIDCOMM.
  rpc ListInbox(ListInboxRequest) returns (ListInboxResponse);
}

// VerifierBackendService drives the verifier side of a DPG.
service VerifierBackendService {
  // CreateRequest starts an OID4VP transaction and returns its request URI.
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
  // GetResult returns the state of one OID4VP transaction.
  rpc GetResult(GetResultRequest) returns (GetResultResponse);
  // SubmitBrowserAnswer hands the answer of the Digital Credentials API
  // of a browser to the verifier of the DPG. An adapter serves it when
  // it lists FEATURE_DC_API_VERIFY.
  rpc SubmitBrowserAnswer(SubmitBrowserAnswerRequest) returns (SubmitBrowserAnswerResponse);
  // VerifyCredential checks one credential, presentation, QR text,
  // image, or PDF with the verifier of the DPG. An adapter that lists
  // FEATURE_VERIFY_UPLOAD serves it. Every other adapter answers
  // Unimplemented.
  rpc VerifyCredential(VerifyCredentialRequest) returns (VerifyCredentialResponse);
  // ListProofRequests returns the DIDComm proof requests of the
  // verifier, newest first, with the state of each (ADR-061). An adapter
  // serves it only when it lists PROTOCOL_DIDCOMM_PRESENT_V2.
  rpc ListProofRequests(ListProofRequestsRequest) returns (ListProofRequestsResponse);
  // ListProofSchemas returns the AnonCreds schemas that a proof request
  // can name, with their attributes (ADR-061). An adapter serves it only
  // when it lists FEATURE_ANONCREDS_PROOF.
  rpc ListProofSchemas(ListProofSchemasRequest) returns (ListProofSchemasResponse);
  // ListVerifierConnections returns the DIDComm connections that a
  // proof request can go over. An adapter serves it only when it lists
  // PROTOCOL_DIDCOMM_PRESENT_V2.
  rpc ListVerifierConnections(ListVerifierConnectionsRequest) returns (ListVerifierConnectionsResponse);
}

// CatalogBackendService reads the credential types a DPG knows.
service CatalogBackendService {
  // ListCredentialTypes returns the credential configurations of the DPG.
  rpc ListCredentialTypes(ListCredentialTypesRequest) returns (ListCredentialTypesResponse);
}

// TenantBackendService manages the tenants of a DPG that separates
// tenants (ADR-037 decision 2). An adapter serves it only when its DPG
// has tenancy and the adapter lists FEATURE_MULTI_TENANCY. Every other
// adapter returns the Connect code Unimplemented for each RPC.
service TenantBackendService {
  // CreateTenant creates one tenant in the DPG.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  // GetTenant returns one tenant of the DPG with its DIDs.
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  // ListTenants returns the tenants of the DPG in pages.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // DeleteTenant removes one tenant from the DPG.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  // ListClientCredentials returns the client credentials of one tenant
  // without their secrets (ADR-038 decision 2). The adapter serves it
  // when it lists FEATURE_TENANT_CLIENT_CREDENTIALS.
  rpc ListClientCredentials(ListClientCredentialsRequest) returns (ListClientCredentialsResponse);
  // CreateClientCredential creates one client credential for a tenant.
  // The answer carries the secret once.
  rpc CreateClientCredential(CreateClientCredentialRequest) returns (CreateClientCredentialResponse);
  // DeleteClientCredential removes one client credential of a tenant.
  rpc DeleteClientCredential(DeleteClientCredentialRequest) returns (DeleteClientCredentialResponse);
  // GetEcosystemSettings reports whether the ecosystems of the DPG are
  // on (ADR-068). An adapter serves the ecosystem RPCs when it lists
  // FEATURE_ECOSYSTEMS.
  rpc GetEcosystemSettings(GetEcosystemSettingsRequest) returns (GetEcosystemSettingsResponse);
  // SetEcosystemSettings turns the ecosystems of the DPG on or off.
  rpc SetEcosystemSettings(SetEcosystemSettingsRequest) returns (SetEcosystemSettingsResponse);
  // ListEcosystems returns the ecosystems that one tenant leads or
  // belongs to.
  rpc ListEcosystems(ListEcosystemsRequest) returns (ListEcosystemsResponse);
  // CreateEcosystem creates one ecosystem that a tenant leads.
  rpc CreateEcosystem(CreateEcosystemRequest) returns (CreateEcosystemResponse);
  // ListEcosystemMembers returns the member tenants of one ecosystem,
  // without the lead.
  rpc ListEcosystemMembers(ListEcosystemMembersRequest) returns (ListEcosystemMembersResponse);
  // AddEcosystemMember adds one tenant to an ecosystem as a member.
  rpc AddEcosystemMember(AddEcosystemMemberRequest) returns (AddEcosystemMemberResponse);
  // RemoveEcosystemMember removes one member tenant from an ecosystem.
  rpc RemoveEcosystemMember(RemoveEcosystemMemberRequest) returns (RemoveEcosystemMemberResponse);
  // SetTenantPrimaryDid makes one DID of a tenant the DID it signs with.
  // The adapter serves it when it lists FEATURE_TENANT_PRIMARY_DID.
  rpc SetTenantPrimaryDid(SetTenantPrimaryDidRequest) returns (SetTenantPrimaryDidResponse);
  // ResolveDid resolves a DID that VCA cannot resolve itself, such as a
  // ledger DID, through the stack. The adapter serves it when it lists
  // FEATURE_DID_RESOLVE.
  rpc ResolveDid(ResolveDidRequest) returns (ResolveDidResponse);
}

// NotificationBackendService reads and sets the webhook that a DPG calls
// on events, per DPG tenant (ADR-040 decision 2). An adapter serves it
// only when it lists FEATURE_WEBHOOKS. Every other adapter returns the
// Connect code Unimplemented for each RPC.
service NotificationBackendService {
  // GetWebhook returns the webhook of one DPG tenant.
  rpc GetWebhook(GetWebhookRequest) returns (GetWebhookResponse);
  // SetWebhook sets or clears the webhook of one DPG tenant.
  rpc SetWebhook(SetWebhookRequest) returns (SetWebhookResponse);
  // GetNotificationEndpoint returns the holder notification address of
  // one tenant. The notification service of the DPG posts the push
  // notifications of the holders there. An adapter serves it when it lists
  // FEATURE_HOLDER_NOTIFICATIONS.
  rpc GetNotificationEndpoint(GetNotificationEndpointRequest) returns (GetNotificationEndpointResponse);
  // SetNotificationEndpoint registers that address for one tenant.
  rpc SetNotificationEndpoint(SetNotificationEndpointRequest) returns (SetNotificationEndpointResponse);
}

// BulkImportBackendService runs the CSV bulk import of a DPG: the
// template, the upload, the preview, the issue, the file history, and
// the retry of the failed rows (ADR-060). An adapter serves it only when
// it lists FEATURE_BULK_NATIVE and a bulk import on the channel
// CHANNEL_EMAIL. Every other adapter returns the Connect code
// Unimplemented for each RPC.
service BulkImportBackendService {
  // GetBulkTemplate returns the CSV file with the columns the DPG reads
  // for one credential configuration, and no row.
  rpc GetBulkTemplate(GetBulkTemplateRequest) returns (GetBulkTemplateResponse);
  // UploadBulkFile hands a filled CSV file to the DPG. The DPG checks it
  // against the schema and keeps it for the preview.
  rpc UploadBulkFile(UploadBulkFileRequest) returns (UploadBulkFileResponse);
  // PreviewBulkFile returns one page of the rows of an uploaded file.
  rpc PreviewBulkFile(PreviewBulkFileRequest) returns (PreviewBulkFileResponse);
  // IssueBulkFile starts the issue of every row of an uploaded file.
  rpc IssueBulkFile(IssueBulkFileRequest) returns (IssueBulkFileResponse);
  // ListBulkFiles returns one page of the files the DPG issued from,
  // newest first.
  rpc ListBulkFiles(ListBulkFilesRequest) returns (ListBulkFilesResponse);
  // ListBulkFileRows returns one page of the rows of one issued file.
  rpc ListBulkFileRows(ListBulkFileRowsRequest) returns (ListBulkFileRowsResponse);
  // RetryBulkFile issues the failed rows of one file again.
  rpc RetryBulkFile(RetryBulkFileRequest) returns (RetryBulkFileResponse);
}

// GetBulkTemplateRequest names the credential configuration of a
// template.
message GetBulkTemplateRequest {
  // The credential configuration id from RegisterCredentialConfiguration.
  string configuration_id = 1;
  // The format of the configuration.
  vca.common.v1.Format format = 2;
  // The claim names of the schema, in the order of the schema.
  repeated string claims = 3;
}

// GetBulkTemplateResponse carries the template.
message GetBulkTemplateResponse {
  // The file name the browser saves.
  string file_name = 1;
  // The CSV file.
  bytes content = 2;
  // The columns of the file, in order.
  repeated string columns = 3;
}

// UploadBulkFileRequest carries a filled CSV file.
message UploadBulkFileRequest {
  // The credential configuration id of the rows.
  string configuration_id = 1;
  // The format of the configuration.
  vca.common.v1.Format format = 2;
  // The name of the file.
  string file_name = 3;
  // The CSV file.
  bytes content = 4;
}

// UploadBulkFileResponse names the upload.
message UploadBulkFileResponse {
  // The id of the upload. The DPG keeps it for a limited time.
  string upload_id = 1;
}

// PreviewBulkFileRequest asks for one page of the rows of an upload.
message PreviewBulkFileRequest {
  // The id from UploadBulkFile.
  string upload_id = 1;
  // The page to read.
  vca.common.v1.Pagination page = 2;
}

// PreviewBulkFileResponse carries one page of the rows of an upload.
message PreviewBulkFileResponse {
  // The rows, in the order of the file.
  repeated BulkPreviewRow rows = 1;
  // The paging state.
  vca.common.v1.PageResult page = 2;
}

// BulkPreviewRow is one row of an upload.
message BulkPreviewRow {
  // The address of the holder.
  string email = 1;
  // The claims of the row, keyed by claim name.
  map<string, string> claims = 2;
}

// IssueBulkFileRequest starts the issue of an upload.
message IssueBulkFileRequest {
  // The id from UploadBulkFile.
  string upload_id = 1;
  // The credential configuration id of the rows.
  string configuration_id = 2;
  // The format of the configuration.
  vca.common.v1.Format format = 3;
}

// IssueBulkFileResponse carries the answer of the DPG.
message IssueBulkFileResponse {
  // The sentence of the DPG, for the audit log.
  string message = 1;
}

// ListBulkFilesRequest asks for one page of the issued files.
message ListBulkFilesRequest {
  // The page to read.
  vca.common.v1.Pagination page = 1;
}

// ListBulkFilesResponse carries one page of the issued files.
message ListBulkFilesResponse {
  // The files, newest first.
  repeated BulkFile files = 1;
  // The paging state.
  vca.common.v1.PageResult page = 2;
}

// BulkFile is one file the DPG issued from.
message BulkFile {
  // The id of the file in the DPG.
  string id = 1;
  // The name of the file.
  string name = 2;
  // The state of the issue.
  State state = 3;
  // The number of rows.
  int64 total_rows = 4;
  // The number of rows that failed or wait.
  int64 failed_rows = 5;
  // The name of the schema of the rows.
  string schema_name = 6;
  // When the issue began.
  google.protobuf.Timestamp created_at = 7;
  // The last change of the issue.
  google.protobuf.Timestamp updated_at = 8;

  // State is the state of the issue of a file.
  enum State {
    STATE_UNSPECIFIED = 0;
    // The DPG issues the rows.
    STATE_STARTED = 1;
    // Every row went out.
    STATE_COMPLETED = 2;
    // Some rows failed.
    STATE_PARTIAL = 3;
    // The issue stopped before the rows went out.
    STATE_INTERRUPTED = 4;
    // The DPG issues the failed rows again.
    STATE_RETRIED = 5;
  }
}

// ListBulkFileRowsRequest asks for one page of the rows of a file.
message ListBulkFileRowsRequest {
  // The id of the file.
  string file_id = 1;
  // The page to read.
  vca.common.v1.Pagination page = 2;
}

// ListBulkFileRowsResponse carries one page of the rows of a file.
message ListBulkFileRowsResponse {
  // The rows.
  repeated BulkFileRow rows = 1;
  // The paging state.
  vca.common.v1.PageResult page = 2;
}

// BulkFileRow is one row of an issued file.
message BulkFileRow {
  // The id of the row in the DPG.
  string id = 1;
  // The address of the holder.
  string email = 2;
  // True when the offer went out.
  bool issued = 3;
  // The reason of a failed row.
  string error = 4;
}

// RetryBulkFileRequest names the file to retry.
message RetryBulkFileRequest {
  // The id of the file.
  string file_id = 1;
}

// RetryBulkFileResponse carries the answer of the DPG.
message RetryBulkFileResponse {
  // The sentence of the DPG, for the audit log.
  string message = 1;
}

// Channel names a way to deliver a credential to a citizen (ADR-016).
enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  // OID4VCI pre-authorized code flow.
  CHANNEL_OID4VCI_PREAUTH = 1;
  // OID4VCI authorization code flow.
  CHANNEL_OID4VCI_AUTHCODE = 2;
  // A PDF document with a QR code.
  CHANNEL_PDF = 3;
  // An email that carries the offer.
  CHANNEL_EMAIL = 4;
  // An SMS that carries the offer.
  CHANNEL_SMS = 5;
  // A download link.
  CHANNEL_LINK = 6;
  // The browser Digital Credentials API.
  CHANNEL_DC_API = 7;
  // A DIDComm out of band invitation that carries the offer.
  CHANNEL_DIDCOMM_OOB = 8;
  // A QR code that carries the credential as CBOR under claim 169.
  CHANNEL_CLAIM169_QR = 9;
}

// Protocol names a standard exchange protocol an adapter speaks.
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  // OpenID for Verifiable Credential Issuance 1.0.
  PROTOCOL_OID4VCI = 1;
  // OpenID for Verifiable Presentations 1.0.
  PROTOCOL_OID4VP = 2;
  // OID4VP with DCQL queries and credential_sets.
  PROTOCOL_OID4VP_DCQL = 3;
  // OID4VP with Presentation Exchange (legacy wallets).
  PROTOCOL_OID4VP_PEX = 4;
  // OID4VCI batch credential issuance.
  PROTOCOL_OID4VCI_BATCH = 5;
  // OID4VCI deferred credential issuance.
  PROTOCOL_OID4VCI_DEFERRED = 6;
  // DIDComm issue credential protocol, version 2.
  PROTOCOL_DIDCOMM_ISSUE_V2 = 7;
  // DIDComm present proof protocol, version 2.
  PROTOCOL_DIDCOMM_PRESENT_V2 = 8;
  // Presentation through the browser Digital Credentials API.
  PROTOCOL_DC_API = 9;
}

// Feature names one thing an adapter does against its DPG beyond the
// role services. A page shows a feature on a stack only when the live
// adapter lists it (ADR-034 decision 5). An adapter lists a feature
// only when the RPC behind it works today.
enum Feature {
  FEATURE_UNSPECIFIED = 0;
  // The adapter creates the issuer DID and key in the DPG.
  FEATURE_ISSUER_IDENTITY_PROVISION = 1;
  // The adapter imports an existing DID and key into the DPG.
  FEATURE_ISSUER_IDENTITY_IMPORT_DID = 2;
  // The adapter imports an X.509 certificate chain into the DPG.
  FEATURE_ISSUER_IDENTITY_IMPORT_X509 = 3;
  // RegisterCredentialConfiguration makes a schema issuable on the DPG.
  FEATURE_CREDENTIAL_CONFIG_API = 4;
  // Revoke sets a credential to revoked through the DPG.
  FEATURE_REVOCATION = 5;
  // Revoke can suspend and reinstate a credential through the DPG.
  FEATURE_SUSPENSION = 6;
  // GetIssuanceStatus reports whether a wallet claimed an offer.
  FEATURE_ISSUANCE_STATUS = 7;
  // The DPG keeps a searchable ledger of issued credentials.
  FEATURE_ISSUED_LEDGER = 8;
  // IssueBatch issues many credentials in one DPG call.
  FEATURE_BULK_NATIVE = 9;
  // The DPG can ask the holder to present a credential before it issues.
  FEATURE_PRESENTATION_DURING_ISSUANCE = 10;
  // The DPG separates tenants.
  FEATURE_MULTI_TENANCY = 11;
  // The DPG issues client credentials per tenant.
  FEATURE_TENANT_CLIENT_CREDENTIALS = 12;
  // The DPG calls a webhook on events.
  FEATURE_WEBHOOKS = 13;
  // The DPG calls back on issuance and presentation session events.
  FEATURE_SESSION_CALLBACKS = 14;
  // The DPG groups tenants into ecosystems.
  FEATURE_ECOSYSTEMS = 15;
  // The wallet manages its keys.
  FEATURE_WALLET_KEYS = 16;
  // The wallet manages its DIDs.
  FEATURE_WALLET_DIDS = 17;
  // The wallet keeps an event log.
  FEATURE_WALLET_EVENTS = 18;
  // The wallet can decline a pending offer.
  FEATURE_WALLET_REJECT_OFFER = 19;
  // The verifier checks an uploaded credential, QR code, image, or PDF.
  FEATURE_VERIFY_UPLOAD = 20;
  // The verifier takes a presentation through the Digital Credentials API.
  FEATURE_DC_API_VERIFY = 21;
  // The verifier asks for AnonCreds proofs with predicates.
  FEATURE_ANONCREDS_PROOF = 22;
  // The wallet renders a held credential as a document, such as a PDF.
  FEATURE_WALLET_DOCUMENT = 23;
  // The wallet claims an offer in its own pages, not through
  // AcceptOffer. The wallet portal links the holder there, and it keeps
  // the browser store for a credential the holder pastes.
  FEATURE_WALLET_CLAIM_IN_STACK = 24;
  // The wallet of the stack keeps a PIN that the holder sets and enters.
  // The wallet portal asks the holder for it through GetWalletLock and
  // UnlockWallet. The adapter never stores the PIN.
  FEATURE_WALLET_PIN = 25;
  // A holder who signs in claims a credential with no offer. The DPG
  // finds the subject in the data source that the issuer names for the
  // credential through SetHolderSignInSource.
  FEATURE_HOLDER_SIGN_IN_SOURCE = 26;
  // The wallet speaks DIDComm (ADR-062). AcceptOffer takes an out of
  // band invitation that carries a credential offer. Present takes one
  // that carries a proof request. OpenInvitation, ListInbox, and
  // ListWalletConnections work.
  FEATURE_WALLET_DIDCOMM = 27;
  // The wallet binds new credentials to a default DID that the holder
  // picks with SetDefaultDid.
  FEATURE_WALLET_DEFAULT_DID = 28;
  // The wallet of the stack answers an OID4VP request with every claim
  // that the query of the verifier names. The holder cannot leave out a
  // claim, so the consent screen marks each claim as required. Present
  // refuses a request whose disclosed_claims leave out a claim.
  FEATURE_WALLET_WHOLE_QUERY = 29;
  // The notification service of the DPG posts a push notification for a
  // holder of a tenant to an address. The tenant registers the address,
  // for example the push service of a mobile wallet. GetNotificationEndpoint and
  // SetNotificationEndpoint work.
  FEATURE_HOLDER_NOTIFICATIONS = 30;
  // The DPG makes one DID of a tenant the DID the tenant signs with.
  // SetTenantPrimaryDid works.
  FEATURE_TENANT_PRIMARY_DID = 31;
  // The stack resolves a DID of a method that VCA does not resolve, such
  // as did:indy. ResolveDid works.
  FEATURE_DID_RESOLVE = 32;
  // The wallet of the DPG sends each credential whole and takes no
  // choice of claims. The consent screen lists the whole credential.
  // Present refuses a request whose disclosed_claims leave out the path
  // "*". That path stands for every claim of the credential (ADR-081).
  FEATURE_WALLET_WHOLE_CREDENTIAL = 33;
}

// GetCapabilitiesRequest has no fields.
message GetCapabilitiesRequest {}

// GetCapabilitiesResponse lists what the adapter supports.
message GetCapabilitiesResponse {
  // The name of the adapter, for example the service name.
  string adapter = 1;
  // The version of the DPG behind the adapter.
  string dpg_version = 2;
  // The credential formats the adapter can issue or check.
  repeated vca.common.v1.Format formats = 3;
  // The delivery channels the adapter supports.
  repeated Channel channels = 4;
  // The roles the adapter serves. The adapter returns Unimplemented for
  // the service of each role that is not in this list.
  repeated vca.common.v1.Role roles = 5;
  // The exchange protocols the adapter speaks.
  repeated Protocol protocols = 6;
  // The features the adapter implements against the DPG today.
  repeated Feature features = 7;
  // The DPG behind the adapter, with its components and links.
  DpgInfo dpg_info = 8;
  // The DID methods the adapter can provision or use, as method names
  // such as did:key.
  repeated string did_methods = 9;
  // The status list kinds the adapter can embed in a credential.
  repeated StatusListBinding.Kind status_mechanisms = 10;
  // The key types ProvisionIssuerIdentity accepts, such as Ed25519.
  repeated string key_types = 11;
  // The key types CreateKey accepts in a wallet.
  repeated string wallet_key_types = 12;
  // The DID methods CreateDid accepts in a wallet, such as did:key.
  repeated string wallet_did_methods = 13;
  // The agent types CreateTenant accepts. Empty when the adapter lists
  // no multi tenancy. AGENT_TYPE_UNSPECIFIED is always accepted and
  // lets the DPG pick.
  repeated DpgTenant.AgentType tenant_agent_types = 14;
  // The ledgers RegisterCredentialConfiguration writes an AnonCreds
  // schema and its credential definition on. Empty when the adapter
  // writes to no ledger.
  repeated Ledger ledgers = 15;
  // The formats RegisterCredentialConfiguration registers a schema in
  // beyond formats. Examples are an AnonCreds schema on one of the
  // ledgers and a W3C JSON-LD schema. The DPG keeps the schema. The
  // adapter issues in these formats only when formats lists them too.
  repeated vca.common.v1.Format schema_formats = 16;
  // The formats each channel carries, for a channel that carries only
  // some of formats. A channel that the list leaves out carries every
  // format of formats.
  repeated ChannelFormats channel_formats = 17;
  // The bulk import of the DPG, when the adapter lists
  // FEATURE_BULK_NATIVE. Empty means an import that returns each
  // credential, which VCA delivers as a document.
  BulkImport bulk_import = 18;
  // The DID methods that an operator makes in the DPG itself, with a
  // key the operator supplies there. The adapter holds no such key. The
  // admin pages list such a DID and make it the primary one when the
  // adapter lists FEATURE_TENANT_PRIMARY_DID.
  repeated string operator_did_methods = 19;
  // The key reference that an X.509 import takes, as a JSON example with
  // a placeholder in angle brackets. Empty means a reference into the key
  // store of the DPG.
  string x509_key_reference = 20;
  // The most client credentials that one tenant holds in the DPG. Zero
  // means no limit.
  int32 tenant_client_credential_limit = 21;
}

// BulkImport describes the bulk import of a DPG (ADR-060).
message BulkImport {
  // The channel that delivers each row. CHANNEL_PDF means IssueBatch
  // returns the credentials. CHANNEL_EMAIL means the DPG mails each
  // holder an offer, so each row needs the address of the holder.
  Channel channel = 1;
  // The formats the import issues. Empty means every format of formats.
  repeated vca.common.v1.Format formats = 2;
  // The column of the address of the holder in a CSV file of the DPG,
  // when channel is CHANNEL_EMAIL.
  string email_column = 3;
}

// ChannelFormats names the formats one delivery channel carries.
message ChannelFormats {
  // The channel.
  Channel channel = 1;
  // The formats the channel carries.
  repeated vca.common.v1.Format formats = 2;
}

// ListConnectionsRequest asks for one page of the DIDComm connections.
message ListConnectionsRequest {
  // The page to read.
  vca.common.v1.Pagination page = 1;
}

// ListConnectionsResponse carries one page of DIDComm connections.
message ListConnectionsResponse {
  // The connections, newest first.
  repeated DidcommConnection connections = 1;
  // The paging state.
  vca.common.v1.PageResult page = 2;
}

// DidcommConnection is one DIDComm connection between the issuer and a
// wallet.
message DidcommConnection {
  // The id of the connection in the DPG.
  string id = 1;
  // The label the wallet gave itself.
  string label = 2;
  // The state of the connection, such as completed.
  string state = 3;
  // When the connection began.
  google.protobuf.Timestamp created_at = 4;
}

// Ledger is one verifiable data registry a DPG writes schemas on.
message Ledger {
  // The namespace of the ledger, such as bcovrin:testnet.
  string namespace = 1;
  // The name of the ledger as the DPG shows it.
  string name = 2;
}

// DpgInfo names the DPG behind an adapter. The pages show it, so a
// vendor name never appears outside the adapters (ADR-001 decision 4).
message DpgInfo {
  // The name of the DPG as a page shows it.
  string display_name = 1;
  // The release of the DPG.
  string version = 2;
  // The components the stack runs for the roles this adapter serves.
  repeated Component components = 3;
  // The plugins the DPG runs, such as a data provider plugin. Empty when
  // the DPG has none or the adapter cannot name them.
  repeated string plugins = 4;
}

// Component is one deployed part of a DPG stack.
message Component {
  // The name of the component, as the stack file names it.
  string name = 1;
  // The pinned version or image tag.
  string version = 2;
  // The source repository.
  string repository_url = 3;
  // The documentation.
  string docs_url = 4;
  // The SPDX licence identifier.
  string license = 5;
  // The public address of the component, when it serves pages to
  // people, such as a wallet. Empty for a service with no pages.
  string url = 6;
}

// CredentialConfiguration is one entry of credential_configurations_supported
// in the OID4VCI issuer metadata.
message CredentialConfiguration {
  // The configuration id the wallet uses in the offer.
  string id = 1;
  // The wire format.
  vca.common.v1.Format format = 2;
  // The credential type. The VCDM type name or the SD-JWT VC vct.
  string type = 3;
  // The JSON Schema 2020-12 document of the credential, as a string.
  string json_schema = 4;
  // The OID4VCI display metadata, as a JSON string.
  string display = 5;
  // The claim names the issuer marks as selectively disclosable.
  repeated string sd_claims = 6;
  // The JSON-LD context extensions of an ldp_vc configuration, in order.
  // The adapter puts the base context of the data model first.
  repeated string contexts = 7;
  // The render templates the DPG puts in the credentials of this
  // configuration, such as an SVG card. Empty when the DPG has none.
  repeated RenderTemplate render_templates = 8;
  // The namespace of the ledger of an AnonCreds configuration, as one of
  // the ledgers that GetCapabilities lists. Empty for any other format.
  string ledger = 9;
}

// RenderTemplate is one render method of a credential, as the DPG hosts
// it.
message RenderTemplate {
  // The URL the credential names for the template.
  string url = 1;
  // The media type, such as image/svg+xml.
  string media_type = 2;
  // The template as the DPG serves it. The adapter caps its size.
  string content = 3;
  // The name of the render method, when the credential gives one.
  string name = 4;
}

// RegisterCredentialConfigurationRequest carries one configuration to register.
message RegisterCredentialConfigurationRequest {
  // The configuration to register. The adapter replaces an entry with the same id.
  CredentialConfiguration configuration = 1;
}

// RegisterCredentialConfigurationResponse confirms the registration.
message RegisterCredentialConfigurationResponse {
  // The configuration id as the DPG stores it.
  string id = 1;
}

// StatusListBinding points at the status entry of one credential.
message StatusListBinding {
  // The kind of status list.
  Kind kind = 1;
  // The id of the list in the status service.
  string list_id = 2;
  // The index of the credential in the list.
  int64 index = 3;
  // The public URL that a verifier fetches.
  string publish_url = 4;
  // True when a list of the DPG holds the entry, and no status service
  // of VCA does. The DPG adapter then changes the status through Revoke.
  // Revoke names the credential by its id in the ledger of the DPG.
  bool dpg_list = 5;

  // Kind names the status list standard.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // W3C Bitstring Status List (ADR-018).
    KIND_BITSTRING = 1;
    // IETF Token Status List (ADR-019).
    KIND_TOKEN = 2;
  }
}

// IssueSpec is the input that CreateOffer, Issue, and IssueBatch share.
message IssueSpec {
  // The credential configuration id from RegisterCredentialConfiguration.
  string configuration_id = 1;
  // The wire format to produce.
  vca.common.v1.Format format = 2;
  // The subject claims as a JSON object string.
  string subject_data = 3;
  // The subject reference and DID, when the flow knows them.
  vca.common.v1.Subject subject = 4;
  // The validity window. Empty selects the DPG default.
  vca.common.v1.ValidityWindow validity = 5;
  // The status entry to embed. Empty means the credential is not revocable.
  StatusListBinding status = 6;
  // The holder proof JWT from an authorization code request, when present.
  string holder_key_proof = 7;
  // A full credential body to use as is, as a JSON string. When set, the
  // adapter ignores subject_data. Only VCDM formats honour this field.
  string credential_data = 8;
  // The holder of an offer with a presentation during issuance: the
  // identity claim of the presented credential and its value. The DPG
  // issues subject_data to the holder who presents that value
  // (ADR-051 decision 5).
  PresentationSubject presentation_subject = 9;
  // Who can claim an authorization code offer. A claim of the ID token
  // of the holder sign in must equal a claim of subject_data (ADR-052
  // decision 3). Empty selects email for both when subject_data has an
  // email.
  BindingRule binding_rule = 10;
}

// BindingRule ties an authorization code offer to one person.
message BindingRule {
  // The claim of the ID token of the holder sign in, such as email.
  string token_claim = 1;
  // The claim of subject_data that must hold the same value.
  string subject_claim = 2;
}

// PresentationSubject names the holder of a presentation during issuance.
message PresentationSubject {
  // The claim of the presented credential that identifies the holder.
  string claim = 1;
  // The value of that claim for this holder.
  string value = 2;
}

// CreateOfferRequest asks for an OID4VCI credential offer.
message CreateOfferRequest {
  // What to issue.
  IssueSpec spec = 1;
  // The OID4VCI flow. Only the two OID4VCI channels are valid here.
  Channel channel = 2;
  // Ask the holder to present a credential before the DPG issues. The
  // caller sets it only for an adapter that lists
  // FEATURE_PRESENTATION_DURING_ISSUANCE. The offer then uses the
  // authorization code flow of a server with an interactive
  // authorization endpoint. The DPG names the credential it asks for.
  bool require_presentation = 3;
  // The address the DPG sends the offer to, for CHANNEL_EMAIL on an
  // adapter that lists that channel. The DPG sends the message itself.
  string email = 4;
  // The DIDComm connection of the holder, for CHANNEL_DIDCOMM_OOB. The
  // DPG then sends the offer over that connection. Empty makes an out of
  // band invitation that carries the offer.
  string connection_id = 5;
}

// CreateOfferResponse describes the credential offer.
message CreateOfferResponse {
  // The openid-credential-offer URI.
  string offer_uri = 1;
  // The adapter assigned id of the offer.
  string offer_id = 2;
  // The flow the adapter used. It can differ from the request.
  Channel channel = 3;
  // The time at which the offer stops working.
  google.protobuf.Timestamp expires_at = 4;
  // The transaction code the citizen types in the wallet. Empty when not needed.
  string pin = 5;
  // The status entry the credential carries. The adapter returns
  // spec.status when the DPG embeds that entry. It returns an entry with
  // dpg_list set when the DPG writes an entry of its own list. Empty
  // means the credential carries no status entry, so VCA cannot revoke
  // it.
  StatusListBinding status = 6;
  // The id of the credential in the ledger of the DPG. Revoke names it
  // for an entry of a list of the DPG. Empty when status names no such
  // entry.
  string credential_id = 7;
}

// IssueRequest asks for one signed credential.
message IssueRequest {
  // What to issue.
  IssueSpec spec = 1;
}

// IssueResponse carries the signed credential.
message IssueResponse {
  // The credential as the DPG produced it.
  vca.common.v1.Credential credential = 1;
  // The DPG assigned id of the credential, when the DPG has one.
  string credential_id = 2;
  // The identity QR text the DPG signed beside the credential, per the
  // MOSIP QR code specification 1.1.0: claim 169 in a CWT, then zlib,
  // then base45. Empty when the DPG signed none. An adapter fills it
  // when it lists CHANNEL_CLAIM169_QR.
  string claim169_qr = 3;
  // The status entry the credential carries, as in CreateOfferResponse
  // (ADR-076). The adapter returns spec.status when the DPG embeds that
  // entry. A DPG that writes an entry of its own list gets dpg_list set.
  // Revoke then names credential_id. Empty means the credential carries
  // no status entry, so VCA cannot revoke it.
  StatusListBinding status = 4;
}

// IssueBatchRequest asks for many credentials in one call.
message IssueBatchRequest {
  // One spec per credential. The order of items is stable.
  repeated IssueSpec specs = 1;
  // The address of the holder of each spec, in the order of specs. A DPG
  // whose bulk import mails each offer needs one per spec (ADR-060).
  repeated string emails = 2;
}

// IssueBatchResponse returns one item per input spec, in the same order.
message IssueBatchResponse {
  // The per item results.
  repeated Item items = 1;

  // Item is the result of one spec.
  message Item {
    // The zero based position of the spec in the request.
    int32 position = 1;
    // The credential, when issuance succeeded.
    vca.common.v1.Credential credential = 2;
    // The error, when issuance failed.
    vca.common.v1.Error error = 3;
    // True when the DPG took the row and delivers the offer itself, so
    // no credential comes back (ADR-060).
    bool delivered = 4;
    // The status entry the credential carries, as in IssueResponse
    // (ADR-076). The adapter returns spec.status when the DPG embeds that
    // entry. A DPG that writes an entry of its own list gets dpg_list
    // set. Empty means the credential carries no status entry.
    StatusListBinding status = 5;
    // The DPG assigned id of the credential, when the DPG has one.
    // Revoke names it for an entry with dpg_list set.
    string credential_id = 6;
  }
}

// RevokeRequest sets the status of one credential.
message RevokeRequest {
  // The status entry of the credential.
  StatusListBinding status = 1;
  // The reason for the audit log. Never a secret.
  string reason = 2;
  // The change. ACTION_UNSPECIFIED revokes, as before the field existed.
  Action action = 3;
  // The id of the credential in the ledger of the DPG, when the DPG
  // keeps one. An adapter that lists FEATURE_ISSUED_LEDGER needs it.
  string credential_id = 4;

  // Action names the status change.
  enum Action {
    ACTION_UNSPECIFIED = 0;
    // Revoke the credential. This is final.
    ACTION_REVOKE = 1;
    // Suspend the credential. The adapter serves it when it lists
    // FEATURE_SUSPENSION.
    ACTION_SUSPEND = 2;
    // End a suspension. The adapter serves it when it lists
    // FEATURE_SUSPENSION.
    ACTION_REINSTATE = 3;
  }
}

// RevokeResponse confirms the change.
message RevokeResponse {
  // The time the DPG applied the change.
  google.protobuf.Timestamp revoked_at = 1;
}

// GetIssuanceStatusRequest selects one offer or deferred issuance.
message GetIssuanceStatusRequest {
  // The adapter assigned offer id from CreateOffer.
  string offer_id = 1;
  // The OID4VCI transaction id of a deferred issuance. Empty for an offer.
  string transaction_id = 2;
}

// GetIssuanceStatusResponse returns the state of the issuance.
message GetIssuanceStatusResponse {
  // The state.
  State state = 1;
  // The credential for the state STATE_ISSUED, when the DPG returns it.
  vca.common.v1.Credential credential = 2;
  // The time the wallet claimed the offer. Empty when not claimed.
  google.protobuf.Timestamp claimed_at = 3;
  // The time at which the offer stops working.
  google.protobuf.Timestamp expires_at = 4;
  // The error text from the DPG for the state STATE_FAILED.
  string error = 5;

  // State names where an issuance is in its life cycle.
  enum State {
    STATE_UNSPECIFIED = 0;
    // The offer exists and no wallet has claimed it.
    STATE_PENDING = 1;
    // The wallet claimed the offer and the DPG issued the credential.
    STATE_ISSUED = 2;
    // The DPG deferred the issuance and the wallet must poll.
    STATE_DEFERRED = 3;
    // The offer expired before a wallet claimed it.
    STATE_EXPIRED = 4;
    // The DPG could not issue the credential.
    STATE_FAILED = 5;
  }
}

// ListIssuedCredentialsRequest selects entries of the DPG ledger.
message ListIssuedCredentialsRequest {
  // The credential type, as a configuration id or a type name.
  string credential_type = 1;
  // The indexed attributes to match, by name. Some DPGs need at least
  // one.
  map<string, string> attributes = 2;
  // The id of one credential. Empty matches every credential.
  string credential_id = 3;
  // The page to return.
  vca.common.v1.Pagination page = 4;
}

// ListIssuedCredentialsResponse returns one page of ledger entries.
message ListIssuedCredentialsResponse {
  // The entries, oldest issuance first.
  repeated LedgerEntry credentials = 1;
  // The paging state.
  vca.common.v1.PageResult page = 2;
}

// LedgerEntry is one issued credential as the DPG ledger holds it. It
// carries no claim value.
message LedgerEntry {
  // The id of the credential in the ledger.
  string credential_id = 1;
  // The credential type as the ledger stores it.
  string credential_type = 2;
  // The issuance time.
  google.protobuf.Timestamp issued_at = 3;
  // The end of the validity window. Empty when the credential has none.
  google.protobuf.Timestamp expires_at = 4;
  // The status list entry the DPG holds for the credential.
  StatusListBinding status = 5;
  // The purpose of the status entry, such as revocation.
  string status_purpose = 6;
  // The time of the last status change the ledger knows.
  google.protobuf.Timestamp status_changed_at = 7;
}

// GetIssuerMetadataRequest has no fields.
message GetIssuerMetadataRequest {}

// GetIssuerMetadataResponse carries the issuer metadata.
message GetIssuerMetadataResponse {
  // The issuer identifier URL.
  string issuer = 1;
  // The issuer DID.
  string issuer_did = 2;
  // The full metadata document as the DPG serves it, as a JSON string.
  string metadata_json = 3;
  // The credential configurations the DPG offers.
  repeated CredentialConfiguration configurations = 4;
}

// IssuerIdentity is the identity a DPG signs credentials with
// (ADR-046). It never carries a private key.
message IssuerIdentity {
  // The identifiers of the issuer: each DID, then the subject of the
  // X.509 leaf certificate as a distinguished name.
  repeated string identifiers = 1;
  // The DID document of the first DID, as JSON. Empty when the identity
  // has no DID or the adapter cannot build the document.
  string did_document = 2;
  // The X.509 chain, leaf first. Each entry is one certificate as
  // base64 DER, as the x5c header of RFC 7515 carries it.
  repeated string x5c = 3;
  // The issuer metadata of the identity.
  Metadata metadata = 4;
  // The signing key. The DPG keeps it.
  Key key = 5;

  // Metadata names the organisation behind the identity.
  message Metadata {
    // The name of the organisation as a page shows it.
    string display_name = 1;
    // The legal identifier of the organisation, such as a registration
    // number or an LEI.
    string legal_identifier = 2;
  }

  // Key describes the signing key without its private part.
  message Key {
    // The key type, such as Ed25519 or secp256r1.
    string type = 1;
    // The key store of the DPG that keeps the key, such as jwk.
    string backend = 2;
  }
}

// GetIssuerIdentityRequest has no fields.
message GetIssuerIdentityRequest {}

// GetIssuerIdentityResponse returns the identity of the DPG.
message GetIssuerIdentityResponse {
  // The identity. Unset when the DPG has none yet.
  IssuerIdentity identity = 1;
}

// ProvisionIssuerIdentityRequest names the identifier and the key the
// DPG makes.
message ProvisionIssuerIdentityRequest {
  // The DID method, as one of the did_methods that GetCapabilities
  // lists, such as did:web.
  string method = 1;
  // The key type, as one of the key_types that GetCapabilities lists.
  string key_type = 2;
  // The key store of the DPG. Empty selects the default of the adapter.
  string key_backend = 3;
  // The host of a did:web, with its port. The adapter needs it for
  // did:web only.
  string domain = 4;
  // The name of the organisation.
  string display_name = 5;
  // The legal identifier of the organisation.
  string legal_identifier = 6;
}

// ProvisionIssuerIdentityResponse returns the new identity.
message ProvisionIssuerIdentityResponse {
  // The identity the DPG signs with from now on.
  IssuerIdentity identity = 1;
}

// ImportIssuerIdentityRequest binds an identifier that exists to a key in
// the key store of the DPG.
message ImportIssuerIdentityRequest {
  // The caller sets exactly one of did or x509_chain_pem.
  oneof subject {
    // A DID the issuer controls, such as did:web:issuer.example.
    string did = 1;
    // The X.509 chain in PEM, leaf first.
    string x509_chain_pem = 2;
  }
  // The reference of the signing key in the key store of the DPG, in the
  // form the DPG reads. The DPG keeps the key; VCA stores no private key.
  string key_reference = 3;
  // The name of the organisation.
  string display_name = 4;
  // The legal identifier of the organisation.
  string legal_identifier = 5;
}

// ImportIssuerIdentityResponse returns the imported identity.
message ImportIssuerIdentityResponse {
  // The identity the DPG signs with from now on.
  IssuerIdentity identity = 1;
}

// SetPresentationRequirementRequest names the credential to present.
message SetPresentationRequirementRequest {
  // The type of the credential to present: a type name for a W3C
  // credential or the vct of an SD-JWT VC.
  string credential_type = 1;
  // The wire format of the credential to present.
  vca.common.v1.Format format = 2;
  // The claims the presented credential must carry. The identity claim
  // of the offers belongs here.
  repeated string required_claims = 3;
  // Why the issuer asks. The wallet shows it to the holder.
  string purpose = 4;
  // Remove the stored credential to present. The other fields are then ignored.
  bool clear = 5;
}

// SetPresentationRequirementResponse carries the stored definition.
message SetPresentationRequirementResponse {
  // The presentation definition the DPG reads, as a JSON string. Empty
  // after a clear.
  string definition_json = 1;
  // The claims of a presented credential that can identify a holder.
  // An offer names one of them in presentation_subject.
  repeated string identity_claims = 2;
}

// GetPresentationRequirementRequest has no fields.
message GetPresentationRequirementRequest {}

// GetPresentationRequirementResponse carries the stored request.
message GetPresentationRequirementResponse {
  // The stored request. Absent when the issuer set none.
  SetPresentationRequirementRequest requirement = 1;
  // The presentation definition the DPG reads, as a JSON string. Empty
  // when the issuer set none.
  string definition_json = 2;
  // The claims of a presented credential that can identify a holder.
  repeated string identity_claims = 3;
}

// HolderSignInSource names the data source row of the holder who signs
// in: the row whose field holds the value of one claim of the ID token.
message HolderSignInSource {
  // The id of the VCA data source.
  string source_id = 1;
  // The source field that identifies the person.
  string field = 2;
  // The claim of the ID token whose value the field must hold. Only a
  // claim that the holder provider vouches for matches (ADR-056
  // decision 2).
  string token_claim = 3;
  // The schema whose field map turns the row into claims.
  string schema_id = 4;
  // The version of that schema.
  int32 schema_version = 5;
}

// GetHolderSignInSourceRequest names the credential configurations of
// one schema.
message GetHolderSignInSourceRequest {
  // The credential configuration ids of the schema, one per format.
  repeated string configuration_ids = 1;
}

// GetHolderSignInSourceResponse carries the source and the claims the
// issuer can pick.
message GetHolderSignInSourceResponse {
  // The stored source of the first configuration that has one. Absent
  // when none has one.
  HolderSignInSource source = 1;
  // The ID token claims that the holder provider vouches for. The
  // source can name only one of them.
  repeated string vouched_claims = 2;
}

// SetHolderSignInSourceRequest stores or removes the source of the
// credential configurations of one schema.
message SetHolderSignInSourceRequest {
  // The credential configuration ids of the schema, one per format.
  repeated string configuration_ids = 1;
  // The source to store. Ignored when clear is true.
  HolderSignInSource source = 2;
  // Remove the source, so a holder claims only from an offer.
  bool clear = 3;
}

// SetHolderSignInSourceResponse carries the stored source.
message SetHolderSignInSourceResponse {
  // The source as stored. Absent after a clear.
  HolderSignInSource source = 1;
}

// RegisterRequest creates a wallet for one citizen.
message RegisterRequest {
  // The pairwise subject of the citizen, formed as iss|sub (ADR-020).
  string pairwise_subject = 1;
  // The public key of the holder as a JWK string, when the browser holds the key.
  string holder_public_jwk = 2;
  // The ID token of the holder login at the identity provider. A DPG
  // wallet opens its own session with it (ADR-020 decision 3). The
  // wallet authentication service sends it on every login.
  string id_token = 3;
}

// RegisterResponse returns the wallet id.
message RegisterResponse {
  // The DPG assigned wallet id.
  string wallet_id = 1;
  // The holder DID the DPG created, when it created one.
  string holder_did = 2;
}

// WalletCredential is one credential in a wallet.
message WalletCredential {
  // The DPG assigned id.
  string id = 1;
  // The credential bytes.
  vca.common.v1.Credential credential = 2;
  // The credential type name for display.
  string type = 3;
  // The issuer DID or URL.
  string issuer = 4;
  // The time the wallet received the credential.
  google.protobuf.Timestamp received_at = 5;
  // True when the wallet of the DPG cannot remove the credential. The
  // wallet portal then offers no remove button for it.
  bool permanent = 6;
}

// ListCredentialsRequest selects a wallet.
message ListCredentialsRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The page to return.
  vca.common.v1.Pagination page = 2;
}

// ListCredentialsResponse returns the credentials of the wallet.
message ListCredentialsResponse {
  // The credentials in the page.
  repeated WalletCredential credentials = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// AcceptOfferRequest claims an offer.
message AcceptOfferRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The openid-credential-offer URI. An adapter that lists
  // FEATURE_WALLET_DIDCOMM also takes a DIDComm out of band invitation
  // that carries a credential offer.
  string offer_uri = 2;
  // The transaction code, when the offer needs one.
  string pin = 3;
  // The IdP access token to use as the authorization grant, when present.
  string authorization_grant = 4;
  // The id of an offer from ListInbox, in place of offer_uri.
  string inbox_id = 5;
}

// AcceptOfferResponse returns the claimed credential.
message AcceptOfferResponse {
  // The credential now in the wallet.
  WalletCredential credential = 1;
}

// PresentRequest answers an OID4VP request.
message PresentRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The OID4VP authorization request. The wallet portal always sends
  // one shape: openid4vp://authorize with client_id, when known, and
  // request_uri. Every adapter takes that shape. An adapter that lists
  // FEATURE_WALLET_DIDCOMM also takes a DIDComm out of band invitation
  // that carries a proof request.
  string request_uri = 2;
  // The ids of the credentials to present, in request order.
  repeated string credential_ids = 3;
  // The claim names the holder consented to on the consent screen. The
  // path "*" consents to every claim of a credential. The adapter refuses
  // with FailedPrecondition when its wallet would send a claim outside
  // them (ADR-081).
  repeated string disclosed_claims = 4;
  // The id of a proof request from ListInbox, in place of request_uri.
  string inbox_id = 5;
}

// PresentResponse reports the outcome of the presentation.
message PresentResponse {
  // True when the verifier accepted the presentation.
  bool accepted = 1;
  // The claim names the wallet disclosed, read from what the wallet
  // sends. The path "*" stands for a whole credential.
  repeated string shared_claims = 2;
  // The verifier state or transaction id, when the verifier returned one.
  string verifier_state = 3;
  // The redirect URI the verifier returned, when present.
  string redirect_uri = 4;
}

// DeleteCredentialRequest removes one credential.
message DeleteCredentialRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The credential id from ListCredentials.
  string credential_id = 2;
}

// DeleteCredentialResponse has no fields.
message DeleteCredentialResponse {}

// WalletKey is one key of a wallet. It never carries a private key.
message WalletKey {
  // The DPG assigned key id.
  string id = 1;
  // The key type, such as Ed25519.
  string type = 2;
  // The key store of the DPG that keeps the key.
  string backend = 3;
  // The name of the key, when the wallet has one.
  string name = 4;
}

// ListKeysRequest selects a wallet.
message ListKeysRequest {
  // The wallet id from Register.
  string wallet_id = 1;
}

// ListKeysResponse returns the keys of the wallet.
message ListKeysResponse {
  // The keys.
  repeated WalletKey keys = 1;
}

// CreateKeyRequest makes one key.
message CreateKeyRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The key type, one of wallet_key_types.
  string key_type = 2;
}

// CreateKeyResponse returns the new key.
message CreateKeyResponse {
  // The key.
  WalletKey key = 1;
}

// WalletDid is one DID of a wallet.
message WalletDid {
  // The DID.
  string did = 1;
  // The name the holder gave the DID.
  string alias = 2;
  // The id of the key of the DID.
  string key_id = 3;
  // True for the DID the wallet binds new credentials to.
  bool default = 4;
  // The time the wallet made the DID.
  google.protobuf.Timestamp created_at = 5;
}

// ListDidsRequest selects a wallet.
message ListDidsRequest {
  // The wallet id from Register.
  string wallet_id = 1;
}

// ListDidsResponse returns the DIDs of the wallet.
message ListDidsResponse {
  // The DIDs.
  repeated WalletDid dids = 1;
}

// CreateDidRequest makes one DID.
message CreateDidRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The DID method, one of wallet_did_methods.
  string method = 2;
  // The id of an existing key. Empty makes a new key.
  string key_id = 3;
  // A name for the DID.
  string alias = 4;
}

// CreateDidResponse returns the new DID.
message CreateDidResponse {
  // The DID.
  WalletDid did = 1;
}

// SetDefaultDidRequest picks the default DID.
message SetDefaultDidRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // One DID of the wallet.
  string did = 2;
}

// SetDefaultDidResponse has no fields.
message SetDefaultDidResponse {}

// RejectOfferRequest declines one offer.
message RejectOfferRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The openid-credential-offer URI.
  string offer_uri = 2;
  // Why the holder declined, for the event log of the wallet.
  string reason = 3;
}

// RejectOfferResponse has no fields.
message RejectOfferResponse {}

// GetCredentialDocumentRequest selects one held credential.
message GetCredentialDocumentRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The credential id from ListCredentials.
  string credential_id = 2;
}

// GetCredentialDocumentResponse carries the document.
message GetCredentialDocumentResponse {
  // The document bytes.
  bytes content = 1;
  // The media type, such as application/pdf.
  string media_type = 2;
}

// WalletLock is the state of the PIN of a wallet.
enum WalletLock {
  WALLET_LOCK_UNSPECIFIED = 0;
  // The wallet is open for this session.
  WALLET_LOCK_OPEN = 1;
  // The holder has no wallet yet and sets its PIN on first use.
  WALLET_LOCK_NEEDS_NEW_PIN = 2;
  // The wallet exists and needs the PIN of the holder for this session.
  WALLET_LOCK_NEEDS_PIN = 3;
  // Too many wrong PINs locked the wallet.
  WALLET_LOCK_LOCKED_OUT = 4;
}

// GetWalletLockRequest names the wallet.
message GetWalletLockRequest {
  // The wallet id of Register.
  string wallet_id = 1;
}

// GetWalletLockResponse gives the state of the PIN.
message GetWalletLockResponse {
  // The state of the PIN.
  WalletLock state = 1;
}

// UnlockWalletRequest carries the PIN the holder entered.
message UnlockWalletRequest {
  // The wallet id of Register.
  string wallet_id = 1;
  // The PIN, six digits for Mimoto. The adapter never stores it.
  string pin = 2;
}

// UnlockWalletResponse has no fields.
message UnlockWalletResponse {}

// OpenInvitationRequest names the invitation to open.
message OpenInvitationRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The out of band invitation or the connection invitation, as a URL.
  string invitation_uri = 2;
}

// OpenInvitationResponse names the connection the wallet made.
message OpenInvitationResponse {
  // The connection.
  DidcommConnection connection = 1;
}

// ListWalletConnectionsRequest names the wallet.
message ListWalletConnectionsRequest {
  // The wallet id from Register.
  string wallet_id = 1;
}

// ListWalletConnectionsResponse returns the connections of the wallet.
message ListWalletConnectionsResponse {
  // The connections, newest first. The label is the label of the other
  // party.
  repeated DidcommConnection connections = 1;
}

// ListInboxRequest names the wallet.
message ListInboxRequest {
  // The wallet id from Register.
  string wallet_id = 1;
}

// ListInboxResponse returns what waits for the holder.
message ListInboxResponse {
  // The offers and the proof requests, newest first.
  repeated InboxItem items = 1;
}

// InboxItem is one credential offer or proof request that waits for the
// holder.
message InboxItem {
  // The id that AcceptOffer or Present takes as inbox_id.
  string id = 1;
  // What the item is.
  Kind kind = 2;
  // The label of the connection it came over.
  string connection_label = 3;
  // When it came.
  google.protobuf.Timestamp received_at = 4;
  // The name of the credential or of the proof request.
  string name = 5;
  // The values an offer carries, as name and value.
  repeated OfferedValue offered = 6;
  // What a proof request asks for, as plain text: an attribute name, or
  // a predicate such as "acres >= 10".
  repeated string requested = 7;

  // Kind names the type of an item.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // A credential offer.
    KIND_OFFER = 1;
    // A proof request.
    KIND_PROOF_REQUEST = 2;
  }
}

// OfferedValue is one value of a credential offer.
message OfferedValue {
  // The attribute name.
  string name = 1;
  // The value.
  string value = 2;
}

// WalletEvent is one entry of the event log of a wallet.
message WalletEvent {
  // The DPG assigned id.
  string id = 1;
  // The time of the event.
  google.protobuf.Timestamp at = 2;
  // The kind of event, such as Credential or Key.
  string event = 3;
  // What happened, such as Receive, Present, or Create.
  string action = 4;
  // The credential the event concerns, when there is one.
  string credential_id = 5;
  // The party on the other side, such as the issuer or the verifier.
  string counterpart = 6;
}

// ListEventsRequest selects a wallet and a page.
message ListEventsRequest {
  // The wallet id from Register.
  string wallet_id = 1;
  // The page to return.
  vca.common.v1.Pagination page = 2;
}

// ListEventsResponse returns one page of the event log.
message ListEventsResponse {
  // The events, newest first.
  repeated WalletEvent events = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// CreateRequestRequest starts an OID4VP transaction.
message CreateRequestRequest {
  // The DCQL query as a JSON string (ADR-022 decision 3).
  string dcql = 1;
  // The Presentation Exchange definition as a JSON string. The caller
  // sets it only for a DPG that lists PROTOCOL_OID4VP_PEX.
  string presentation_definition = 2;
  // The nonce the wallet must bind to. A stack that picks its own nonce
  // ignores it. The adapter then returns the nonce of the stack.
  string nonce = 3;
  // The URL the verifier calls back with the result, when present.
  string webhook_url = 4;
  // The DPG side check names to run, for example signature or expired.
  repeated string dpg_policies = 5;
  // Ask for a request object of the Digital Credentials API as well. The
  // caller sets it only for an adapter that lists FEATURE_DC_API_VERIFY.
  bool dc_api = 6;
  // The web origins that can pass the request to the Digital Credentials
  // API, such as https://verifier.example.
  repeated string expected_origins = 7;
  // The AnonCreds proof request as a JSON string: the name, the version,
  // requested_attributes and requested_predicates of the AnonCreds
  // specification. The caller sets it only for an adapter that lists
  // FEATURE_ANONCREDS_PROOF. The adapter asks over DIDComm.
  string anoncreds_request = 8;
  // Ask with the DIDComm present proof protocol instead of OID4VP. The
  // caller sets it only for an adapter that lists
  // PROTOCOL_DIDCOMM_PRESENT_V2. With presentation_definition the
  // request asks for a DIF Presentation Exchange proof. An AnonCreds
  // request goes over DIDComm without it.
  bool didcomm = 9;
  // The DIDComm connection of the holder. The adapter then sends the
  // request over that connection, and request_uri stays empty. Empty
  // makes an out of band invitation that carries the request.
  string connection_id = 10;
  // The template accepts a credential of any issuer. Without it an
  // adapter refuses an AnonCreds part that binds no issuer. A part binds
  // its issuer with one restriction that names a credential definition
  // or an issuer DID (ADR-064).
  bool any_issuer = 11;
}

// CreateRequestResponse describes the transaction.
message CreateRequestResponse {
  // The openid4vp request URI for the wallet.
  string request_uri = 1;
  // The server side state that GetResult takes.
  string state = 2;
  // The time at which the request stops working.
  google.protobuf.Timestamp expires_at = 3;
  // The request object for navigator.credentials.get, as a JSON string,
  // when the request asked for the Digital Credentials API.
  string dc_api_request = 4;
  // The nonce the stack put in the request. An adapter sets it when the
  // stack ignores the nonce of the caller. The caller then checks the
  // answer against this nonce. Empty means the stack took the nonce of
  // the caller.
  string nonce = 5;
}

// SubmitBrowserAnswerRequest carries the answer of the browser.
message SubmitBrowserAnswerRequest {
  // The state from CreateRequest.
  string state = 1;
  // The credential the browser returned, with its protocol and data, as
  // a JSON string.
  string response = 2;
}

// SubmitBrowserAnswerResponse has no fields. GetResult reports the
// verdict.
message SubmitBrowserAnswerResponse {}

// GetResultRequest selects a transaction.
message GetResultRequest {
  // The state from CreateRequest.
  string state = 1;
}

// GetResultResponse returns the transaction state.
message GetResultResponse {
  // The transaction state.
  State state = 1;
  // The vp_token as the wallet sent it, one entry per credential.
  repeated vca.common.v1.Credential presented = 2;
  // The DPG verdict per check, as the DPG reported it.
  repeated DpgCheck dpg_checks = 3;
  // The time the wallet answered. Empty while pending.
  google.protobuf.Timestamp received_at = 4;
  // The nonce of the stack request that the wallet answered. The adapter
  // reads it from the session of the stack, never from the answer. One
  // request can hold sessions with their own nonces. Empty means the
  // nonce of CreateRequest applies.
  string nonce = 5;

  // State names the transaction phase.
  enum State {
    STATE_UNSPECIFIED = 0;
    // No wallet has answered yet.
    STATE_PENDING = 1;
    // The wallet answered and the DPG accepted the response.
    STATE_ACCEPTED = 2;
    // The wallet answered and the DPG rejected the response.
    STATE_REJECTED = 3;
    // The request expired without an answer.
    STATE_EXPIRED = 4;
  }

  // DpgCheck is one check the DPG ran. VCA runs its own checks too
  // (ADR-024 decision 2).
  message DpgCheck {
    // The DPG name of the check.
    string name = 1;
    // True when the check passed.
    bool passed = 2;
    // The DPG reason text when the check failed.
    string reason = 3;
  }
}

// ListCredentialTypesRequest selects a page.
message ListCredentialTypesRequest {
  // The page to return.
  vca.common.v1.Pagination page = 1;
}

// ListCredentialTypesResponse returns the credential configurations.
message ListCredentialTypesResponse {
  // The configurations in the page.
  repeated CredentialConfiguration configurations = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// DpgTenant is one tenant of a DPG, for example one organisation of a
// platform that separates organisations (ADR-037).
message DpgTenant {
  // The DPG assigned id.
  string id = 1;
  // The name of the tenant in the DPG.
  string name = 2;
  // How the DPG runs the agent of the tenant.
  AgentType agent_type = 3;
  // The DIDs the tenant holds in the DPG.
  repeated string dids = 4;
  // The DID the tenant signs with by default, one of dids. Empty when
  // the DPG marks no DID so.
  string primary_did = 5;
  // The members of the tenant in the DPG with their roles, read only.
  // Empty when the DPG keeps no members per tenant.
  repeated TenantMember members = 6;

  // AgentType names how the DPG runs the agent of a tenant.
  enum AgentType {
    AGENT_TYPE_UNSPECIFIED = 0;
    // The tenant shares one agent with other tenants.
    AGENT_TYPE_SHARED = 1;
    // The tenant has an agent of its own.
    AGENT_TYPE_DEDICATED = 2;
  }
}

// TenantMember is one person of a DPG tenant, as the DPG lists it.
message TenantMember {
  // The login name the DPG shows, such as an email address.
  string login = 1;
  // The roles of the person in the tenant, as the DPG names them.
  repeated string roles = 2;
}

// CreateTenantRequest names the new DPG tenant.
message CreateTenantRequest {
  // The name of the tenant. Required.
  string name = 1;
  // How the DPG runs the agent. Unspecified selects the DPG default.
  DpgTenant.AgentType agent_type = 2;
}

// CreateTenantResponse returns the new DPG tenant.
message CreateTenantResponse {
  // The tenant as the DPG stored it.
  DpgTenant tenant = 1;
}

// GetTenantRequest selects one DPG tenant.
message GetTenantRequest {
  // The DPG assigned id.
  string id = 1;
}

// GetTenantResponse returns the DPG tenant.
message GetTenantResponse {
  // The tenant.
  DpgTenant tenant = 1;
}

// ListTenantsRequest selects a page.
message ListTenantsRequest {
  // The page to return.
  vca.common.v1.Pagination page = 1;
}

// ListTenantsResponse returns a page of DPG tenants.
message ListTenantsResponse {
  // The tenants in the page.
  repeated DpgTenant tenants = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// DeleteTenantRequest selects one DPG tenant.
message DeleteTenantRequest {
  // The DPG assigned id.
  string id = 1;
}

// DeleteTenantResponse has no fields.
message DeleteTenantResponse {}

// ClientCredential is one machine credential of a DPG tenant, without
// its secret (ADR-038 decision 2).
message ClientCredential {
  // The DPG assigned id of the credential.
  string id = 1;
  // The OAuth client id a machine sends to the DPG.
  string client_id = 2;
  // The name of the credential.
  string name = 3;
  // The creation time.
  google.protobuf.Timestamp created_at = 4;
}

// ListClientCredentialsRequest selects one DPG tenant.
message ListClientCredentialsRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
}

// ListClientCredentialsResponse returns the credentials of the tenant.
message ListClientCredentialsResponse {
  // The credentials, without their secrets.
  repeated ClientCredential credentials = 1;
}

// CreateClientCredentialRequest names the new credential.
message CreateClientCredentialRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
  // The name of the credential.
  string name = 2;
}

// CreateClientCredentialResponse returns the credential and its secret.
message CreateClientCredentialResponse {
  // The credential.
  ClientCredential credential = 1;
  // The client secret. The DPG does not return it again.
  string client_secret = 2;
}

// DeleteClientCredentialRequest selects one credential of a tenant.
message DeleteClientCredentialRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
  // The DPG assigned id of the credential.
  string id = 2;
}

// DeleteClientCredentialResponse has no fields.
message DeleteClientCredentialResponse {}

// SetTenantPrimaryDidRequest names the tenant and the DID.
message SetTenantPrimaryDidRequest {
  // The DPG assigned id of the tenant. Required.
  string tenant_id = 1;
  // One DID of the tenant. Required.
  string did = 2;
}

// SetTenantPrimaryDidResponse returns the tenant with its new primary DID.
message SetTenantPrimaryDidResponse {
  // The tenant.
  DpgTenant tenant = 1;
}

// Ecosystem is a group of tenants that one lead tenant runs (ADR-068).
message Ecosystem {
  // The DPG assigned id of the ecosystem.
  string id = 1;
  // The name of the ecosystem. The DPG keeps each name once.
  string name = 2;
  // What the ecosystem is for.
  string description = 3;
  // The DPG assigned id of the lead tenant.
  string lead_tenant_id = 4;
  // The name of the lead tenant.
  string lead_tenant_name = 5;
  // The number of member tenants, without the lead.
  int32 member_count = 6;
}

// EcosystemMember is one member tenant of an ecosystem.
message EcosystemMember {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
  // The name of the tenant.
  string tenant_name = 2;
  // The state of the membership as the DPG names it, such as ACTIVE.
  string status = 3;
  // When the tenant joined.
  google.protobuf.Timestamp joined_at = 4;
}

// GetEcosystemSettingsRequest has no fields.
message GetEcosystemSettingsRequest {}

// GetEcosystemSettingsResponse reports the ecosystem settings.
message GetEcosystemSettingsResponse {
  // True when the ecosystems of the DPG are on.
  bool enabled = 1;
}

// SetEcosystemSettingsRequest turns the ecosystems on or off.
message SetEcosystemSettingsRequest {
  // True turns the ecosystems on.
  bool enabled = 1;
}

// SetEcosystemSettingsResponse returns the new settings.
message SetEcosystemSettingsResponse {
  // True when the ecosystems of the DPG are on.
  bool enabled = 1;
}

// ListEcosystemsRequest selects one tenant.
message ListEcosystemsRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
}

// ListEcosystemsResponse returns the ecosystems of the tenant.
message ListEcosystemsResponse {
  // The ecosystems that the tenant leads or belongs to.
  repeated Ecosystem ecosystems = 1;
}

// CreateEcosystemRequest names the new ecosystem and its lead.
message CreateEcosystemRequest {
  // The DPG assigned id of the lead tenant.
  string lead_tenant_id = 1;
  // The name of the ecosystem.
  string name = 2;
  // What the ecosystem is for.
  string description = 3;
}

// CreateEcosystemResponse returns the new ecosystem.
message CreateEcosystemResponse {
  // The ecosystem.
  Ecosystem ecosystem = 1;
}

// ListEcosystemMembersRequest selects one ecosystem.
message ListEcosystemMembersRequest {
  // The DPG assigned id of the ecosystem.
  string ecosystem_id = 1;
}

// ListEcosystemMembersResponse returns the members.
message ListEcosystemMembersResponse {
  // The member tenants, without the lead.
  repeated EcosystemMember members = 1;
}

// AddEcosystemMemberRequest names the ecosystem and the tenant.
message AddEcosystemMemberRequest {
  // The DPG assigned id of the ecosystem.
  string ecosystem_id = 1;
  // The DPG assigned id of the tenant.
  string tenant_id = 2;
}

// AddEcosystemMemberResponse says how the tenant joins.
message AddEcosystemMemberResponse {
  // True when the DPG mailed an invitation that the owner of the tenant
  // must accept. False when the tenant joined at once.
  bool invited = 1;
}

// RemoveEcosystemMemberRequest names the ecosystem and the tenant.
message RemoveEcosystemMemberRequest {
  // The DPG assigned id of the ecosystem.
  string ecosystem_id = 1;
  // The DPG assigned id of the tenant.
  string tenant_id = 2;
}

// RemoveEcosystemMemberResponse has no fields.
message RemoveEcosystemMemberResponse {}

// Webhook is the address a DPG calls on the events of one tenant.
message Webhook {
  // The https URL. Empty means the tenant has no webhook.
  string url = 1;
  // The time of the last change, when the DPG reports it.
  google.protobuf.Timestamp updated_at = 2;
  // True when the DPG signs each call with a secret of the tenant. The
  // secret never leaves the DPG.
  bool signed = 3;
  // True when the DPG keeps a webhook after the first set. A caller can
  // change the address but cannot clear it.
  bool fixed = 4;
}

// GetWebhookRequest selects one DPG tenant.
message GetWebhookRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
}

// GetWebhookResponse returns the webhook.
message GetWebhookResponse {
  // The webhook. An empty URL means none.
  Webhook webhook = 1;
}

// SetWebhookRequest sets the webhook of one DPG tenant.
message SetWebhookRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
  // The https URL. Empty clears the webhook.
  string url = 2;
  // The secret that the DPG signs each call with. Empty keeps the
  // secret the DPG holds. The adapter passes it on and keeps no copy.
  string signing_secret = 3;
}

// NotificationEndpoint is the holder notification address of one tenant.
// The notification service of a DPG posts the push notifications of the
// holders there.
message NotificationEndpoint {
  // The URL. Empty means the tenant registered none.
  string url = 1;
  // The time of the registration.
  google.protobuf.Timestamp updated_at = 2;
  // True when the DPG does not report the address, so the adapter
  // returns the one it registered last.
  bool kept_by_adapter = 3;
  // True when the DPG takes one address per tenant and no change.
  bool fixed = 4;
}

// GetNotificationEndpointRequest selects one DPG tenant.
message GetNotificationEndpointRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
}

// GetNotificationEndpointResponse returns the address.
message GetNotificationEndpointResponse {
  // The address. An empty URL means none.
  NotificationEndpoint endpoint = 1;
}

// SetNotificationEndpointRequest registers the address of one tenant.
message SetNotificationEndpointRequest {
  // The DPG assigned id of the tenant.
  string tenant_id = 1;
  // The https URL. Required.
  string url = 2;
}

// SetNotificationEndpointResponse returns the registered address.
message SetNotificationEndpointResponse {
  // The address as the DPG took it.
  NotificationEndpoint endpoint = 1;
}

// SetWebhookResponse returns the stored webhook.
message SetWebhookResponse {
  // The webhook as the DPG stored it.
  Webhook webhook = 1;
}

// ListVerifierConnectionsRequest asks for one page of the DIDComm
// connections of the verifier.
message ListVerifierConnectionsRequest {
  // The page to read.
  vca.common.v1.Pagination page = 1;
}

// ListVerifierConnectionsResponse carries one page of DIDComm
// connections.
message ListVerifierConnectionsResponse {
  // The connections, newest first.
  repeated DidcommConnection connections = 1;
  // The paging state.
  vca.common.v1.PageResult page = 2;
}

// ListProofRequestsRequest asks for one page of the DIDComm proof
// requests.
message ListProofRequestsRequest {
  // The page to read.
  vca.common.v1.Pagination page = 1;
}

// ListProofRequestsResponse carries one page of DIDComm proof requests.
message ListProofRequestsResponse {
  // The proof requests, newest first.
  repeated ProofRequest requests = 1;
  // The paging state.
  vca.common.v1.PageResult page = 2;
}

// ProofRequest is one DIDComm proof request of the verifier, as the DPG
// keeps it.
message ProofRequest {
  // The id of the proof exchange in the DPG.
  string id = 1;
  // The state GetResult takes for this request.
  string result_state = 2;
  // The DIDComm connection of the holder, when the exchange has one.
  string connection_id = 3;
  // The label the wallet of the holder gave itself, when known.
  string connection_label = 4;
  // The state of the exchange as the DPG names it, such as request-sent
  // or done.
  string state = 5;
  // When the request began.
  google.protobuf.Timestamp created_at = 6;
  // The reason of a failed exchange.
  string error = 7;
}

// ListProofSchemasRequest asks for one page of the AnonCreds schemas.
message ListProofSchemasRequest {
  // The page to read.
  vca.common.v1.Pagination page = 1;
}

// ListProofSchemasResponse carries one page of AnonCreds schemas.
message ListProofSchemasResponse {
  // The schemas.
  repeated ProofSchema schemas = 1;
  // The paging state.
  vca.common.v1.PageResult page = 2;
}

// ProofSchema is one AnonCreds schema that a proof request can name.
message ProofSchema {
  // The id of the schema on its ledger.
  string id = 1;
  // The name of the schema.
  string name = 2;
  // The version of the schema.
  string version = 3;
  // The attribute names of the schema, in the order of the schema.
  repeated string attributes = 4;
  // The DID that wrote the schema.
  string issuer_did = 5;
  // The organisation that wrote the schema, as the DPG names it.
  string organisation = 6;
  // The ids of the credential definitions of the schema that the DPG
  // knows.
  repeated string credential_definitions = 7;
  // The data type of each attribute, such as string or number, by
  // attribute name. A predicate compares a number only. An attribute
  // the map leaves out has an unknown type.
  map<string, string> attribute_types = 8;
}

// VerifyCredentialRequest carries one input as the staff member gave it.
message VerifyCredentialRequest {
  // The bytes: a compact token, a JSON document, QR text, an image, or a PDF.
  bytes payload = 1;
  // The media type of the bytes, when the caller knows it.
  string media_type = 2;
}

// VerifyCredentialResponse returns the verdict of the DPG.
message VerifyCredentialResponse {
  // True when every check of the DPG passed.
  bool verified = 1;
  // The checks the DPG ran, as the DPG reported them. VCA runs its own
  // checks too (ADR-024 decision 2).
  repeated GetResultResponse.DpgCheck dpg_checks = 2;
}

// ResolveDidRequest names the DID to resolve.
message ResolveDidRequest {
  // The DID, for example did:indy:bcovrin:testnet:Ra8FGb2mXsTg1d4VqVnYpS.
  string did = 1;
}

// ResolveDidResponse carries the DID document.
message ResolveDidResponse {
  // The DID document as JSON. Its id names the DID of the request.
  string did_document = 1;
}

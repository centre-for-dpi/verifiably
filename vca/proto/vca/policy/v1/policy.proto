// SPDX-License-Identifier: Apache-2.0
// Verifier policy service (ADR-024). A policy set is a list of named
// checks. Each check is a pure function over a normalised presentation.
// VCA runs the mandatory checks itself and never trusts the DPG alone.
syntax = "proto3";

package vca.policy.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "vca/common/v1/common.proto";
import "vca/ingest/v1/ingest.proto";

// PolicyService evaluates presentations and manages policy sets.
service PolicyService {
  // Evaluate runs one policy set over one presentation and returns the
  // per check results. The overall verdict is the conjunction.
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
  // ListChecks returns the check names the service knows, with the
  // parameters each takes.
  rpc ListChecks(ListChecksRequest) returns (ListChecksResponse);
  // CreatePolicySet stores a policy set as version 1.
  rpc CreatePolicySet(CreatePolicySetRequest) returns (CreatePolicySetResponse);
  // UpdatePolicySet stores a new version of a policy set
  // (ADR-024 decision 6). Old versions stay readable.
  rpc UpdatePolicySet(UpdatePolicySetRequest) returns (UpdatePolicySetResponse);
  // GetPolicySet returns one version.
  rpc GetPolicySet(GetPolicySetRequest) returns (GetPolicySetResponse);
  // ListPolicySets returns the latest version of each set in pages.
  rpc ListPolicySets(ListPolicySetsRequest) returns (ListPolicySetsResponse);
  // DeletePolicySet removes every version of a set.
  rpc DeletePolicySet(DeletePolicySetRequest) returns (DeletePolicySetResponse);
  // GetCacheState returns the cache policy and the state of each cached
  // source: the trust list, the registry keys, and the status lists
  // (ADR-041 decision 5).
  rpc GetCacheState(GetCacheStateRequest) returns (GetCacheStateResponse);
  // SyncCache reads the sources of one kind now, or of every kind. The
  // service refuses a copy with a bad signature and keeps the last good
  // copy (ADR-041 decision 1).
  rpc SyncCache(SyncCacheRequest) returns (SyncCacheResponse);
  // SetCachePolicy stores the refresh intervals and the offline window
  // (ADR-041 decisions 2, 3, and 4).
  rpc SetCachePolicy(SetCachePolicyRequest) returns (SetCachePolicyResponse);
}

// CacheKind names one kind of cached trust material (ADR-041 decision 1).
enum CacheKind {
  CACHE_KIND_UNSPECIFIED = 0;
  // The trust list: the entries of the trust registry and of the
  // external registries it federates with.
  CACHE_KIND_TRUST_LIST = 1;
  // The registry keys. These are the key set of the trust registry and
  // the DID documents and key sets of the listed issuers. They also hold
  // the X.509 anchor chains of the external registries.
  CACHE_KIND_REGISTRY_KEYS = 2;
  // The status lists of the listed issuers and of the credentials the
  // service checked.
  CACHE_KIND_STATUS_LIST = 3;
}

// CachePolicy says how often the cache reads each kind. It also says
// when a check can use a copy with no network (ADR-041 decisions 2 to 4).
message CachePolicy {
  // How often the cache reads the trust list. Empty means 6 hours.
  google.protobuf.Duration trust_list_refresh = 1;
  // How often the cache reads the registry keys. Empty means 24 hours.
  google.protobuf.Duration keys_refresh = 2;
  // How often the cache reads the status lists. Empty means 1 hour.
  google.protobuf.Duration status_list_refresh = 3;
  // True lets a check read the cache when a source does not answer.
  bool allow_offline = 4;
  // How long after the last good read a copy stays usable with no
  // network. At most 7 days.
  google.protobuf.Duration offline_window = 5;
  // True marks a result that read a copy older than its refresh interval.
  bool mark_stale = 6;
  // True makes the status check fail on a status list copy older than
  // the offline window. This holds in every fail mode.
  bool refuse_stale_status = 7;
}

// CacheSource is the state of one cached source.
message CacheSource {
  // The kind of the source.
  CacheKind kind = 1;
  // The URL or the DID of the source.
  string source = 2;
  // The time of the last good read. Empty means no good read yet.
  google.protobuf.Timestamp synced_at = 3;
  // The time of the last read, good or failed.
  google.protobuf.Timestamp read_at = 4;
  // The reason of the last failed read. Empty after a good read.
  string last_error = 5;
  // The key id or the certificate subject that signed the copy. A
  // status list without a signature says "not checked".
  string signed_by = 6;
  // The number of items in the copy: entries, keys, or certificates.
  int32 item_count = 7;
  // The id of the external registry the source comes from. Empty means
  // the trust registry of this deployment.
  string registry_id = 8;
  // The display name of that external registry.
  string registry_name = 9;
}

// CacheKindState sums up the sources of one kind.
message CacheKindState {
  // The kind.
  CacheKind kind = 1;
  // The time of the oldest good copy of the kind. Empty means no copy.
  google.protobuf.Timestamp synced_at = 2;
  // The time the schedule reads the kind next.
  google.protobuf.Timestamp next_sync = 3;
  // The number of sources with a good copy.
  int32 sources = 4;
  // The number of items in the good copies.
  int32 items = 5;
  // The number of issuers the copies cover.
  int32 issuers = 6;
  // The number of sources whose last read failed.
  int32 failed = 7;
}

// GetCacheStateRequest has no fields.
message GetCacheStateRequest {}

// GetCacheStateResponse returns the policy and the state.
message GetCacheStateResponse {
  // The cache policy.
  CachePolicy policy = 1;
  // One state per kind, in the order of the enum.
  repeated CacheKindState kinds = 2;
  // Every source, by kind and then by source.
  repeated CacheSource sources = 3;
}

// SyncCacheRequest selects what to read.
message SyncCacheRequest {
  // The kind to read. Unspecified reads every kind: the trust list
  // first, then the keys, then the status lists.
  CacheKind kind = 1;
}

// SyncCacheResponse returns the state after the read.
message SyncCacheResponse {
  // One state per kind, in the order of the enum.
  repeated CacheKindState kinds = 1;
  // Every source, by kind and then by source.
  repeated CacheSource sources = 2;
  // The number of sources with a failed read or a refused copy.
  int32 failed = 3;
}

// SetCachePolicyRequest carries the policy to store.
message SetCachePolicyRequest {
  // The policy. An empty duration keeps the default of the field.
  CachePolicy policy = 1;
}

// SetCachePolicyResponse returns the stored policy.
message SetCachePolicyResponse {
  // The policy as stored.
  CachePolicy policy = 1;
}

// Outcome names the result of one check.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  // The check passed.
  OUTCOME_PASS = 1;
  // The check failed.
  OUTCOME_FAIL = 2;
  // The check did not apply to this presentation.
  OUTCOME_SKIP = 3;
  // The check could not run, for example a status list was not reachable.
  OUTCOME_ERROR = 4;
}

// CheckResult is the outcome of one check (ADR-024 decision 1).
message CheckResult {
  // The check name, for example signature, key_binding, nbf, exp,
  // audience, nonce, status, trust_chain, or schema.
  // The name derived_proof holds a place for BBS selective disclosure
  // (ADR-031 decision 2). The check returns SKIP until a DPG can issue
  // bbs-2023 proofs.
  string name = 1;
  // The outcome.
  Outcome outcome = 2;
  // The reason in Simplified Technical English, for the operator.
  string detail = 3;
  // The evidence the check used, keyed by name. For example the key id,
  // the status list URL, or the trust list URL. Never personal data.
  map<string, string> evidence = 4;
  // The zero based index of the credential the check ran on.
  // Minus 1 means the check ran on the whole presentation.
  int32 credential_index = 5;
  // The catalogue error for a failed check, when one applies.
  vca.common.v1.Error error = 6;
}

// PolicySet is a named list of checks with parameters (ADR-024 decision 6).
message PolicySet {
  // The set id. Stable across versions.
  string id = 1;
  // The version number. Starts at 1 and increases by 1.
  int32 version = 2;
  // The display name.
  string display_name = 3;
  // The checks, in run order.
  repeated Check checks = 4;
  // The tenant that owns the set.
  string tenant_id = 5;
  // The staff subject that created this version.
  string created_by = 6;
  // The creation time of this version.
  google.protobuf.Timestamp created_at = 7;

  // Check is one named check with its parameters.
  message Check {
    // The check name from ListChecks.
    string name = 1;
    // The parameters, keyed by name. For example fail_mode with the
    // value open or closed for the status check.
    map<string, string> params = 2;
    // True when a FAIL of this check makes the whole verdict FAIL.
    // The mandatory checks of ADR-024 decision 2 ignore false here.
    bool blocking = 3;
  }
}

// EvaluateRequest carries the presentation and the policy set.
message EvaluateRequest {
  // The presentation from the ingestion service.
  vca.ingest.v1.RawPresentation presentation = 1;
  // The policy set id. Empty uses the deployment default set.
  string policy_set_id = 2;
  // The policy set version. Zero selects the latest version.
  int32 policy_set_version = 3;
  // The expected audience for the audience check. Empty uses the verifier client id.
  string audience = 4;
  // The expected nonce for the nonce check. Empty uses the transaction nonce.
  string nonce = 5;
  // The time of evaluation. Empty means now.
  google.protobuf.Timestamp at = 6;
}

// EvaluateResponse returns the results.
message EvaluateResponse {
  // The overall verdict.
  Verdict verdict = 1;
  // The per check results, in run order.
  repeated CheckResult checks = 2;
  // The policy set id the service used.
  string policy_set_id = 3;
  // The policy set version the service used.
  int32 policy_set_version = 4;
  // The time of evaluation.
  google.protobuf.Timestamp evaluated_at = 5;
  // The age of the oldest cached material the evaluation read because a
  // source did not answer. Empty means every source answered online
  // (ADR-041 decision 3).
  google.protobuf.Duration material_age = 6;
  // True when that material was older than its refresh interval and the
  // cache policy marks such results.
  bool material_stale = 7;

  // Verdict names the overall result.
  enum Verdict {
    VERDICT_UNSPECIFIED = 0;
    // Every blocking check passed or did not apply.
    VERDICT_VALID = 1;
    // At least one blocking check failed.
    VERDICT_INVALID = 2;
    // No blocking check failed, but at least one could not run.
    VERDICT_INDETERMINATE = 3;
  }
}

// ListChecksRequest has no fields.
message ListChecksRequest {}

// ListChecksResponse returns the known checks.
message ListChecksResponse {
  // The checks.
  repeated CheckInfo checks = 1;

  // CheckInfo describes one check.
  message CheckInfo {
    // The check name.
    string name = 1;
    // The one sentence description in Simplified Technical English.
    string description = 2;
    // The parameter names the check takes, with a description each.
    map<string, string> params = 3;
    // True when VCA always runs the check (ADR-024 decision 2).
    bool mandatory = 4;
  }
}

// CreatePolicySetRequest carries the first version.
message CreatePolicySetRequest {
  // The set. The service ignores id, version, and timestamps.
  PolicySet policy_set = 1;
}

// CreatePolicySetResponse returns the stored set.
message CreatePolicySetResponse {
  // The set as stored.
  PolicySet policy_set = 1;
}

// UpdatePolicySetRequest carries a new version.
message UpdatePolicySetRequest {
  // The set. The id selects the set. The service assigns the version.
  PolicySet policy_set = 1;
}

// UpdatePolicySetResponse returns the stored version.
message UpdatePolicySetResponse {
  // The set as stored.
  PolicySet policy_set = 1;
}

// GetPolicySetRequest selects a version.
message GetPolicySetRequest {
  // The set id.
  string id = 1;
  // The version. Zero selects the latest version.
  int32 version = 2;
}

// GetPolicySetResponse returns the set.
message GetPolicySetResponse {
  // The set.
  PolicySet policy_set = 1;
}

// ListPolicySetsRequest selects a page.
message ListPolicySetsRequest {
  // The page to return.
  vca.common.v1.Pagination page = 1;
  // The tenant filter. Empty returns every tenant the session can read.
  string tenant_id = 2;
}

// ListPolicySetsResponse returns the sets.
message ListPolicySetsResponse {
  // The sets in the page.
  repeated PolicySet policy_sets = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// DeletePolicySetRequest selects a set.
message DeletePolicySetRequest {
  // The set id.
  string id = 1;
}

// DeletePolicySetResponse has no fields.
message DeletePolicySetResponse {}

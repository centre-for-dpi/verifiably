// SPDX-License-Identifier: Apache-2.0
// Issued credentials service (ADR-017). Every issuance writes one record
// to a hash chained log. The log holds no personal data: only a salted
// subject reference and the claims the schema marks as searchable.
// The signed chain head is a standard HTTP endpoint (ADR-003 decision 7):
//   GET /issued/chain-head serves the latest signed head as a JWS.
syntax = "proto3";

package vca.issued.v1;

import "google/protobuf/timestamp.proto";
import "vca/backend/v1/backend.proto";
import "vca/common/v1/common.proto";

// IssuedService reads and changes issued records.
service IssuedService {
  // Append records one issuance in the log. The issuance service calls
  // it after a credential reaches the holder (ADR-017 decision 1).
  rpc Append(AppendRequest) returns (AppendResponse) {
    option (vca.common.v1.description) = "Records one issuance in the log.";
  }
  // List returns records in pages with filters.
  rpc List(ListRequest) returns (ListResponse) {
    option (vca.common.v1.description) = "Returns issued records in pages with filters.";
  }
  // Search returns records whose searchable claims match a text.
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (vca.common.v1.description) = "Returns the records whose searchable claims match a text.";
  }
  // Get returns one record.
  rpc Get(GetRequest) returns (GetResponse) {
    option (vca.common.v1.description) = "Returns one issued record.";
  }
  // Revoke sets the status of one credential to revoked or suspended
  // through the status service and records the reason.
  rpc Revoke(RevokeRequest) returns (RevokeResponse) {
    option (vca.common.v1.description) = "Revokes or suspends one credential with a reason.";
  }
  // Reinstate clears a suspension and records the reason.
  rpc Reinstate(ReinstateRequest) returns (ReinstateResponse) {
    option (vca.common.v1.description) = "Ends the suspension of one credential with a reason.";
  }
  // Export streams records that match a filter as CSV or JSON lines.
  rpc Export(ExportRequest) returns (stream ExportResponse) {
    option (vca.common.v1.description) = "Streams the matching records as CSV or JSON lines.";
  }
  // GetChainHead returns the latest hash chain head and its signature
  // (ADR-017 decision 4).
  rpc GetChainHead(GetChainHeadRequest) returns (GetChainHeadResponse) {
    option (vca.common.v1.description) = "Returns the signed head of the hash chain.";
  }
  // VerifyChain walks the chain from one record to the head and reports
  // the first broken link, when any.
  rpc VerifyChain(VerifyChainRequest) returns (VerifyChainResponse) {
    option (vca.common.v1.description) = "Checks the hash chain and names the first broken link.";
  }
  // Prune runs the retention rules and drops the records that the
  // retention window no longer covers (ADR-017 decision 5).
  rpc Prune(PruneRequest) returns (PruneResponse) {
    option (vca.common.v1.description) = "Drops the records whose retention ended.";
  }
}

// Status names the status of an issued credential.
enum Status {
  STATUS_UNSPECIFIED = 0;
  // The credential is valid.
  STATUS_ACTIVE = 1;
  // The issuer suspended the credential. Reinstate can clear it.
  STATUS_SUSPENDED = 2;
  // The issuer revoked the credential. This is final.
  STATUS_REVOKED = 3;
  // The validity window ended.
  STATUS_EXPIRED = 4;
}

// IssuedRecord is one entry of the log (ADR-017 decision 1).
message IssuedRecord {
  // The record id. The service assigns it.
  string id = 1;
  // The schema id.
  string schema_id = 2;
  // The schema version.
  int32 schema_version = 3;
  // The subject reference. Never a DID or a name.
  vca.common.v1.Subject subject = 4;
  // The wire format.
  vca.common.v1.Format format = 5;
  // The status entry of the credential. Empty when not revocable.
  vca.backend.v1.StatusListBinding status_binding = 6;
  // The status at the time of the call.
  Status status = 7;
  // The DPG adapter that issued the credential.
  string dpg = 8;
  // The issuance time.
  google.protobuf.Timestamp issued_at = 9;
  // The SHA-256 hash of the credential bytes, hex encoded.
  string hash = 10;
  // The hash of the previous record, hex encoded. Empty for the first record.
  string previous_hash = 11;
  // The hash of this record over its fields and previous_hash, hex encoded.
  string record_hash = 12;
  // The searchable claims the schema allows, keyed by property name.
  map<string, string> searchable_claims = 13;
  // The validity window of the credential.
  vca.common.v1.ValidityWindow validity = 14;
  // The offer id in the issuance service.
  string offer_id = 15;
  // The time of the last status change.
  google.protobuf.Timestamp status_changed_at = 16;
  // The reason of the last status change.
  string status_reason = 17;
  // The time after which the scheduled job prunes the record.
  google.protobuf.Timestamp retain_until = 18;
  // The offer id that the DPG adapter assigned in CreateOffer. Empty when
  // the credential went out without an offer, such as on a document. The
  // issued credentials pages read the claim state of the offer with it.
  string dpg_offer_id = 19;
}

// AppendRequest carries one issuance to record.
message AppendRequest {
  // The record to write. The service assigns the id, the hashes, and
  // the retention time. It keeps every other field.
  IssuedRecord record = 1;
}

// AppendResponse returns the identity of the stored record.
message AppendResponse {
  // The record id the service assigned.
  string id = 1;
  // The hash of the stored record over its fields, hex encoded.
  string record_hash = 2;
}

// PruneRequest selects the records of one retention run.
message PruneRequest {
  // True counts the records that are due and drops none.
  bool dry_run = 1;
  // The schema id to prune. Empty prunes every schema.
  string schema_id = 2;
}

// PruneResponse returns the counts of one retention run.
message PruneResponse {
  // The number of records the run dropped. A dry run reports the
  // number of records that are due.
  int64 pruned = 1;
  // The number of records the log holds after the run.
  int64 remaining = 2;
}

// Filter narrows a list, search, or export.
message Filter {
  // The schema id. Empty returns every schema.
  string schema_id = 1;
  // The status. Unspecified returns every status.
  Status status = 2;
  // The format. Unspecified returns every format.
  vca.common.v1.Format format = 3;
  // The earliest issuance time. Empty means no lower bound.
  google.protobuf.Timestamp from = 4;
  // The latest issuance time. Empty means no upper bound.
  google.protobuf.Timestamp to = 5;
  // The subject reference. Empty returns every subject.
  string subject_ref = 6;
}

// ListRequest selects a page and a filter.
message ListRequest {
  // The page to return.
  vca.common.v1.Pagination page = 1;
  // The filter.
  Filter filter = 2;
}

// ListResponse returns a page of records, newest first.
message ListResponse {
  // The records in the page.
  repeated IssuedRecord records = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// SearchRequest carries a text and a filter.
message SearchRequest {
  // The text to match against searchable claims. At most 200 characters.
  string query = 1;
  // The filter.
  Filter filter = 2;
  // The page to return.
  vca.common.v1.Pagination page = 3;
}

// SearchResponse returns the matches.
message SearchResponse {
  // The records in the page.
  repeated IssuedRecord records = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// GetRequest selects a record.
message GetRequest {
  // The record id.
  string id = 1;
}

// GetResponse returns the record.
message GetResponse {
  // The record.
  IssuedRecord record = 1;
}

// RevokeRequest changes the status of one credential.
message RevokeRequest {
  // The record id.
  string id = 1;
  // The new status. REVOKED or SUSPENDED.
  Status status = 2;
  // The reason for the audit log. Required. Never a secret.
  string reason = 3;
}

// RevokeResponse returns the changed record.
message RevokeResponse {
  // The record.
  IssuedRecord record = 1;
}

// ReinstateRequest clears a suspension.
message ReinstateRequest {
  // The record id.
  string id = 1;
  // The reason for the audit log. Required.
  string reason = 2;
}

// ReinstateResponse returns the changed record.
message ReinstateResponse {
  // The record.
  IssuedRecord record = 1;
}

// ExportRequest selects records and a format.
message ExportRequest {
  // The filter.
  Filter filter = 1;
  // The output encoding.
  Encoding encoding = 2;
  // The text to match against searchable claims, as in Search. Empty
  // exports every record that passes the filter. At most 200 characters.
  string query = 3;

  // Encoding names the export format.
  enum Encoding {
    ENCODING_UNSPECIFIED = 0;
    // RFC 4180 CSV with a header row.
    ENCODING_CSV = 1;
    // One JSON object per line.
    ENCODING_JSON = 2;
  }
}

// ExportResponse is one chunk of the export.
message ExportResponse {
  // The chunk bytes. The client concatenates the chunks in order.
  bytes chunk = 1;
  // True on the last chunk.
  bool done = 2;
}

// ChainHead is the signed tip of the log.
message ChainHead {
  // The id of the last record.
  string record_id = 1;
  // The record hash of the last record, hex encoded.
  string record_hash = 2;
  // The number of records in the chain.
  int64 length = 3;
  // The time of signing.
  google.protobuf.Timestamp signed_at = 4;
  // The head as a compact JWS signed with the deployment key.
  string jws = 5;
  // The key id of the signing key.
  string key_id = 6;
}

// GetChainHeadRequest has no fields.
message GetChainHeadRequest {}

// GetChainHeadResponse returns the head.
message GetChainHeadResponse {
  // The head.
  ChainHead head = 1;
}

// VerifyChainRequest selects the start of the walk.
message VerifyChainRequest {
  // The record id to start from. Empty starts at the first record.
  string from_record_id = 1;
}

// VerifyChainResponse reports the walk.
message VerifyChainResponse {
  // True when every link matched.
  bool ok = 1;
  // The number of records the walk checked.
  int64 checked = 2;
  // The id of the first record whose hash did not match. Empty when ok.
  string broken_record_id = 3;
  // The head the walk ended at.
  ChainHead head = 4;
}

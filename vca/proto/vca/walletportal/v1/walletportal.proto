// SPDX-License-Identifier: Apache-2.0
// Wallet portal service (ADR-021). The citizen web wallet calls these RPCs
// to discover, claim, view, present, and delete credentials. The service
// delegates wallet actions to the DPG holder backend.
// Every RPC takes the session JWT of ADR-020 in the Authorization header.
syntax = "proto3";

package vca.walletportal.v1;

import "google/protobuf/timestamp.proto";
import "vca/common/v1/common.proto";
import "vca/schema/v1/schema.proto";
import "vca/trust/v1/trust.proto";

// WalletPortalService serves the citizen wallet pages.
service WalletPortalService {
  // ListDiscoverable returns the schemas that issuers publish for
  // pre-authorized issuance (ADR-021 decision 1).
  rpc ListDiscoverable(ListDiscoverableRequest) returns (ListDiscoverableResponse);
  // ListClaimable returns the schemas the citizen can get with the
  // authorization code flow. The eligibility answer is yes or no per schema
  // and nothing more (ADR-021 decision 2).
  rpc ListClaimable(ListClaimableRequest) returns (ListClaimableResponse);
  // Claim starts the authorization code flow for one schema.
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  // ClaimComplete takes the answer of the issuer after the sign in and
  // claims the credential into the wallet.
  rpc ClaimComplete(ClaimCompleteRequest) returns (ClaimCompleteResponse);
  // Scan takes the text of a scanned QR code and returns what it is.
  rpc Scan(ScanRequest) returns (ScanResponse);
  // Paste takes pasted text and returns what it is.
  rpc Paste(PasteRequest) returns (PasteResponse);
  // Accept claims a pending offer into the wallet.
  rpc Accept(AcceptRequest) returns (AcceptResponse);
  // Reject discards a pending offer.
  rpc Reject(RejectRequest) returns (RejectResponse);
  // Delete removes one credential from the wallet.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // ListMine returns the credentials in the wallet with trust and status.
  rpc ListMine(ListMineRequest) returns (ListMineResponse);
  // PresentStart reads an OID4VP request and returns the consent screen
  // data: each requested claim and its value (ADR-021 decision 5).
  rpc PresentStart(PresentStartRequest) returns (PresentStartResponse);
  // PresentConfirm sends the presentation after the citizen consented.
  rpc PresentConfirm(PresentConfirmRequest) returns (PresentConfirmResponse);
  // PresentDecline refuses a presentation request. The wallet tells the
  // verifier and keeps a record of the refusal.
  rpc PresentDecline(PresentDeclineRequest) returns (PresentDeclineResponse);
  // ListPresentations returns the presentation records of the wallet,
  // newest first. A record names the verifier, the shared claim names,
  // and the result, and never a claim value.
  rpc ListPresentations(ListPresentationsRequest) returns (ListPresentationsResponse);
  // Document returns a printable document of one credential of the DPG
  // wallet, when the adapter lists FEATURE_WALLET_DOCUMENT.
  rpc Document(DocumentRequest) returns (DocumentResponse);
  // AnswerInvitation accepts or declines a DIDComm invitation that the
  // citizen scanned or pasted. It works when the wallet of the stack
  // speaks DIDComm (ADR-062). A decline sends nothing to the other
  // party.
  rpc AnswerInvitation(AnswerInvitationRequest) returns (AnswerInvitationResponse);
  // ListInbox returns the credential offers and the proof requests that
  // came to the wallet over a DIDComm connection, newest first.
  rpc ListInbox(ListInboxRequest) returns (ListInboxResponse);
  // AnswerInbox accepts one offer or one proof request of the inbox.
  rpc AnswerInbox(AnswerInboxRequest) returns (AnswerInboxResponse);
  // ListConnections returns the DIDComm connections of the wallet,
  // newest first.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
}

// Card is one credential as the wallet shows it (ADR-021 decision 6).
message Card {
  // The credential id in the wallet.
  string id = 1;
  // The card title from the display metadata.
  string title = 2;
  // The credential type.
  string type = 3;
  // The wire format.
  vca.common.v1.Format format = 4;
  // The issuer DID or URL.
  string issuer = 5;
  // The issuer display name from the trust list, when known.
  string issuer_name = 6;
  // The trust outcome of the issuer.
  vca.trust.v1.TrustLookupResponse.Outcome trust = 7;
  // The validity window of the credential.
  vca.common.v1.ValidityWindow validity = 8;
  // The revocation state as the status list reports it.
  RevocationState revocation = 9;
  // The plain language status line, in Simplified Technical English.
  string status_text = 10;
  // The visible claims, keyed by name, as text.
  map<string, string> claims = 11;
  // The time the wallet received the credential.
  google.protobuf.Timestamp received_at = 12;
  // The display metadata of the schema, when known.
  vca.schema.v1.Display display = 13;
  // True when the browser store keeps the credential. A card of the
  // wallet of the stack carries false.
  bool in_browser = 14;
  // True when the wallet of the stack cannot remove the credential.
  bool permanent = 15;
  // The claims that every presentation of the credential sends, whatever
  // the holder ticks: an SD-JWT claim outside any disclosure, or each
  // claim of a format the wallet cannot disclose in part.
  repeated string fixed_claims = 16;

  // RevocationState names what the status list says.
  enum RevocationState {
    REVOCATION_STATE_UNSPECIFIED = 0;
    // The status list shows the credential as valid.
    REVOCATION_STATE_VALID = 1;
    // The issuer suspended the credential.
    REVOCATION_STATE_SUSPENDED = 2;
    // The issuer revoked the credential.
    REVOCATION_STATE_REVOKED = 3;
    // The credential has no status list.
    REVOCATION_STATE_NONE = 4;
    // The wallet could not read the status list.
    REVOCATION_STATE_UNKNOWN = 5;
  }
}

// ClaimMethod names one OID4VCI grant a holder can use to claim.
enum ClaimMethod {
  CLAIM_METHOD_UNSPECIFIED = 0;
  // The issuer sends an offer with a pre-authorized code. The holder
  // scans or pastes the offer and enters a transaction code when asked.
  CLAIM_METHOD_PRE_AUTHORIZED_CODE = 1;
  // The holder signs in at the issuer with the authorization code flow.
  CLAIM_METHOD_AUTHORIZATION_CODE = 2;
}

// Offering is one schema an issuer offers.
message Offering {
  // The issuer URL.
  string credential_issuer = 1;
  // The issuer display name.
  string issuer_name = 2;
  // The trust outcome of the issuer.
  vca.trust.v1.TrustLookupResponse.Outcome trust = 3;
  // The schema.
  vca.schema.v1.PublicSchema schema = 4;
  // The ways the holder can claim the credential, from the grants the
  // issuer metadata names. An empty list names no grant.
  repeated ClaimMethod claim_methods = 5;
}

// ListDiscoverableRequest selects a page.
message ListDiscoverableRequest {
  // The page to return.
  vca.common.v1.Pagination page = 1;
}

// ListDiscoverableResponse returns the offerings.
message ListDiscoverableResponse {
  // The offerings in the page.
  repeated Offering offerings = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
}

// ListClaimableRequest selects a page.
message ListClaimableRequest {
  // The page to return.
  vca.common.v1.Pagination page = 1;
}

// ListClaimableResponse returns the offerings with eligibility.
message ListClaimableResponse {
  // The offerings in the page.
  repeated Item items = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;

  // Item is one offering and whether the citizen can claim it.
  message Item {
    // The offering.
    Offering offering = 1;
    // True when the issuer says the citizen can get this credential.
    bool eligible = 2;
  }
}

// ClaimRequest selects an offering.
message ClaimRequest {
  // The issuer URL.
  string credential_issuer = 1;
  // The schema id at the issuer.
  string schema_id = 2;
  // The wire format to ask for.
  vca.common.v1.Format format = 3;
  // The wallet page the issuer sends the browser back to after the sign
  // in. With it, the service starts the authorization code flow in the
  // browser when the issuer names an authorization server.
  string redirect_uri = 4;
  // A pending offer that names the authorization code grant. The service
  // reads the issuer, the configuration, the issuer_state and the
  // authorization server from it (ADR-082).
  string offer_id = 5;
}

// ClaimResponse returns the next step.
message ClaimResponse {
  // The URL the browser opens to authorize at the issuer, when the flow
  // needs a browser step.
  string authorization_url = 1;
  // The card, when the wallet got the credential without a browser step.
  Card card = 2;
  // The pending offer id, when the wallet must call Accept.
  string offer_id = 3;
}

// ClaimCompleteRequest carries the answer of the authorization server.
message ClaimCompleteRequest {
  // The state the service sent with the authorization request.
  string state = 1;
  // The authorization code.
  string code = 2;
  // The error code of the authorization server, when it refused.
  string error = 3;
}

// ClaimCompleteResponse returns the credential now in the wallet.
message ClaimCompleteResponse {
  // The card of the claimed credential.
  Card card = 1;
  // In browser storage, the authorized offer that the browser claims
  // with its own key (ADR-082).
  string offer_id = 2;
  // The summary of that offer.
  OfferSummary offer = 3;
}

// Detected says what a scanned or pasted text is.
message Detected {
  // The kind of the text.
  Kind kind = 1;
  // The pending offer id, for an offer.
  string offer_id = 2;
  // The offer summary, for an offer.
  OfferSummary offer = 3;
  // The presentation id, for a presentation request. PresentStart takes it.
  string presentation_id = 4;
  // The error, when the text is not usable.
  vca.common.v1.Error error = 5;
  // The DIDComm invitation, for KIND_DIDCOMM_INVITATION.
  DidcommInvitation invitation = 6;

  // Kind names the type of a scanned text.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // An OID4VCI credential offer.
    KIND_CREDENTIAL_OFFER = 1;
    // An OID4VP presentation request.
    KIND_PRESENTATION_REQUEST = 2;
    // A credential in one of the supported formats.
    KIND_CREDENTIAL = 3;
    // Text the wallet does not understand.
    KIND_UNKNOWN = 4;
    // A DIDComm invitation, which a DIDComm wallet opens.
    KIND_DIDCOMM_INVITATION = 5;
  }
}

// DidcommInvitation is what the wallet reads in a DIDComm invitation.
message DidcommInvitation {
  // The invitation as the holder scanned it.
  string uri = 1;
  // The name the issuer gave its agent.
  string label = 2;
  // True when the invitation carries a credential offer.
  bool carries_offer = 3;
  // The id of the pending invitation that AnswerInvitation takes. Only
  // a wallet of the stack that speaks DIDComm opens an invitation, so
  // it is empty for any other wallet.
  string invitation_id = 4;
  // True when the invitation carries a proof request.
  bool carries_request = 5;
  // The values an offer carries.
  repeated NamedValue offered = 6;
  // What a proof request asks for, as plain text: an attribute name, or
  // a predicate such as "acres >= 10".
  repeated string requested = 7;
  // The name of the credential or of the proof request, when the
  // invitation names one.
  string name = 8;
}

// OfferSummary is what the wallet shows before the citizen accepts.
message OfferSummary {
  // The issuer URL.
  string credential_issuer = 1;
  // The issuer display name.
  string issuer_name = 2;
  // The trust outcome of the issuer.
  vca.trust.v1.TrustLookupResponse.Outcome trust = 3;
  // The credential types in the offer.
  repeated string types = 4;
  // The display metadata per type, when known.
  repeated vca.schema.v1.Display display = 5;
  // True when the offer needs a transaction code.
  bool needs_pin = 6;
  // The display names of the claims the offered credentials carry, read
  // from the issuer metadata.
  repeated string claims = 7;
  // True when the wallet read the issuer metadata. The offer page names
  // the issuer address and says so when it is false.
  bool metadata_read = 8;
  // True when the offer needs a sign in at the issuer: it names the
  // authorization code grant and no pre-authorized code (ADR-082).
  bool sign_in = 9;
}

// ScanRequest carries the decoded QR text.
message ScanRequest {
  // The text the browser decoded from the QR code.
  string text = 1;
}

// ScanResponse returns what the text is.
message ScanResponse {
  // The detection.
  Detected detected = 1;
}

// PasteRequest carries pasted text.
message PasteRequest {
  // The pasted text. At most 64 KiB.
  string text = 1;
}

// PasteResponse returns what the text is.
message PasteResponse {
  // The detection.
  Detected detected = 1;
}

// AcceptRequest claims a pending offer.
message AcceptRequest {
  // The pending offer id.
  string offer_id = 1;
  // The transaction code, when the offer needs one.
  string pin = 2;
}

// AcceptResponse returns the new card.
message AcceptResponse {
  // The card.
  Card card = 1;
  // The presentation the issuer asks for before it issues, when the
  // offer needs one. The card is then empty. PresentStart and
  // PresentConfirm take the id, and PresentConfirm returns the card.
  string presentation_id = 2;
}

// RejectRequest discards a pending offer.
message RejectRequest {
  // The pending offer id.
  string offer_id = 1;
}

// RejectResponse has no fields.
message RejectResponse {}

// DeleteRequest removes a credential.
message DeleteRequest {
  // The credential id in the wallet.
  string id = 1;
}

// DeleteResponse has no fields.
message DeleteResponse {}

// DocumentRequest selects one credential of the wallet.
message DocumentRequest {
  // The credential id in the wallet.
  string id = 1;
}

// DocumentResponse carries the document.
message DocumentResponse {
  // The document bytes.
  bytes content = 1;
  // The media type, such as application/pdf.
  string media_type = 2;
}

// ListMineRequest selects a page.
message ListMineRequest {
  // The page to return.
  vca.common.v1.Pagination page = 1;
}

// ListMineResponse returns the cards.
message ListMineResponse {
  // The cards in the page.
  repeated Card cards = 1;
  // The page description.
  vca.common.v1.PageResult page = 2;
  // A sentence when the stack wallet beside the browser store did not
  // answer. The cards then hold the browser credentials alone. Empty
  // when the stack answered.
  string stack_problem = 3;
}

// PresentStartRequest selects a presentation request.
message PresentStartRequest {
  // The presentation id from Scan or Paste, or the request URI itself.
  string presentation_id = 1;
}

// PresentStartResponse is the consent screen data.
message PresentStartResponse {
  // The presentation id to confirm.
  string presentation_id = 1;
  // The verifier client id, usually a URL.
  string verifier = 2;
  // The verifier display name from the trust list, when known.
  string verifier_name = 3;
  // The trust outcome of the verifier.
  vca.trust.v1.TrustLookupResponse.Outcome trust = 4;
  // One entry per credential the verifier asks for.
  repeated RequestedCredential requested = 5;
  // The purpose text the verifier gave, when any.
  string purpose = 6;
  // True when an issuer asks for the presentation before it issues a
  // credential (interactive authorization of OID4VCI).
  bool during_issuance = 7;

  // RequestedCredential is one credential the verifier asks for.
  message RequestedCredential {
    // The DCQL credential query id.
    string query_id = 1;
    // The credential type the verifier filters on.
    string type = 2;
    // The wire format the verifier accepts.
    vca.common.v1.Format format = 3;
    // The cards in the wallet that match.
    repeated Card matches = 4;
    // The claims the verifier asks for, with the value the first match holds.
    repeated Claim claims = 5;

    // Claim is one requested claim.
    message Claim {
      // The claim path, for example given_name or address.street.
      string path = 1;
      // The value the wallet would disclose, as text.
      string value = 2;
      // True when the verifier marks the claim as needed.
      bool mandatory = 3;
      // True when the matched credential sends the claim in every
      // presentation, so the holder cannot leave it out. The consent
      // screen lists it even when the verifier did not ask for it.
      bool always_sent = 4;
    }
  }
}

// PresentConfirmRequest sends the presentation.
message PresentConfirmRequest {
  // The presentation id.
  string presentation_id = 1;
  // The chosen card per query id.
  map<string, string> selected_cards = 2;
  // The claim paths the citizen agreed to disclose, per query id.
  map<string, ClaimPaths> disclosed = 3;
  // The key binding JWT that the holder key of the browser signed over
  // the disclosed credential (ADR-073). A holder bound SD-JWT of the
  // browser store needs it. Empty for any other credential. An answer
  // with several bound credentials carries a JSON object instead. The
  // object maps each query id to its key binding JWT.
  string key_binding = 4;

  // ClaimPaths is a list of claim paths.
  message ClaimPaths {
    // The claim paths.
    repeated string paths = 1;
  }
}

// PresentConfirmResponse reports the outcome.
message PresentConfirmResponse {
  // True when the verifier accepted the presentation.
  bool accepted = 1;
  // The redirect URI the verifier returned, when any.
  string redirect_uri = 2;
  // The plain language outcome text.
  string message = 3;
  // The record the wallet keeps of this presentation.
  PresentationRecord record = 4;
  // The credential the issuer gave after the presentation, when the
  // request came from an issuer during issuance.
  Card card = 5;
}

// PresentationRecord is what the wallet keeps of one answer to a
// verifier. It holds claim names only, never a claim value.
message PresentationRecord {
  // The record id.
  string id = 1;
  // The time of the answer.
  google.protobuf.Timestamp at = 2;
  // The verifier identifier, the client_id of the request.
  string verifier = 3;
  // The verifier display name from the trust list, when known.
  string verifier_name = 4;
  // The names of the claims the wallet shared. Empty after a refusal.
  repeated string claims = 5;
  // The result of the answer.
  Result result = 6;
  // The id of the request the wallet answered: the last path segment of
  // its request URI, else its state. Empty when the request names none.
  string request_id = 7;
  // The credentials the answer carried, by the type the request asked
  // for, else by the query id.
  repeated string credentials = 8;

  // Result names the outcome of one answer.
  enum Result {
    RESULT_UNSPECIFIED = 0;
    // The verifier took the presentation.
    RESULT_ACCEPTED = 1;
    // The verifier refused the presentation.
    RESULT_REJECTED = 2;
    // The citizen refused the request.
    RESULT_DECLINED = 3;
    // The wallet could not send the presentation.
    RESULT_FAILED = 4;
  }
}

// PresentDeclineRequest names the request the citizen refuses.
message PresentDeclineRequest {
  // The presentation id from Scan, Paste, or PresentStart.
  string presentation_id = 1;
}

// PresentDeclineResponse returns the record of the refusal.
message PresentDeclineResponse {
  // The record the wallet keeps.
  PresentationRecord record = 1;
}

// ListPresentationsRequest asks for the presentation records.
message ListPresentationsRequest {
  // The page to read. The page size caps the number of records.
  vca.common.v1.Pagination page = 1;
}

// ListPresentationsResponse returns the records, newest first.
message ListPresentationsResponse {
  // The records.
  repeated PresentationRecord records = 1;
  // The page result.
  vca.common.v1.PageResult page = 2;
}

// NamedValue is one name and its value.
message NamedValue {
  // The name.
  string name = 1;
  // The value.
  string value = 2;
}

// AnswerInvitationRequest answers one pending invitation.
message AnswerInvitationRequest {
  // The invitation id from Scan or Paste.
  string invitation_id = 1;
  // True declines the invitation. The wallet then forgets it and sends
  // nothing.
  bool decline = 2;
}

// AnswerInvitationResponse returns what the wallet did.
message AnswerInvitationResponse {
  // The credential the wallet took, for an invitation with an offer.
  Card card = 1;
  // The record of the answer, for an invitation with a proof request.
  PresentationRecord record = 2;
  // The label of the other party, for an invitation that makes a
  // connection only.
  string connection_label = 3;
  // A plain language sentence about the result.
  string message = 4;
}

// ListInboxRequest has no fields.
message ListInboxRequest {}

// ListInboxResponse returns what waits for the citizen.
message ListInboxResponse {
  // The offers and the proof requests, newest first.
  repeated InboxEntry entries = 1;
}

// InboxEntry is one offer or proof request that waits for the citizen.
message InboxEntry {
  // The id AnswerInbox takes.
  string id = 1;
  // What the entry is.
  Kind kind = 2;
  // The label of the connection it came over.
  string from = 3;
  // When it came.
  google.protobuf.Timestamp received_at = 4;
  // The name of the credential or of the proof request.
  string name = 5;
  // The values an offer carries.
  repeated NamedValue offered = 6;
  // What a proof request asks for, as plain text.
  repeated string requested = 7;

  // Kind names the type of an entry.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // A credential offer.
    KIND_OFFER = 1;
    // A proof request.
    KIND_PROOF_REQUEST = 2;
  }
}

// AnswerInboxRequest accepts one entry of the inbox.
message AnswerInboxRequest {
  // The entry id from ListInbox.
  string id = 1;
  // The kind of the entry from ListInbox.
  InboxEntry.Kind kind = 2;
}

// AnswerInboxResponse returns what the wallet did.
message AnswerInboxResponse {
  // The credential the wallet took, for an offer.
  Card card = 1;
  // The record of the answer, for a proof request.
  PresentationRecord record = 2;
  // A plain language sentence about the result.
  string message = 3;
}

// ListConnectionsRequest has no fields.
message ListConnectionsRequest {}

// ListConnectionsResponse returns the connections of the wallet.
message ListConnectionsResponse {
  // The connections, newest first.
  repeated Connection connections = 1;
}

// Connection is one DIDComm connection of the wallet.
message Connection {
  // The id of the connection.
  string id = 1;
  // The label of the other party.
  string label = 2;
  // The state of the connection, such as completed.
  string state = 3;
  // When the connection began.
  google.protobuf.Timestamp created_at = 4;
}

# SonarCloud configuration — verifiably-go
#
# Run by .github/workflows/quality.yml on every push to main and every PR.
# Analysis is CI-based, NOT SonarCloud "Automatic Analysis" — automatic
# analysis cannot ingest Go coverage reports, and coverage on new code is the
# whole point of the gate. Turn Automatic Analysis OFF in the project's
# Administration → Analysis Method, or CI analyses will be rejected.
#
# Setup status (verified 2026-09-10 via the SonarCloud API):
#   [x] Project imported. Key is <org>_<repo-name>, and the repo's NAME is
#       "verifiably" even though the clone URL still says demo-daas-3-0.
#   [x] Automatic Analysis OFF (sonar.autoscan.enabled=false at project level,
#       overriding the instance default of true). This is REQUIRED, not
#       optional: automatic analysis cannot ingest coverage reports, and per
#       Sonar's docs a CI analysis run while it is enabled will FAIL the build.
#       A sonar-project.properties file does NOT disable it — SonarCloud simply
#       ignores this file's parameters during an automatic run.
#       The toggle is easy to miss: project -> Administration -> Analysis
#       Method, then the small unlabelled switch INLINE with the "Automatic
#       analysis" heading, just after "Recommended". The explanatory prose sits
#       below it, so reading top-to-bottom you miss the control.
#   [x] SONAR_TOKEN repo secret set (a Project Analysis Token — least
#       privilege; a User or Global token would also work but grants more).
#   [x] New Code = "previous_version" (inherited from the instance default;
#       no project-level change was needed).
#   [x] Quality gate = "Sonar way" (default): 0 new bugs, 0 new vulnerabilities,
#       >=80% coverage on new code, <=3% duplication on new code.
#   [ ] Make the gate a REQUIRED check on main. DECIDED 2026-09-10: it applies
#       to the open PRs too — no exemption for work that predates it. #14 must
#       lift internal/mdl (75.4%), internal/mdoc (79.5%) and internal/signer
#       (77.8%) over the 80%-on-new-code line; #15 already clears it at 98.3%.
#       See docs/technical-scope.md § 3.

sonar.projectKey=centre-for-dpi_verifiably
sonar.organization=centre-for-dpi
sonar.projectName=verifiably-go
sonar.projectVersion=0.1

# --- Scope -------------------------------------------------------------------
# The analysis root is verifiably-go/ (this file's directory). Sources are the
# Go application; everything else is either vendored, generated, or operational
# tooling analysed by other gates (Trivy for containers, shellcheck for scripts).
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/vendor/**,\
  **/.terraform/**,\
  **/testdata/**,\
  e2e/**,\
  static/vendor/**,\
  deploy/k8s/terraform/**/.terraform/**,\
  server

# Duplication is measured on hand-written Go only. The four DPG adapters share
# structural similarity by design (they implement one interface against four
# vendors), so adapter duplication is reviewed rather than auto-flagged — see
# docs/technical-scope.md, Workstream A.
sonar.cpd.exclusions=\
  internal/adapters/**/*_test.go,\
  **/testdata/**

# --- Go ----------------------------------------------------------------------
sonar.go.coverage.reportPaths=coverage.out
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

# Coverage is measured on application code. Generated, vendored and
# main-package wiring is excluded so the number reflects testable logic.
# Coverage is measured on Go, because Go is the only language here with a
# coverage report. Shell and Python are still ANALYSED -- bugs, vulnerabilities
# and hotspots in them count, and the taint finding on oob-redirect.py proves
# it -- they are just excluded from the coverage RATIO, which would otherwise
# read 0% for every deploy-script change and make the gate meaningless.
#
# If the Python surface grows past a couple of utilities, add pytest +
# coverage.xml and delete the **/*.py line rather than leaving it here.
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/*.py,\
  **/*.sh,\
  e2e/**,\
  internal/mock/**,\
  cmd/inji-preauth-proxy/**,\
  **/testdata/**

# Root-level issuer branding, surfaced at /.well-known/openid-credential-issuer.
# Without it a wallet shows the raw issuer URL where the issuing authority's
# name belongs. Per deployment, not per schema: walt.id accepts one
# issuerDisplay per service, so a deployment serving two authorities needs
# two instances -- which is how walt.id already models issuer-api vs.
# issuer-api2 here.
#
# `name` needs the two-line fallback-then-override form below, not plain
# ${?VAR} and not an empty-string fallback -- both verified by actually
# booting with VERIFIABLY_ISSUER_DISPLAY_NAME genuinely unset (not merely
# ""):
#   - plain ${?VAR}: ${?VAR} correctly omits the key when unset, but this
#     image's DisplayProperties decoder requires `name` to be *present* on
#     every issuerDisplay element, so an omitted key fails kotlinx decode at
#     boot ("'name': ... Collection element decode failure ... Missing Int
#     from config").
#   - name = "": decodes fine here, but walt.id/issuer-api2's IssuerDisplay
#     type (a different class from this image's DisplayProperties) enforces
#     "display name must not be blank" as an init-block invariant and
#     crashes with IllegalArgumentException even though the key is present.
# "Issuer" satisfies both: always present, never blank, and generic enough
# that an unconfigured deployment still reads as "no real branding set"
# rather than a fabricated org name. The line below it stands, and only
# ${?VAR} overwrites it, when set. `description` has neither requirement
# (optional on both types), so plain ${?VAR} omission is correct there.
#
# Locale follows the same convention as the per-credential display blocks
# below: English is the base; add more locale entries as needed.
#
# No logo here deliberately: the two walt.id images disagree on the sub-key
# (this image's shipped commented-out sample uses logo.url; issuer-api2's
# uses logo.uri) and we have not picked one, so omitting avoids the trap of
# guessing which key gets parsed.
#
# Lives in credential-issuer-metadata.baseline.conf, not the gitignored
# runtime credential-issuer-metadata.conf next to it: deploy.sh seeds the
# runtime file from this baseline only on first `up` (cp -n) and never
# touches it again, so an edit to the runtime copy is invisible to every
# other checkout and to any fresh deploy. See commit 8d4b459 (fix(deploy):
# persist user-added walt.id schemas across git operations) for why the
# runtime file is gitignored in the first place.
issuerDisplay = [
  {
    name = "Issuer"
    name = ${?VERIFIABLY_ISSUER_DISPLAY_NAME}
    locale = "en"
    description = ${?VERIFIABLY_ISSUER_DESCRIPTION}
  }
]

supportedCredentialTypes = {
    BankId = [VerifiableCredential, BankId],
    KycChecksCredential = [VerifiableCredential, VerifiableAttestation, KycChecksCredential],
    KycCredential = [VerifiableCredential, VerifiableAttestation, KycCredential],
    KycDataCredential = [VerifiableCredential, VerifiableAttestation, KycDataCredential],
    PassportCh = [VerifiableCredential, VerifiableAttestation, VerifiableId, PassportCh],
    PND91Credential = [VerifiableCredential, PND91Credential],
    MortgageEligibility = [VerifiableCredential, VerifiableAttestation, VerifiableId, MortgageEligibility],
    PortableDocumentA1 = [VerifiableCredential, VerifiableAttestation, PortableDocumentA1],
    OpenBadgeCredential = [VerifiableCredential, OpenBadgeCredential],
    VaccinationCertificate = [VerifiableCredential, VerifiableAttestation, VaccinationCertificate],
    WalletHolderCredential = [VerifiableCredential, WalletHolderCredential],
    UniversityDegree = [VerifiableCredential, UniversityDegree],
    VerifiableId = [VerifiableCredential, VerifiableAttestation, VerifiableId],
    CTWalletSameAuthorisedInTime = [VerifiableCredential, VerifiableAttestation, CTWalletSameAuthorisedInTime],
    CTWalletSameAuthorisedDeferred = [VerifiableCredential, VerifiableAttestation, CTWalletSameAuthorisedDeferred],
    CTWalletSamePreAuthorisedInTime = [VerifiableCredential, VerifiableAttestation, CTWalletSamePreAuthorisedInTime],
    CTWalletSamePreAuthorisedDeferred = [VerifiableCredential, VerifiableAttestation, CTWalletSamePreAuthorisedDeferred],
    AlpsTourReservation = [VerifiableCredential, VerifiableAttestation, AlpsTourReservation],
    EducationalID = [VerifiableCredential, VerifiableAttestation, EducationalID],
    HotelReservation = [VerifiableCredential, VerifiableAttestation, HotelReservation],
    IdentityCredential = [VerifiableCredential, VerifiableAttestation, IdentityCredential],
    Iso18013DriversLicenseCredential = [VerifiableCredential, VerifiableAttestation, Iso18013DriversLicenseCredential],
    TaxReceipt = [VerifiableCredential, VerifiableAttestation, TaxReceipt],
    VerifiablePortableDocumentA1 = [VerifiableCredential, VerifiableAttestation, VerifiablePortableDocumentA1],
    Visa = [VerifiableCredential, VerifiableAttestation, Visa],
    eID = [VerifiableCredential, VerifiableAttestation, eID],
    NaturalPersonVerifiableID = [VerifiableCredential, VerifiableAttestation, NaturalPersonVerifiableID],
    BoardingPass = [VerifiableCredential, VerifiableAttestation, BoardingPass],
    LegalPerson = [VerifiableCredential, LegalPerson],
    LegalRegistrationNumber = [VerifiableCredential, LegalRegistrationNumber],
    GaiaXTermsAndConditions = [VerifiableCredential, GaiaXTermsAndConditions],
    DataspaceParticipantCredential = [VerifiableCredential, DataspaceParticipantCredential],

    "org.iso.18013.5.1.mDL" = {
        format = mso_mdoc
        cryptographic_binding_methods_supported = ["cose_key"]
        credential_signing_alg_values_supported = ["ES256"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256"] } }
        doctype = "org.iso.18013.5.1.mDL"
        # Explicit display name — mso_mdoc config ids are keyed by doctype
        # (not "<TypeName>_<format>"), so verifiably-go's displayNameFor
        # can't derive a readable label from the id alone and falls back to
        # this. Named to match the existing card grid's curated allowlist
        # entry (schemaAllowlistDefault, internal/adapters/waltid/issuer.go)
        # so this entry surfaces by default without also touching the
        # allowlist.
        display = [
            {
                name = "Iso18013 Drivers License Credential"
                description = "ISO/IEC 18013-5 mobile driving licence (mDL / mdoc)."
                locale = "en-US"
                background_color = "#FFFFFF"
                text_color = "#000000"
            }
        ]
    }

    "urn:eu.europa.ec.eudi:pid:1" = {
        format = "vc+sd-jwt"
        cryptographic_binding_methods_supported = ["jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        vct = "http://${SERVICE_HOST}:${ISSUER_API_PORT}/urn:eu.europa.ec.eudi:pid:1"
    }

    "identity_credential_vc+sd-jwt" = {
        format = "vc+sd-jwt"
        cryptographic_binding_methods_supported = ["jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        vct = "http://${SERVICE_HOST}:${ISSUER_API_PORT}/identity_credential"
    }
}

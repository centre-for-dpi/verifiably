# http://localhost:7005 (shipped default) is meaningless to a wallet and not
# even the port our compose definition uses. baseUrl is what gets stamped
# into the credential offer the citizen's wallet resolves, so it must match
# the SERVICE_HOST / ISSUER_API_PORT this container is actually reachable at
# (matching deploy/k8s/config/issuer/issuer-service.conf's pattern).
baseUrl = "http://${SERVICE_HOST}:${ISSUER_API_PORT}"

# ciTokenKey and credentialEncryptionKey both shipped as private keys
# published in walt.id's public GitHub repository -- ciTokenKey's "d" value
# is byte-identical to the example defaultIssuerKey in issuer2-profiles.conf,
# reused here for CI-token signing; credentialEncryptionKey is a third,
# distinct embedded private key. Both replaced with HOCON env substitution
# (no "?" -- a missing value must fail startup outright, not silently fall
# back to a key anyone can find online).
#
# Set each env var to the same JSON object the shipped value used inside
# its triple-quoted string ({"type":"jwk","jwk":{...}}), on one line and
# UNQUOTED here.
#
# These two fields take a JSON **string** -- walt.id ships them as
# triple-quoted strings and deserializes the JSON text itself. A substituted
# env var is always a string in HOCON, so the single-variable form above is
# exactly right for them. (An earlier version of this comment claimed HOCON
# "parses the substituted JSON text as an object"; that is FALSE. HOCON does
# no such re-parsing. The code was right for the wrong reason.)
#
# That distinction matters: defaultIssuerKey.jwk in issuer2-profiles.conf
# wants an OBJECT, not a string, so the identical-looking blob substitution
# broke every issuance there while passing every boot check. See the comment
# above defaultIssuerKey for the full account. Same syntax, opposite
# requirement -- do not "harmonise" these two patterns.
ciTokenKey = ${VERIFIABLY_ISSUER2_CI_TOKEN_KEY}

credentialEncryptionKey = ${VERIFIABLY_ISSUER2_CRED_ENCRYPTION_KEY}


  # mDOC credential configurations synced from waltid-credentials.
  #
  # The `display` block on the two docTypes we issue (mDL below and Photo ID
  # further down) is MANAGED, not hand-written. verifiably-go rewrites it
  # whenever an operator saves a custom mdoc schema for that docType, so the
  # name the wallet shows is the name the operator typed
  # (internal/adapters/waltid/catalog_issuer2.go: setIssuer2Display).
  #
  # It briefly held a hardcoded "Driving Licence" / "Licencia de Conducir" pair.
  # That fixed the original symptom — the wallet fell back to the configuration
  # id and showed `org.iso.18013.5.1.mDL` on the citizen's accept screen — but
  # it substituted OUR name for the issuing authority's: an operator whose
  # schema is called "mDL" still saw "Driving Licence". The value below is only
  # a boot-time placeholder for a deployment that has not yet saved a schema;
  # do not translate or curate it, because the first save replaces it wholesale.

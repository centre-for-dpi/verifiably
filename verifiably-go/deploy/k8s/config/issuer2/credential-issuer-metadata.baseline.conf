# Root-level issuer branding, surfaced at /.well-known/openid-credential-issuer.
# Without it a wallet shows the raw issuer URL where the issuing authority's
# name belongs. Per deployment, not per schema: walt.id accepts one
# issuerDisplay per service, so a deployment serving two authorities needs
# two instances -- which is how walt.id already models issuer-api vs.
# issuer-api2 here.
#
# `name` needs the two-line fallback-then-override form below, not plain
# ${?VAR} and not an empty-string fallback -- both verified by actually
# booting with VERIFIABLY_ISSUER_DISPLAY_NAME genuinely unset (not merely
# ""):
#   - plain ${?VAR}: correctly omits the key when unset, but the legacy
#     issuer's DisplayProperties decoder requires `name` to be *present* on
#     every issuerDisplay element, so an omitted key fails kotlinx decode at
#     boot there ("'name': ... Collection element decode failure ... Missing
#     Int from config").
#   - name = "": decodes fine on the legacy issuer, but THIS image's
#     IssuerDisplay type (id.walt.openid4vci.metadata.issuer.IssuerDisplay --
#     a different class from the legacy issuer's DisplayProperties) enforces
#     "display name must not be blank" as an init-block invariant and
#     crashes with IllegalArgumentException at boot even though the key is
#     present.
# "Issuer" satisfies both images: always present, never blank, and generic
# enough that an unconfigured deployment still reads as "no real branding
# set" rather than a fabricated org name. The line below it stands, and only
# ${?VAR} overwrites it, when set. `description` has neither requirement
# (optional on both types), so plain ${?VAR} omission is correct there.
#
# This replaces walt.id's own stock sample block (name "walt.id Issuer",
# locales en-US/de-DE, logo at docs.walt.id/logo-2.png) that shipped baked
# into this image -- that sample is not something we ever want live.
#
# No logo here deliberately: the two walt.id images disagree on the sub-key
# (this image's stock sample above used logo.uri; the legacy issuer image's
# shipped commented-out sample uses logo.url) and we have not picked one, so
# omitting avoids the trap of guessing which key gets parsed.
issuerDisplay = [
  {
    name = "Issuer"
    name = ${?VERIFIABLY_ISSUER_DISPLAY_NAME}
    locale = "en"
    description = ${?VERIFIABLY_ISSUER_DESCRIPTION}
  }
]


# Default credential signing material for OSS Issuer2 profiles.
#
# The shipped defaultIssuerKey was walt.id's published example private key
# (from their public GitHub repo) — one of three private keys this file and
# issuer-service.conf shipped embedded in cleartext. Replaced with HOCON env
# substitution so a missing key fails the boot loudly instead of silently
# falling back to a keypair anyone can find online.
#
# The key must be EC P-256 — mdoc/CBOR signing rejects Ed25519.
#
# jwk is supplied FIELD BY FIELD, not as one JSON blob. This is not a style
# choice, it is the only shape that works. `jwk = ${SOME_VAR}` holding
# {"kty":"EC",...} substitutes as a HOCON *string*, because a substituted
# env var is always a string — HOCON does not re-parse it as JSON. walt.id
# needs an object here (the shipped original was a nested HOCON object), so
# the blob form produced:
#
#   "issuerKey": { "type": "jwk", "jwk": "{\"kty\":\"EC\",...}" }
#
# and every credential request died at the endpoint with
# `500 {"error":"server_error","error_description":"Invalid JSON object"}`
# out of nimbus-jose-jwt's JSONObjectUtils.parseJSONObject.
#
# That failure is INVISIBLE to a boot check: the service starts cleanly and
# GET /issuer2/profiles returns 200 with this key present. It only appears
# when a wallet actually asks for a credential. Do not revert this to the
# single-variable blob form, and do not re-verify it by booting — the only
# check that closes it is issuing a real credential.
#
# Contrast issuer-service.conf's ciTokenKey / credentialEncryptionKey: those
# two fields genuinely want a JSON *string*, so a single-variable
# substitution is correct there. Same-looking syntax, opposite requirement.
#
# Bare ${VAR}, not ${?VAR}: a missing key must stop the boot rather than
# silently fall back to walt.id's published example keypair.
defaultIssuerKey = {
  type = "jwk"
  jwk = {
    kty = "EC"
    crv = "P-256"
    x = ${VERIFIABLY_ISSUER2_KEY_X}
    y = ${VERIFIABLY_ISSUER2_KEY_Y}
    d = ${VERIFIABLY_ISSUER2_KEY_D}
  }
}

# Any of our KMS integrations can also be used for the issuer key
# defaultIssuerKey = {
#   type = "tse"
#   server = "http://vault:8200/v1/transit"
#   id = "my-issuer-key"
#   auth = {
#     accessKey = "hvs.your-vault-token"
#   }
#   # Optional: for Vault Enterprise namespaces
#   # namespace = "my-namespace"
# }

# defaultIssuerDid is walt.id's shipped EXAMPLE value, bound to the OLD
# published key that defaultIssuerKey above no longer uses. Neither isoMdl
# nor isoPhotoId reference it (no issuerDid field in either profile), so it
# is otherwise inert for this task's scope.
defaultIssuerDid = "did:jwk:eyJrdHkiOiJFQyIsImNydiI6IlAtMjU2IiwieCI6IkcwUklOQmlGLW9RVUQzZDVER25lZ1F1WGVuSTI5SkRhTUdvTXZpb0tSQk0iLCJ5IjoiZWQzZUZHczJwRXRycDd2QVo3QkxjYnJVdHBLa1lXQVQySlBVUUs0bE40RSJ9"

# ============================================================================
# HARD GATE -- DO NOT TRUST CREDENTIALS ISSUED WHILE THIS STANDS AS SHIPPED
# ============================================================================
# This is walt.id's PUBLISHED EXAMPLE CERTIFICATE. Its embedded public key
# does NOT match VERIFIABLY_ISSUER2_KEY_X/_Y/_D (the operator key
# substituted into defaultIssuerKey above). isoMdl and isoPhotoId both do
# `x5Chain = ${defaultIssuerX5chain}`, so every mdoc this service issues
# will be COSE-signed with the operator's real key but will carry THIS
# certificate in its x5chain header.
#
# ISO 18013-5 gives a verifier no source of truth for the signing public key
# other than the x5chain leaf certificate -- that is where a conformant
# reader (including the Multipaz reader this project tests with) gets the
# key it checks the COSE_Sign1 signature against. So: new key + old
# certificate = credentials that boot fine and issue fine, but fail
# signature verification at every conformant reader. This will NOT throw or
# log an error anywhere in walt.id; it is only visible once something
# actually verifies the mdoc.
#
# This certificate MUST be replaced with one covering the operator key
# (VERIFIABLY_ISSUER2_KEY_X/_Y/_D)
# before any credential from this service is trusted. Certificate
# provisioning (including IACA anchor distribution and the ISO 18013-5
# Annex B 457-day validity cap) is owned by the issuer-key-rotation design:
# verifiably-go/docs/superpowers/specs/2026-07-23-issuer-key-rotation-design.md
# (see its x509chain backend). Do not hand-roll a throwaway cert here --
# that creates a second, undocumented PKI this design would then have to
# reconcile with.
# ============================================================================
defaultIssuerX5chain = [
  """-----BEGIN CERTIFICATE-----

-----END CERTIFICATE-----"""
]


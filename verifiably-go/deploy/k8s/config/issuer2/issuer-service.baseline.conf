# http://localhost:7005 (shipped default) is meaningless to a wallet and not
# even the port our compose definition uses. baseUrl is what gets stamped
# into the credential offer the citizen's wallet resolves, so it must match
# the SERVICE_HOST / ISSUER_API_PORT this container is actually reachable at
# (matching deploy/k8s/config/issuer/issuer-service.conf's pattern).
baseUrl = "http://${SERVICE_HOST}:${ISSUER_API_PORT}"

# These two fields CANNOT be filled by env substitution. Both facts below
# were proven on a real deploy, and they box the value in from both sides:
#
#   ciTokenKey = ${VAR}       -> HOCON parses the substituted {"type":...}
#                                as an OBJECT; Hoplite wants a JSON string,
#                                and the boot dies with
#                                `Expected quotation mark '"', but had 't'`.
#                                (The arg-count in that message names a
#                                Boolean field that exists in no shipped
#                                config -- a red herring. The 't' is the
#                                first char of "type".)
#
#   ciTokenKey = """${VAR}""" -> HOCON does NOT substitute inside triple
#                                quotes. The literal text ${VAR} reaches
#                                walt.id and fails the same way.
#
# So deploy.sh renders the real JSON into this file at deploy time, the way
# walt.id ships it (triple-quoted literal). The placeholders below are what
# lives in git; they are replaced on deploy and must never be committed with
# real key material in their place.
#
# Contrast defaultIssuerKey.jwk in issuer2-profiles.conf: that one wants an
# OBJECT, so it is built field-by-field from three separate coordinate vars
# (see 1995815). Same-looking syntax, opposite requirement -- do not
# "harmonise" the two patterns.
ciTokenKey = """__RENDERED_BY_DEPLOY_CI_TOKEN_KEY__"""

credentialEncryptionKey = """__RENDERED_BY_DEPLOY_CRED_ENCRYPTION_KEY__"""


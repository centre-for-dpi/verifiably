# persistence deliberately left OFF: this is a single-pod deployment, so
# there is no multi-replica session-affinity problem for Redis to solve.
# Effect: in-flight credential offers and pre-authorized codes live in
# memory and are lost if the container restarts. Already-issued credentials
# are unaffected -- they are signed artifacts already sitting in the
# wallet, not state this service holds. If issuer-api2 is ever scaled to
# multiple replicas, this must be revisited (uncomment persistence below and
# configure Redis in persistence.conf) -- an unconfigured Redis with the
# flag left off is silently ignored and the service keeps running in
# memory with no error, so leaving this ambiguous is not acceptable.
enabledFeatures = [
    # persistence,
    # entra,
    # dev-mode
    # ...
]
disabledFeatures = [
    # ...
]

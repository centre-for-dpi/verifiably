# This file's clientSecret was walt.id's own demo value, pointed at their
# public keycloak.demo.walt.id instance -- a third party we do not control.
# Nothing in _features.conf enables the feature that reads this file (no
# auth-service / entra flag is uncommented), so it is believed inert for
# this deployment. "Probably inert" is not a reason to ship a working
# credential for someone else's server: parameterised so nobody can
# accidentally authenticate against walt.id's demo Keycloak by mistake.
name = "keycloak"
authorizeUrl = "https://keycloak.demo.walt.id/realms/mynewrealm/protocol/openid-connect/auth"
accessTokenUrl = "https://keycloak.demo.walt.id/realms/mynewrealm/protocol/openid-connect/token"
clientId = "issuer_api"
clientSecret = ${?VERIFIABLY_ISSUER2_OIDC_CLIENT_SECRET}
defaultScopes = ["openid", "profile"]
forwardIssuerStateToAuthorizationServer = false

# Test users:
# jane@walt.id; jane
# Claims:
# given_name, family_name

# max@walt.id; password
# Claims:
# clearanceLevel, employeeId, position, department, startDate

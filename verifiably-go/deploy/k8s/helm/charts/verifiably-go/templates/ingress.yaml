{{- if .Values.app.ingress.enabled }}
{{- $host := include "verifiably-go.ingressHost" . }}
{{- if not $host }}
{{- fail "app.ingress.host or app.baseUrl or global.domain must be set" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "verifiably-go.fullname" . }}
  labels: {{- include "verifiably-go.labels" . | nindent 4 }}
  annotations:
    {{- /* Merge rather than concatenate. The chart's own values already set
         cert-manager.io/cluster-issuer (default "selfsigned"), so emitting
         the global one as a second line produced a DUPLICATE YAML key --
         invalid YAML that kubeconform rejects and that Kubernetes would
         resolve by silently taking the last value. global.clusterIssuer is
         the deployment-wide choice, so it wins over the chart default. */}}
    {{- $ann := deepCopy (.Values.app.ingress.annotations | default dict) }}
    {{- if .Values.global.clusterIssuer }}
    {{- $_ := set $ann "cert-manager.io/cluster-issuer" .Values.global.clusterIssuer }}
    {{- end }}
    {{- toYaml $ann | nindent 4 }}
spec:
  ingressClassName: {{ .Values.app.ingress.className }}
  {{- if .Values.app.ingress.tls }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ include "verifiably-go.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "verifiably-go.fullname" . }}
                port: { name: http }
{{- end }}

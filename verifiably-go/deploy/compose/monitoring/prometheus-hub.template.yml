global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: hub

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  # ── Hub's own verifiably-go instance ──────────────────────────────────────
  - job_name: verifiably-hub
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['verifiably-go:8080']
        labels:
          component: hub
    # Uncomment if VERIFIABLY_API_KEYS is set on the Hub:
    # authorization:
    #   type: Bearer
    #   credentials: <hub-api-key>

  # ── Federation members ─────────────────────────────────────────────────────
  # Generated from the trusted_issuers table by generate-federation-prometheus.sh.
  # Do not edit the member jobs below by hand — they are overwritten on every
  # run. Re-run the script (or wire it into a hook) after adding, editing, or
  # removing a member in /admin/federation/members so Grafana stays in sync.

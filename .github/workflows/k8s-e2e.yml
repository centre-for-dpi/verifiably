name: k8s-e2e

on:
  pull_request:
    paths:
      - 'verifiably-go/deploy/k8s/**'
      - 'verifiably-go/cmd/**'
      - 'verifiably-go/backend/**'
      - 'verifiably-go/internal/**'
      - 'verifiably-go/e2e/**'
      - '.github/workflows/k8s-e2e.yml'

defaults:
  run:
    working-directory: verifiably-go

jobs:
  kind-up-test-down:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # The previous version of this step added the Helm and HashiCorp apt
      # repositories by hand, and failed on its first ever run:
      #
      #   curl: (60) SSL certificate problem: unable to get local issuer
      #   certificate      (fetching https://baltocdn.com/helm/signing.asc)
      #   gpg: no valid OpenPGP data found
      #
      # Pulling GPG keys over curl and trusting third-party apt repos is both
      # fragile and a wider supply-chain surface than this job needs. The
      # first-party setup actions pin a version and verify their own downloads.

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false   # the deploy script parses terraform output

      - name: Install kind + kubectl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          # kubectl ships on the runner image; install it only if that changes.
          if ! command -v kubectl >/dev/null; then
            ver=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
            curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${ver}/bin/linux/amd64/kubectl"
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          kind --version && kubectl version --client && helm version --short && terraform version

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Bring up cluster + waltid stack
        timeout-minutes: 18
        run: |
          ./deploy/k8s/scripts/k8s-deploy.sh up waltid --target=local

      - name: Run e2e smoke set
        timeout-minutes: 5
        run: |
          ./deploy/k8s/test/e2e/run-against-cluster.sh

      - name: Tear down
        if: always()
        run: |
          ./deploy/k8s/scripts/k8s-deploy.sh reset --target=local || true

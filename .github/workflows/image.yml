name: image

on:
  push:
    branches: [main]
    paths:
      - 'verifiably-go/cmd/**'
      - 'verifiably-go/backend/**'
      - 'verifiably-go/internal/**'
      - 'verifiably-go/vctypes/**'
      - 'verifiably-go/templates/**'
      - 'verifiably-go/static/**'
      - 'verifiably-go/go.mod'
      - 'verifiably-go/go.sum'
      - 'verifiably-go/Dockerfile'
      - 'verifiably-go/Makefile'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'verifiably-go/cmd/**'
      - 'verifiably-go/backend/**'
      - 'verifiably-go/internal/**'
      - 'verifiably-go/vctypes/**'
      - 'verifiably-go/Dockerfile'

defaults:
  run:
    working-directory: verifiably-go

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: verifiably-go

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: verifiably-go/go.sum
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      # Unit tests run in quality.yml, which is the single producer of
      # coverage.out. This job keeps build + vet as a fast pre-gate.
      - name: host-aliases unit tests
        run: bash scripts/ci/test-host-aliases.sh
      # Report-only: the guard also flags the legitimately vendor-specific Inji/
      # eSignet handlers (inji_proxy/inji_schema/inji_holder/onboard) and vendor
      # mentions in comments, so it can't be a hard gate until it's re-scoped to
      # the true UI core. Surfaced in the log so NEW coupling stays visible.
      - name: vendor-agnosticism guard (report-only)
        continue-on-error: true
        run: bash scripts/ci/agnosticism.sh

  build:
    needs: go-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # for cosign keyless signing in Phase 7.2
      security-events: write # SARIF upload for the misconfig scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY,,}/${IMAGE_NAME}:$SHA" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "latest=${REGISTRY,,}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: verifiably-go
          push: false
          load: true
          tags: ${{ steps.tags.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # BLOCKING: dependency CVEs and committed secrets. This is the pair with
      # teeth -- its first ever run found 8 CVEs in golang.org/x/* (one
      # CRITICAL) that are fixed in this branch.
      - name: Trivy filesystem scan (vulns + secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: verifiably-go
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret
          trivyignores: verifiably-go/.trivyignore.yaml

      # REPORT-ONLY: infrastructure misconfiguration. Not a lower standard --
      # a different backlog. The live findings are:
      #
      #   AWS-0040/0041 (CRITICAL)  the EKS bootstrap enables public cluster
      #                             access from 0.0.0.0/0
      #   AWS-0104      (CRITICAL)  unrestricted egress on the cluster SG
      #   KSV-0014      (HIGH x2)   wso2is and libretranslate do not set
      #                             readOnlyRootFilesystem
      #   DS-0031       (CRITICAL)  false positive: VERIFIABLY_AUTH_PROVIDERS_FILE
      #                             is a path (/app/config/auth-providers.json),
      #                             matched by a name heuristic
      #
      # The three real classes all sit in infrastructure that has never been
      # observed running (docs/k8s/resume.md: the workloads layer has never
      # come up). Adding readOnlyRootFilesystem to two containers that write at
      # runtime, blind, on a stack that has never booted, buys a green gate and
      # a broken deploy. Tracked in docs/technical-scope.md as G.3/G.4; becomes
      # blocking once G.2 has a verified cluster to test the fixes against.
      - name: Trivy misconfiguration scan (report-only)
        if: always()   # must still produce SARIF when the blocking scan fails
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: verifiably-go
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          scanners: misconfig
          format: sarif
          output: trivy-misconfig.sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('trivy-misconfig.sarif') != ''
        with:
          sarif_file: trivy-misconfig.sarif
          category: trivy-misconfig

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ steps.tags.outputs.ref }}
          severity: HIGH,CRITICAL
          exit-code: '0'   # report-only on the built image; tighten in Phase 7.2
          ignore-unfixed: true

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push ${{ steps.tags.outputs.ref }}
          docker tag ${{ steps.tags.outputs.ref }} ${{ steps.tags.outputs.latest }}
          docker push ${{ steps.tags.outputs.latest }}

      # Cosign keyless signing — Phase 7.2 wires Kyverno enforcement.
      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name == 'push'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes ${{ steps.tags.outputs.ref }}

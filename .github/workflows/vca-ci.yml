name: vca-ci

# PR gate for the Verifiable Credentials Adapters (vca/).
# Implements ADR-006 decisions 2, 5 and 6, with the quality gates of
# quality.yml (the gate of verifiably-go/): SonarCloud, a coverage
# ratchet, gosec SARIF and shellcheck.
#
# Every check job blocks the merge. There is no continue-on-error anywhere.
# Two outputs only feed reports, and the check behind each still blocks:
# the checkstyle report for Sonar (the golangci-lint step blocks) and the
# gosec SARIF file for the Security tab (the gosec linter of golangci-lint
# blocks).
#
# Deliberately NOT path-filtered. This workflow is meant to be a required
# status check, and a required check that filters itself out by path
# leaves a pull request waiting for a status that never comes.
# The legacy monolith (verifiably-go/) keeps its own workflows.

on:
  push:
    branches: [main, vc-adapter]
  pull_request:
    branches: [main, vc-adapter]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vca-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: vca/go.mod
  # go.sum is regenerated on a networked machine (make tidy). Until it is
  # committed, -mod=mod lets CI resolve the module graph itself.
  GOFLAGS: -mod=mod
  GOTOOLCHAIN: local
  # The blocking golangci-lint step and the checkstyle report for Sonar
  # run this one release. It stays a v2 release: vca/.golangci.yml is a
  # version 2 file.
  GOLANGCI_LINT_VERSION: v2.5.0

defaults:
  run:
    working-directory: vca

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="${BASE}..${HEAD}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="${BEFORE}..${SHA}"
          else
            range="${SHA}~1..${SHA}"
          fi
          ./hack/check-commits.sh "$range"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every script under vca/ and deploy/vca/, at the strictest level.
      # The tree is clean, so a new finding blocks the merge.
      - name: shellcheck every script under vca/ and deploy/vca/
        shell: bash
        run: |
          shellcheck --version
          find . ../deploy/vca -name '*.sh' -type f -print0 \
            | sort -z \
            | xargs -0 -r shellcheck -S style
          ./hack/check-commits_test.sh

  secrets:
    name: secret scan (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: No tracked secret (ADR-029 decision 6)
        run: ./hack/secret-scan.sh

      - name: The key=value rule of the scan (ADR-055 decision 5)
        run: ./hack/secret-scan_test.sh

  lint:
    name: gofmt + go vet + golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: vca/go.mod

      - name: Download modules
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: vca
          args: --timeout=10m

      # Sonar reads the golangci-lint findings as external issues, so the
      # SonarCloud page shows all code health in one place. Report only:
      # the step above is the blocking one, and this step must not fail
      # the job a second time. It runs the binary that the action put on
      # PATH, so both steps run the same release. It always leaves a valid
      # report, so the sonarcloud job always finds the artifact.
      - name: golangci-lint checkstyle report (for Sonar, report only)
        if: ${{ !cancelled() }}
        run: |
          if command -v golangci-lint >/dev/null 2>&1 \
             && [ "v$(golangci-lint version --short)" = "$GOLANGCI_LINT_VERSION" ]; then
            golangci-lint run --timeout=10m \
              --output.checkstyle.path=golangci-lint-report.xml \
              --issues-exit-code=0 ./... \
              || echo "::warning::golangci-lint could not write the Sonar report"
          else
            echo "::warning::golangci-lint $GOLANGCI_LINT_VERSION is not on PATH; the Sonar report is empty"
          fi
          if [ ! -s golangci-lint-report.xml ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<checkstyle version="5.0"></checkstyle>' > golangci-lint-report.xml
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: golangci-lint-report
          path: vca/golangci-lint-report.xml
          retention-days: 7

  proto:
    name: buf lint + breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
          version: 1.73.0

      - name: buf lint
        run: buf lint

      - name: Fetch main for the merge base
        run: git fetch --no-tags origin main || true

      - name: buf breaking against the last tag or the merge base
        run: ./hack/buf-breaking.sh

  test:
    name: go test + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: vca/go.mod

      - name: Download modules
        run: go mod download

      # `shell: bash` is REQUIRED here, not cosmetic. The default shell of
      # `run:` is `bash -e` WITHOUT pipefail, so `go test | tee` takes the
      # exit status of the last command, and a failing suite reports
      # success (quality.yml found this on its first run). Naming the
      # shell switches on `-eo pipefail`.
      #
      # -coverpkg=./... counts the lines that the tests of any package
      # reach, for the total and for Sonar. test-output.txt holds the
      # go test -json stream, which Sonar reads as the test report. jq
      # prints the plain output to the log, without the line of each test
      # that passes.
      - name: go test (race, coverage)
        shell: bash
        run: |
          go test ./... \
            -race \
            -count=1 \
            -covermode=atomic \
            -coverprofile=coverage.out \
            -coverpkg=./... \
            -json \
            | tee test-output.txt \
            | jq -Rrj 'fromjson? | select(.Action == "output" or .Action == "build-output")
                | .Output // empty
                | select(test("^(=== (RUN|PAUSE|CONT|NAME)|\\s*--- (PASS|SKIP))") | not)'

      - name: Coverage gate (90 percent per package, core at 100)
        run: ./hack/coverage.sh 90

      # The total leaves out what hack/coverage.sh does not gate (gen/ and
      # every cmd/ package) and the kit example page (ui/example/).
      - name: Coverage summary
        run: |
          grep -vE '/(gen|cmd)/|/ui/example/' coverage.out > coverage-gated.out
          go tool cover -func=coverage-gated.out > coverage-func.txt
          total=$(awk '$1 == "total:" { print $NF }' coverage-func.txt)
          echo "total coverage: $total"
          {
            echo "### Coverage: $total"
            echo
            echo "Every package except gen/, cmd/ and ui/example/. The 40 functions with the lowest coverage:"
            echo
            echo '```text'
            grep -v '^total:' coverage-func.txt \
              | awk '{ p = $NF; sub(/%$/, "", p); print p "\t" $0 }' \
              | sort -t "$(printf '\t')" -k1,1n \
              | sed -n '1,40p' \
              | cut -f2-
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Ratchet: the total of the summary never drops below the floor.
      # Raise COVERAGE_FLOOR in the change that raises the coverage: run
      # the go test line above in vca/, then the first two lines of the
      # summary step, and set the floor to the total rounded down to one
      # decimal. Never lower it. See vca/docs/ci.md.
      - name: Coverage floor (ratchet)
        env:
          COVERAGE_FLOOR: '95.6'
        run: |
          total=$(awk '$1 == "total:" { print $NF }' coverage-func.txt | tr -d '%')
          echo "total=$total floor=$COVERAGE_FLOOR"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN {
            if (t + 0 < f + 0) {
              printf "::error::coverage %s%% is below the floor of %s%%\n", t, f
              exit 1
            }
            printf "coverage %s%% >= floor %s%%\n", t, f
          }'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: vca-coverage
          path: |
            vca/coverage.out
            vca/test-output.txt
          retention-days: 7

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Sonar needs SONAR_TOKEN, which a pull request from a fork does not
    # get. Skip rather than fail, so that an outside contribution is not
    # blocked by a missing secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # New code detection and blame need the full history.
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vca-coverage
          path: vca

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: golangci-lint-report
          path: vca

      # The profile covers every package (-coverpkg=./...). Generated code,
      # main packages and the kit example are excluded from the Sonar ratio
      # anyway, so their lines only make the file large and the log noisy
      # ("is not included in the project, ignoring coverage" per file).
      - name: Trim the coverage report to the analysed code
        shell: bash
        run: |
          grep -vE '/(gen|cmd)/|/ui/example/' coverage.out > coverage.trimmed
          mv coverage.trimmed coverage.out
          wc -l coverage.out

      # The project centre-for-dpi_verifiably_vca must exist in SonarCloud,
      # with vc-adapter as its main branch until the merge, see
      # vca/sonar-project.properties and vca/docs/ci.md.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: vca

      # Blocks the merge when the SonarCloud quality gate fails. The gate
      # is set in SonarCloud ("Sonar way" on new code: no new bugs, no new
      # vulnerabilities, 80 percent coverage, 3 percent duplication).
      - name: Quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: vca/.scannerwork/report-task.txt

  gosec:
    name: gosec SARIF (report for the Security tab)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: vca/go.mod

      - name: Download modules
        run: go mod download

      # Report only, as in quality.yml: every finding lands in the
      # Security tab. The blocking gosec check is the gosec linter of
      # golangci-lint in the lint job. G104 (unchecked error) is the
      # errcheck rule, which golangci-lint already blocks on. gosec runs
      # at an exact release, never @latest, so a new rule set arrives
      # through a reviewed change.
      - name: gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 \
            -no-fail -fmt=sarif -out=gosec.sarif \
            -exclude=G104 -exclude-generated ./...

      # A pull request from a fork gets a read only token, so the upload
      # would fail there.
      - name: Upload the SARIF file
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: ${{ !cancelled() && hashFiles('vca/gosec.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: vca/gosec.sarif
          category: gosec-vca

  trivy:
    name: trivy fs (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: vca
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

  browser:
    name: wallet.js in Chromium (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: vca/go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download modules
        run: go mod download

      # The test loads Playwright through NODE_PATH, so the job needs no
      # package.json in the tree.
      - name: Install Playwright and Chromium
        working-directory: ${{ runner.temp }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "NODE_PATH=${{ runner.temp }}/node_modules" >> "$GITHUB_ENV"

      - name: Claim and present with wallet.js (ADR-004 decision 6)
        env:
          VCA_PLAYWRIGHT: '1'
        run: go test -count=1 -run TestWalletScriptInChromium -v ./services/walkthrough/

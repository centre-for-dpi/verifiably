name: vca-nightly

# Nightly checks for the Verifiable Credentials Adapters (vca/).
# Implements ADR-006 decision 7.
# Slow and environment-heavy checks run here, not on every PR:
#   the full unit suite, contract tests against real DPG containers,
#   and a Helm render plus kind deploy of deploy/vca/helm/*.
# Every job blocks. There is no continue-on-error anywhere.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vca-nightly
  cancel-in-progress: false

env:
  GOFLAGS: -mod=mod
  GOTOOLCHAIN: local

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vca
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: vca/go.mod
          cache-dependency-path: vca/go.mod

      - name: Download modules
        run: go mod download

      - name: make test
        run: make test

      - name: make cover
        run: make cover

  contract:
    name: contract tests (real DPGs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vca
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: vca/go.mod
          cache-dependency-path: vca/go.mod

      - name: Download modules
        run: go mod download

      - name: Contract tests
        env:
          # Space separated DPG names, for example "waltid inji credebl esignet".
          # Empty until the first dpg-adapter service ships its compose file.
          VCA_CONTRACT_DPGS: ${{ vars.VCA_CONTRACT_DPGS }}
          # The Inji holder case signs this test holder in at the holder
          # realm and opens the Mimoto wallet (P6-I7d). With no holder
          # here, contract-tests.sh makes one through the Keycloak admin
          # API of the stack and sets these four variables (P6-I7g).
          VCA_INJI_CONTRACT_HOLDER_USER: ${{ vars.VCA_INJI_CONTRACT_HOLDER_USER }}
          VCA_INJI_CONTRACT_HOLDER_PASSWORD: ${{ secrets.VCA_INJI_CONTRACT_HOLDER_PASSWORD }}
          VCA_INJI_CONTRACT_HOLDER_REDIRECT_URI: ${{ vars.VCA_INJI_CONTRACT_HOLDER_REDIRECT_URI }}
          VCA_INJI_CONTRACT_HOLDER_PIN: ${{ secrets.VCA_INJI_CONTRACT_HOLDER_PIN }}
        # The job deploys a throwaway test deployment, so it writes the
        # marker that the script needs before it touches a deployment.
        run: |
          printf 'VCA_CONTRACT_DEPLOYMENT=test\n' > ../deploy/vca/contract.env
          ./hack/contract-tests.sh

  k8s:
    name: helm render + kind deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check for charts
        id: charts
        run: |
          if ls deploy/vca/helm/*/Chart.yaml >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy/vca/helm has no charts yet; the kind deploy is skipped"
          fi

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        if: steps.charts.outputs.present == 'true'
        with:
          version: v3.19.0

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        if: steps.charts.outputs.present == 'true'
        with:
          version: v0.30.0
          cluster_name: vca-smoke
          wait: 120s

      - name: Kubernetes smoke
        run: ./vca/hack/k8s-smoke.sh

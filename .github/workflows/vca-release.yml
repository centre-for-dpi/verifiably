name: vca-release

# Release workflow for the Verifiable Credentials Adapters (vca/).
# Implements ADR-006 decisions 1, 3, 4 and ADR-005 decisions 4, 5.
#
# A version tag is the only path to a published release:
#   git tag vX.Y.Z && git push --tags
#
# For every service under vca/services/*/ with a Dockerfile the workflow:
#   builds one image, tags it :vX.Y.Z, :vX.Y and :vX,
#   sets the OCI labels, signs it keyless with cosign,
#   attaches SPDX and CycloneDX SBOM attestations.
# Then it builds the vca CLI for linux and darwin (amd64, arm64),
# packages Helm charts under deploy/vca/helm/*, and creates a GitHub
# Release with the generated release notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOFLAGS: -mod=mod
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  version:
    name: parse version
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.v.outputs.full }}
      minor: ${{ steps.v.outputs.minor }}
      major: ${{ steps.v.outputs.major }}
      bare: ${{ steps.v.outputs.bare }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      services: ${{ steps.svc.outputs.services }}
      service_count: ${{ steps.svc.outputs.count }}
      has_cli: ${{ steps.svc.outputs.has_cli }}
      has_charts: ${{ steps.svc.outputs.has_charts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Parse SemVer tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$TAG" =~ $re ]]; then
            echo "::error::tag $TAG is not SemVer 2.0.0 (vX.Y.Z[-pre][+build])"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          pre="${BASH_REMATCH[4]}"
          {
            echo "full=$TAG"
            echo "bare=${TAG#v}"
            echo "minor=v${major}.${minor}"
            echo "major=v${major}"
            if [ -n "$pre" ]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Discover services, CLI and charts
        id: svc
        run: |
          list='[]'
          count=0
          if [ -d vca/services ]; then
            while IFS= read -r dockerfile; do
              name=$(basename "$(dirname "$dockerfile")")
              list=$(printf '%s' "$list" | python3 -c 'import json,sys; l=json.load(sys.stdin); l.append(sys.argv[1]); print(json.dumps(l))' "$name")
              count=$((count + 1))
            done < <(find vca/services -mindepth 2 -maxdepth 2 -name Dockerfile -type f | sort)
          fi
          echo "services=$list"
          {
            echo "services=$list"
            echo "count=$count"
            if [ -f vca/cmd/vca/main.go ]; then echo "has_cli=true"; else echo "has_cli=false"; fi
            if ls deploy/vca/helm/*/Chart.yaml >/dev/null 2>&1; then echo "has_charts=true"; else echo "has_charts=false"; fi
          } >> "$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.service }}
    needs: version
    if: needs.version.outputs.service_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.version.outputs.services) }}
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Image name and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          FULL: ${{ needs.version.outputs.full }}
          MINOR: ${{ needs.version.outputs.minor }}
          MAJOR: ${{ needs.version.outputs.major }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image="${REGISTRY}/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/vca-${SERVICE}"
          tags="${image}:${FULL}"
          # A pre-release never moves the floating vX.Y and vX tags.
          if [ "$PRERELEASE" = "false" ]; then
            tags="${tags},${image}:${MINOR},${image}:${MAJOR}"
          fi
          description="Verifiable Credentials Adapters: ${SERVICE} service"
          if [ -f "vca/services/${SERVICE}/README.md" ]; then
            first=$(grep -m1 -E '^[^#[:space:]]' "vca/services/${SERVICE}/README.md" || true)
            [ -n "$first" ] && description="$first"
          fi
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "image=$image"
            echo "tags=$tags"
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=vca-${SERVICE}"
            echo "org.opencontainers.image.description=${description}"
            echo "org.opencontainers.image.version=${FULL}"
            echo "org.opencontainers.image.revision=${SHA}"
            echo "org.opencontainers.image.source=https://github.com/${REPO}"
            echo "org.opencontainers.image.licenses=Apache-2.0"
            echo "org.opencontainers.image.created=${created}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: vca
          file: vca/services/${{ matrix.service }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.full }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=vca-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=vca-${{ matrix.service }}

      - name: Trivy image scan (blocking)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # The Dockerfile checks run in vca-ci on the files themselves,
          # with the scoped ignore file. Run on an image, the same checks
          # read the image history, where the ignore file cannot name a
          # path, so an accepted finding would block every release.
          scanners: vuln,secret

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign image (keyless)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: vca-${{ matrix.service }}-${{ needs.version.outputs.full }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: vca-${{ matrix.service }}-${{ needs.version.outputs.full }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM attestations
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          SPDX: vca-${{ matrix.service }}-${{ needs.version.outputs.full }}.spdx.json
          CDX: vca-${{ matrix.service }}-${{ needs.version.outputs.full }}.cdx.json
        run: |
          cosign attest --yes --type spdxjson --predicate "$SPDX" "$REF"
          cosign attest --yes --type cyclonedx --predicate "$CDX" "$REF"
          cosign verify-attestation --type spdxjson \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$REF" >/dev/null

      - name: Record digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p dist
          echo "${IMAGE}@${DIGEST} ${TAGS}" > "dist/vca-${{ matrix.service }}.digest"
          mv ./*.spdx.json ./*.cdx.json dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.service }}
          path: dist/*
          if-no-files-found: error

  cli:
    name: cli ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: version
    if: needs.version.outputs.has_cli == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: vca/go.mod
          cache-dependency-path: vca/go.mod

      - name: go build
        working-directory: vca
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.full }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p ../dist
          out="../dist/vca_${VERSION}_${GOOS}_${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.revision=${SHA}" \
            -o "$out" ./cmd/vca
          (cd ../dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  charts:
    name: helm charts
    needs: version
    if: needs.version.outputs.has_charts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: helm lint + package
        env:
          BARE: ${{ needs.version.outputs.bare }}
        run: |
          mkdir -p dist
          for chart in deploy/vca/helm/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm lint "$chart"
            helm package "$chart" --version "$BARE" --app-version "$BARE" --destination dist
          done
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charts
          path: dist/*
          if-no-files-found: error

  release:
    name: github release
    needs: [version, images, cli, charts]
    # Run when every needed job passed or was skipped because it had nothing to do.
    if: >-
      always()
      && needs.version.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          echo "previous tag: ${prev:-<none>}"
          ./vca/hack/release-notes.sh "$prev" "$TAG" "$TAG" > release-notes.md
          {
            echo
            echo "### Images"
            echo
            for f in dist/*.digest; do
              [ -f "$f" ] || continue
              awk '{print "- `" $1 "`"}' "$f"
            done
            echo
            echo "Verify a signature with:"
            echo
            echo '```'
            echo "cosign verify --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com <image@digest>"
            echo '```'
          } >> release-notes.md
          cat release-notes.md
          ls -l dist || true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: false
          files: |
            dist/*
